  /* ============================================================
     MASTER SETS — one stamped plan, built many ways

     READ THIS BEFORE WIRING A UI TO IT.

     A production builder does not own a plan. He owns a MASTER SET: one plan,
     stamped once, built across ELEVATIONS (A/B/C — different roof forms and
     porch configurations over the same footprint) and structural OPTIONS
     (bonus room over the garage, extended covered patio, 4th bedroom, tile
     instead of shingle). Sizing the base case and letting an option move a
     bearing is how a revision gets manufactured after permit, and that is the
     most expensive line item in this model. So the variants are first-class
     data, not a note on a drawing.

     ---- what a plan declares ----

       plan.elevations : [Variant]   mutually exclusive. Exactly one is `base`.
                                     Their takeRates are a MIX and must sum to 1.
       plan.options    : [Variant]   independently selectable upgrades.
       plan.geometry   : the plan's own stated dimensions. NOT a weight and it
                         carries no class marker, for the same reason `span` and
                         `trib` do not: it is the design, not an estimate of the
                         world. Every span, tributary and count on the plan is
                         derived from it and the derivation is on the mark.

     A Variant is plain data:

       { id            "a" | "opt-tile"    unique across BOTH lists, no "+"
         kind          "elevation" | "option"
         label         what the builder calls it
         takeRate      [market] share of lots. Elevations: the mix, summing to
                       1.00. Options: the attach rate. A commercial estimate
                       with no code standing, like every other market number
                       in this file.
         base          elevations only — the stamped case the plan.marks ARE
         note          why it exists and what it does structurally
         movesNoMember true when the variant deliberately moves nothing this
                       engine sizes. REQUIRED when it touches no mark: a
                       variant that changes nothing and does not say so is
                       indistinguishable from one nobody checked, and the
                       helpers throw rather than let it pass.
         overrides     { "MARK-ID": { field: value, ... } }  patches on marks
                       that already exist. Absolute values, never deltas, so
                       applying twice is applying once.
         add           [ {full mark record} ]  marks only this variant builds
         remove        [ "MARK-ID" ]           marks this variant deletes
         roofAssemblyKey  an ASSEMBLY key replacing the pack's roof covering
                       for this variant. This is how tile is modelled: it
                       reaches every roof-carrying mark at once, including a
                       lanai beam, where it maps to the open-roof tile
                       assembly. Distinct from `mark.roofAssembly: "open"`,
                       which says there is no ceiling underneath — a different
                       question with a different answer.
         requiresElevation [ids]  options only — elevations that offer it
         excludes          [ids]  options only — mutually exclusive siblings

     Every one of those is validated. An override or a remove naming a mark the
     plan does not have, an added mark colliding with an existing id, an unknown
     assembly key, a duplicate variant id, an elevation mix that does not sum to
     1.00, an option that excludes itself — all throw. A typo in a master set is
     a member that is silently never checked, which is the exact failure class
     this file exists to make impossible.

     ---- what the UI consumes ----

       FM.weights.variantsFor(plan)
         { planId, elevations[], options[], combinations[], solvedFor, note }

         `elevations` and `options` are the declared set, normalised, each with
         an `overrides` map EXPANDED to every mark the variant moves — including
         marks it adds, marks it removes, and, for a roof-covering variant,
         every roof-carrying mark on the plan. That map is READ-ONLY reporting
         ("which marks move across this set"); the authored patch data is kept
         beside it under `declared`.

         `combinations` is the buildable list: every elevation on its own, every
         elevation with each option it offers, and — because that is where the
         revisions come from — every compatible PAIR of options that touches a
         common mark. Pass { combos: "all" } for the full power set, or
         { combos: "none" } for elevations only. Each entry:

           { id "c+opt-tile", planId, kind: "combination", label,
             elevationId, optionIds[], isBase, takeRate, lotsExpected,
             touches[], movesNoMember, roofAssemblyKey, notes[] }

         takeRate on a combination is the share of lots that include ALL of its
         parts — not the share configured exactly that way. Option rates are
         treated as independent and conditional on the elevation, which is a
         planning simplification and [market] like everything under it.

       FM.weights.planForVariant(plan, variantId)
         A plain plan object with the overrides applied, the removals gone and
         the additions in. Feed it straight to FM.solver.solvePlan(vp, pack) —
         the solver is untouched and does not know variants exist. It carries
         `variant` (the descriptor) and `ofPlan` (the base plan id).

       FM.weights.variantPlansFor(plan, opts)   the same, for every combination

       FM.weights.markFor(plan, markId, variantId)      resolved mark, or null
       FM.weights.demandFor(mark, plan, pack, variantId)  resolve, then size

       FM.weights.envelopeFor(plan, markId, pack, opts)
         The envelope report for ONE mark across the whole buildable set.

     ---- what the envelope does, and what it refuses to do ----

     The obvious implementation — take the worst span, the worst tributary and
     the heaviest assembly across the variants and size that — invents a member
     for a house nobody builds, and then quietly ships the extra depth on every
     lot. This one does not do that.

     envelopeFor() reports each variant's demand, and names a GOVERNING variant
     only when one of them dominates every other on every driver at once: span,
     tributary, dead, live, roof load and bearing all at least as large, depth
     budget no larger, and the same member regime (same `carries`, same
     deflection row, same duration factor, same service and bracing
     assumptions). Under those conditions a member that passes the governing
     variant passes all of them, because every load combination's demand is
     monotone in each driver and the capacity side is identical. That is a
     provable statement, and it is the only one this file is willing to make.

     When no variant dominates — Elevation B of the coastal duplex gets MORE
     tributary and LESS span than Elevation A, because a deeper porch buys a
     fourth post — it returns split: true and says so. The honest answer there
     is to size each variant and take the deepest pick:

         var vs = FM.weights.variantsFor(plan).combinations;
         var runs = vs.map(function (v) {
           return { v: v, r: FM.solver.solvePlan(
                             FM.weights.planForVariant(plan, v.id), pack) };
         });

     which is three lines, uses the solver unmodified, and gives a real answer
     per lot instead of a composite one for none of them.
     ============================================================ */

  function K(id) { return " " + id; }          /* author strings are never bare keys */
  function hasK(o, id) { return Object.prototype.hasOwnProperty.call(o, K(id)); }

  function shallowCopy(o) {
    var out = {}, k;
    for (k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
    return out;
  }

  function carriesOf(mark) {
    return mark.carries ||
      (Object.prototype.hasOwnProperty.call(CARRIES_DEFAULT, mark.role) ? CARRIES_DEFAULT[mark.role] : null);
  }
  /* which marks a change of roof COVERING reaches */
  function takesRoofCovering(mark) {
    var c = carriesOf(mark);
    return c === "roof" || c === "roof+floor";
  }

  var SYNTHETIC_BASE = {
    id: "base", kind: "elevation", base: true, takeRate: 1.0, synthetic: true,
    label: "As stamped",
    note: "This plan declares no elevations, so the stamped base case is the only variant."
  };

  /* built once per plan object, and it validates while it builds */
  var VCACHE = { keys: [], vals: [] };

  function variantIndex(plan) {
    var at = VCACHE.keys.indexOf(plan);
    if (at !== -1) return VCACHE.vals[at];
    var idx = buildVariantIndex(plan);
    VCACHE.keys.push(plan);
    VCACHE.vals.push(idx);
    return idx;
  }

  function buildVariantIndex(plan) {
    if (!plan || !plan.marks || !plan.marks.length) {
      throw new Error("the master-set helpers need a plan with marks");
    }
    var where = "plan " + (plan.id || "(no id)");
    var marksById = {};
    plan.marks.forEach(function (m) {
      if (hasK(marksById, m.id)) throw new Error(where + " declares two marks with id \"" + m.id + "\"");
      marksById[K(m.id)] = m;
    });

    var els = plan.elevations || [];
    var opts = plan.options || [];
    var ids = {};

    function checkCommon(v, kind) {
      if (!v || typeof v !== "object") throw new Error(where + " has a malformed " + kind);
      if (!v.id || typeof v.id !== "string") throw new Error(where + " has an " + kind + " with no id");
      if (v.id.indexOf("+") !== -1) {
        throw new Error(where + " " + kind + " id \"" + v.id + "\" contains '+', which is what " +
                        "composes a variant id — pick another");
      }
      if (hasK(ids, v.id)) {
        throw new Error(where + " declares two variants with id \"" + v.id + "\" — elevation and " +
                        "option ids share one namespace because a variant id names both");
      }
      ids[K(v.id)] = kind;
      if (!v.label) throw new Error(where + " " + kind + " \"" + v.id + "\" has no label");
      var tr = Number(v.takeRate);
      if (!isFinite(tr) || tr < 0 || tr > 1) {
        throw new Error(where + " " + kind + " \"" + v.id + "\" needs a takeRate in [0,1] — it is a " +
                        "[market] share of lots and the whole option model is priced off it");
      }
      if (v.roofAssemblyKey) {
        if (!Object.prototype.hasOwnProperty.call(ASSEMBLY, v.roofAssemblyKey)) {
          throw new Error(where + " " + kind + " \"" + v.id + "\" names unknown assembly \"" +
                          v.roofAssemblyKey + "\"");
        }
      }
      /* an added mark may be patched by the same variant that adds it */
      var localAdds = {};
      (v.add || []).forEach(function (m) {
        if (!m || !m.id) throw new Error(where + " " + kind + " \"" + v.id + "\" adds a mark with no id");
        if (hasK(marksById, m.id)) {
          throw new Error(where + " " + kind + " \"" + v.id + "\" adds mark \"" + m.id +
                          "\", which the base plan already has — patch it with `overrides` instead");
        }
        if (hasK(localAdds, m.id)) {
          throw new Error(where + " " + kind + " \"" + v.id + "\" adds mark \"" + m.id + "\" twice");
        }
        localAdds[K(m.id)] = true;
      });
      (v.remove || []).forEach(function (id) {
        if (!hasK(marksById, id)) {
          throw new Error(where + " " + kind + " \"" + v.id + "\" removes mark \"" + id +
                          "\", which is not on the plan");
        }
      });
      var ov = v.overrides || {};
      Object.keys(ov).forEach(function (id) {
        if (!hasK(marksById, id) && !hasK(localAdds, id)) {
          throw new Error(where + " " + kind + " \"" + v.id + "\" overrides mark \"" + id +
                          "\", which is not on the plan and is not added by this variant. A patch " +
                          "on a mark that does not exist is a member nobody checks.");
        }
        var p = ov[id];
        if (p && p.roofAssemblyKey &&
            !Object.prototype.hasOwnProperty.call(ASSEMBLY, p.roofAssemblyKey)) {
          throw new Error(where + " " + kind + " \"" + v.id + "\" sets unknown assembly \"" +
                          p.roofAssemblyKey + "\" on " + id);
        }
      });

      var touches = touchesOf(plan, v);
      if (!touches.length && !v.base && !v.movesNoMember) {
        throw new Error(where + " " + kind + " \"" + v.id + "\" moves no mark and does not declare " +
                        "`movesNoMember: true`. Say which it is — a variant that changes nothing " +
                        "and does not say so is indistinguishable from one nobody checked.");
      }
      if (touches.length && v.movesNoMember) {
        throw new Error(where + " " + kind + " \"" + v.id + "\" declares `movesNoMember: true` but " +
                        "moves " + touches.join(", "));
      }
    }

    var bases = 0, mix = 0;
    els.forEach(function (v) {
      checkCommon(v, "elevation");
      if (v.base) bases++;
      mix += Number(v.takeRate);
      if (v.requiresElevation || v.excludes) {
        throw new Error(where + " elevation \"" + v.id + "\" declares requiresElevation or excludes — " +
                        "elevations are already mutually exclusive");
      }
    });
    if (els.length) {
      if (bases !== 1) {
        throw new Error(where + " declares " + bases + " base elevations; exactly one must carry " +
                        "`base: true`, because the plan's own marks ARE that elevation");
      }
      if (Math.abs(mix - 1) > 0.001) {
        throw new Error(where + " elevation takeRates sum to " + mix.toFixed(3) +
                        ", not 1.000 — they are a mix of the lots, not independent attach rates");
      }
    }

    opts.forEach(function (v) {
      checkCommon(v, "option");
      if (v.base) throw new Error(where + " option \"" + v.id + "\" is marked base; only an elevation can be");
      (v.requiresElevation || []).forEach(function (e) {
        if (!els.some(function (x) { return x.id === e; })) {
          throw new Error(where + " option \"" + v.id + "\" requires elevation \"" + e + "\", which does not exist");
        }
      });
      (v.excludes || []).forEach(function (o) {
        if (o === v.id) throw new Error(where + " option \"" + v.id + "\" excludes itself");
        if (!opts.some(function (x) { return x.id === o; })) {
          throw new Error(where + " option \"" + v.id + "\" excludes \"" + o + "\", which does not exist");
        }
      });
    });

    return {
      plan: plan,
      marksById: marksById,
      elevations: els.length ? els : [SYNTHETIC_BASE],
      options: opts,
      syntheticBase: !els.length
    };
  }

  /* every mark this variant moves, including the ones a roof-covering change
     reaches without naming */
  function touchesOf(plan, v) {
    var seen = {}, out = [];
    function add(id) { if (!hasK(seen, id)) { seen[K(id)] = true; out.push(id); } }
    Object.keys(v.overrides || {}).forEach(add);
    (v.remove || []).forEach(add);
    (v.add || []).forEach(function (m) { add(m.id); });
    if (v.roofAssemblyKey) {
      plan.marks.forEach(function (m) { if (takesRoofCovering(m)) add(m.id); });
      (v.add || []).forEach(function (m) { if (takesRoofCovering(m)) add(m.id); });
    }
    return out;
  }

  /* the read-only reporting shape: `overrides` expanded to every mark that
     moves, with the authored data kept beside it */
  function publicVariant(plan, v) {
    var expanded = {};
    var removed = {}, added = {};
    (v.remove || []).forEach(function (id) { removed[K(id)] = true; });
    (v.add || []).forEach(function (m) { added[K(m.id)] = true; });
    touchesOf(plan, v).forEach(function (id) {
      var p = shallowCopy((v.overrides || {})[id] || {});
      if (hasK(removed, id)) p.removedByVariant = true;
      if (hasK(added, id)) p.addedByVariant = true;
      if (v.roofAssemblyKey && !p.roofAssemblyKey) p.roofAssemblyKey = v.roofAssemblyKey;
      expanded[id] = p;
    });
    return {
      id: v.id,
      kind: v.kind || (v.base || v.synthetic ? "elevation" : "option"),
      label: v.label,
      takeRate: Number(v.takeRate),
      takeRateCls: "market",
      base: !!v.base,
      note: v.note || "",
      movesNoMember: !!v.movesNoMember,
      roofAssemblyKey: v.roofAssemblyKey || null,
      requiresElevation: v.requiresElevation || null,
      excludes: v.excludes || null,
      touches: touchesOf(plan, v),
      /* READ-ONLY: which marks move. Not a patch source — use `declared`. */
      overrides: expanded,
      declared: { overrides: v.overrides || {}, add: v.add || [], remove: v.remove || [],
                  roofAssemblyKey: v.roofAssemblyKey || null }
    };
  }

  function elevationById(idx, id) {
    return idx.elevations.filter(function (e) { return e.id === id; })[0] || null;
  }
  function optionById(idx, id) {
    return idx.options.filter(function (o) { return o.id === id; })[0] || null;
  }
  function offeredOn(option, elevation) {
    return !option.requiresElevation || option.requiresElevation.indexOf(elevation.id) !== -1;
  }
  function compatible(a, b) {
    return (a.excludes || []).indexOf(b.id) === -1 && (b.excludes || []).indexOf(a.id) === -1;
  }

  /* "c+opt-tile" -> the elevation and the options, validated as a buildable
     combination. An empty/absent id is the base elevation with no options. */
  function partsOf(plan, variantId) {
    var idx = variantIndex(plan);
    var raw = (variantId === undefined || variantId === null) ? "" : String(variantId);
    var ids = raw.length ? raw.split("+") : [];
    var el;
    if (!ids.length) {
      el = idx.elevations.filter(function (e) { return e.base; })[0] || idx.elevations[0];
    } else {
      el = elevationById(idx, ids[0]);
      if (!el) {
        throw new Error("plan " + plan.id + " has no elevation \"" + ids[0] + "\" (variant \"" +
                        raw + "\"); a variant id is elevation first, then options");
      }
    }
    var seen = {}, options = [];
    ids.slice(1).forEach(function (oid) {
      var o = optionById(idx, oid);
      if (!o) throw new Error("plan " + plan.id + " has no option \"" + oid + "\" (variant \"" + raw + "\")");
      if (hasK(seen, oid)) throw new Error("variant \"" + raw + "\" names option \"" + oid + "\" twice");
      seen[K(oid)] = true;
      if (!offeredOn(o, el)) {
        throw new Error("option \"" + oid + "\" is not offered on elevation \"" + el.id + "\"");
      }
      options.forEach(function (p) {
        if (!compatible(p, o)) {
          throw new Error("options \"" + p.id + "\" and \"" + oid + "\" are mutually exclusive");
        }
      });
      options.push(o);
    });
    return { idx: idx, elevation: el, options: options, all: [el].concat(options) };
  }

  function descriptorFor(plan, elId, optIds) {
    var vid = [elId].concat(optIds || []).join("+");
    var p = partsOf(plan, vid);
    var take = Number(p.elevation.takeRate);
    p.options.forEach(function (o) { take *= Number(o.takeRate); });
    var touches = {}, order = [], roofKey = null, notes = [];
    p.all.forEach(function (v) {
      touchesOf(plan, v).forEach(function (id) {
        if (!hasK(touches, id)) { touches[K(id)] = true; order.push(id); }
      });
      if (v.roofAssemblyKey) roofKey = v.roofAssemblyKey;
      if (v.note) notes.push({ from: v.id, label: v.label, text: v.note });
    });
    return {
      id: vid,
      planId: plan.id,
      kind: "combination",
      label: p.all.map(function (v) { return v.label; }).join(" + "),
      elevationId: p.elevation.id,
      optionIds: p.options.map(function (o) { return o.id; }),
      isBase: !!p.elevation.base && !p.options.length,
      takeRate: take,
      takeRateCls: "market",
      takeRateBasis: "Elevation mix x option attach rates, treated as independent and conditional " +
                     "on the elevation. It is the share of lots that include ALL of these parts, " +
                     "not the share configured exactly this way. [market] — a commercial estimate " +
                     "with no code standing.",
      lotsExpected: isFinite(plan.lots) ? Math.round(plan.lots * take) : null,
      touches: order,
      movesNoMember: order.length === 0,
      roofAssemblyKey: roofKey,
      notes: notes
    };
  }

  function variantsFor(plan, opts) {
    opts = opts || {};
    var idx = variantIndex(plan);
    var mode = opts.combos || "single";
    var combos = [];

    idx.elevations.forEach(function (el) {
      combos.push(descriptorFor(plan, el.id, []));
      if (mode === "none") return;
      var offered = idx.options.filter(function (o) { return offeredOn(o, el); });
      offered.forEach(function (o) { combos.push(descriptorFor(plan, el.id, [o.id])); });

      if (mode === "all") {
        /* full power set, size >= 2, honouring excludes */
        var n = offered.length, mask, i, pick;
        for (mask = 0; mask < (1 << n); mask++) {
          pick = [];
          for (i = 0; i < n; i++) if (mask & (1 << i)) pick.push(offered[i]);
          if (pick.length < 2) continue;
          var ok = true;
          pick.forEach(function (a) {
            pick.forEach(function (b) { if (a !== b && !compatible(a, b)) ok = false; });
          });
          if (ok) combos.push(descriptorFor(plan, el.id, pick.map(function (o) { return o.id; })));
        }
      } else {
        /* Pairs are not decoration. A revision comes from two options landing on
           the SAME mark from opposite directions — tile driving a header deeper
           while an 8 ft head height caps how deep it may be. Emit exactly those. */
        for (var a = 0; a < offered.length; a++) {
          for (var b = a + 1; b < offered.length; b++) {
            if (!compatible(offered[a], offered[b])) continue;
            var ta = touchesOf(plan, offered[a]), tb = touchesOf(plan, offered[b]);
            var shares = ta.some(function (id) { return tb.indexOf(id) !== -1; });
            if (shares) combos.push(descriptorFor(plan, el.id, [offered[a].id, offered[b].id]));
          }
        }
      }
    });

    return {
      planId: plan.id,
      declaresVariants: !idx.syntheticBase || !!idx.options.length,
      elevations: idx.elevations.map(function (v) { return publicVariant(plan, v); }),
      options: idx.options.map(function (v) { return publicVariant(plan, v); }),
      combinations: combos,
      combos: mode,
      solvedFor: plan.variant ? (plan.variant.label || plan.variant.id) : undefined,
      lots: isFinite(plan.lots) ? plan.lots : null,
      note: "Elevations are mutually exclusive and their takeRates are the lot mix. Options are " +
            "independent attach rates. Both are [market] estimates and neither has code standing. " +
            "`combinations` is what the builder actually builds; feed each id to planForVariant() " +
            "and the result straight to FM.solver.solvePlan()."
    };
  }

  function applyTo(out, patch) {
    var k;
    for (k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) out[k] = patch[k];
    return out;
  }

  function resolveMark(plan, mark, parts, variantId) {
    var out = shallowCopy(mark);
    parts.all.forEach(function (v) {
      /* the variant's roof covering, unless the mark names its own */
      if (v.roofAssemblyKey && !out.roofAssemblyKey) out.roofAssemblyKey = v.roofAssemblyKey;
      var patch = (v.overrides || {})[mark.id];
      if (patch) applyTo(out, patch);
    });
    if (variantId) { out.variantId = variantId; out.baseMarkId = mark.id; }
    return out;
  }

  function markFor(plan, markId, variantId) {
    var parts = partsOf(plan, variantId);
    var removed = false, found = null;
    parts.all.forEach(function (v) {
      (v.remove || []).forEach(function (id) { if (id === markId) removed = true; });
      (v.add || []).forEach(function (m) { if (m.id === markId) found = m; });
    });
    if (removed) return null;
    if (!found) found = parts.idx.marksById[K(markId)] || null;
    if (!found) return null;
    return resolveMark(plan, found, parts, variantId);
  }

  function planForVariant(plan, variantId) {
    if (plan.ofPlan) {
      throw new Error("plan " + plan.id + " is already a variant of " + plan.ofPlan +
                      " — take variants of the master set, not of a variant");
    }
    var parts = partsOf(plan, variantId);
    var d = descriptorFor(plan, parts.elevation.id, parts.options.map(function (o) { return o.id; }));

    var removed = {}, adds = [], addSeen = {};
    parts.all.forEach(function (v) {
      (v.remove || []).forEach(function (id) { removed[K(id)] = v.id; });
      (v.add || []).forEach(function (m) {
        if (hasK(addSeen, m.id)) {
          throw new Error("variant \"" + d.id + "\" of plan " + plan.id + " adds mark \"" + m.id +
                          "\" from two parts at once");
        }
        addSeen[K(m.id)] = true;
        adds.push(m);
      });
    });

    var marks = [];
    plan.marks.forEach(function (mk) {
      if (hasK(removed, mk.id)) return;
      marks.push(resolveMark(plan, mk, parts, d.id));
    });
    adds.forEach(function (mk) {
      if (hasK(removed, mk.id)) return;
      marks.push(resolveMark(plan, mk, parts, d.id));
    });

    return merge(plan, {
      id: plan.id + "--" + d.id.replace(/[^a-zA-Z0-9._-]+/g, "-"),
      name: plan.name + " · " + d.label,
      summary: plan.summary + " — " + d.label,
      marks: marks,
      variant: d,
      ofPlan: plan.id,
      lots: d.lotsExpected === null ? plan.lots : d.lotsExpected
    });
  }

  function variantPlansFor(plan, opts) {
    return variantsFor(plan, opts).combinations.map(function (v) {
      return planForVariant(plan, v.id);
    });
  }

  /* the drivers a simple-span uniformly loaded member's demand is monotone in.
     Bigger is worse for all of them except maxDepthIn, where smaller is. */
  var ENVELOPE_DRIVERS = ["span", "trib", "dead", "live", "roofLoad"];

  /* two variants are only comparable by driver if they are the same KIND of
     member — the same deflection row, duration factor, service condition and
     bracing assumption. Otherwise the capacity side moves too and dominance on
     the load side proves nothing. */
  function regimeOf(d) {
    return [d.carries, d.memberUse, d.roofType, d.repetitive ? 1 : 0,
            d.wet ? 1 : 0, d.braced ? 1 : 0, d.treated ? 1 : 0].join("/");
  }

  function envelopeFor(plan, markId, pack, opts) {
    var vs = variantsFor(plan, opts).combinations;
    var rows = vs.map(function (v) {
      var row = { variantId: v.id, label: v.label, takeRate: v.takeRate,
                  lotsExpected: v.lotsExpected, present: true, sized: false };
      var mk = markFor(plan, markId, v.id);
      if (!mk) {
        row.present = false;
        row.note = "Not built in this variant.";
        return row;
      }
      row.mark = mk;
      var appl = applicability(mk, pack);
      if (!appl.applicable) {
        row.notSized = { reason: appl.reason, note: appl.note };
        return row;
      }
      var d = demandFor(mk, plan, pack);
      row.sized = true;
      row.demand = d;
      row.regime = regimeOf(d);
      row.drivers = {
        span: Number(d.span) || 0,
        trib: Number(d.trib) || 0,
        dead: Number(d.dead) || 0,
        live: Number(d.live) || 0,
        roofLoad: Number(d.roofLoad) || 0,
        bearing: Number(d.bearing) || 0,
        maxDepthIn: d.maxDepthIn === undefined || d.maxDepthIn === null ? Infinity : Number(d.maxDepthIn)
      };
      return row;
    });

    var sized = rows.filter(function (r) { return r.sized; });
    var out = {
      planId: plan.id, markId: markId, packId: pack.id,
      variants: rows,
      builtOn: rows.filter(function (r) { return r.present; }).length,
      absentOn: rows.filter(function (r) { return !r.present; }).map(function (r) { return r.variantId; }),
      sizedOn: sized.length
    };

    if (!sized.length) {
      out.split = false;
      out.governedBy = null;
      out.note = "This mark is not sized in any variant — see the per-variant reason. Nothing to " +
                 "envelope.";
      return out;
    }

    /* worst value of each driver, and who supplies it */
    var worst = {};
    ["span", "trib", "dead", "live", "roofLoad", "bearing", "maxDepthIn"].forEach(function (k) {
      var smallerIsWorse = (k === "maxDepthIn" || k === "bearing");
      var best = null;
      sized.forEach(function (r) {
        var v = r.drivers[k];
        if (best === null || (smallerIsWorse ? v < best : v > best)) best = v;
      });
      worst[k] = { value: best, smallerIsWorse: smallerIsWorse,
                   by: sized.filter(function (r) { return r.drivers[k] === best; })
                            .map(function (r) { return r.variantId; }) };
    });
    out.drivers = worst;

    var regimes = {};
    sized.forEach(function (r) { regimes[K(r.regime)] = true; });
    var oneRegime = Object.keys(regimes).length === 1;

    function dominates(a, b) {
      var ok = true;
      ENVELOPE_DRIVERS.forEach(function (k) { if (a.drivers[k] < b.drivers[k]) ok = false; });
      if (a.drivers.bearing > b.drivers.bearing) ok = false;      /* less bearing is worse */
      if (a.drivers.maxDepthIn > b.drivers.maxDepthIn) ok = false; /* less depth budget is worse */
      return ok;
    }

    var gov = oneRegime ? sized.filter(function (a) {
      return sized.every(function (b) { return a === b || dominates(a, b); });
    })[0] : null;

    if (gov) {
      out.split = false;
      out.governedBy = gov.variantId;
      out.governing = gov;
      out.note = "One variant governs: \"" + gov.label + "\" is at least as severe as every other " +
                 "buildable variant on span, tributary, dead, live and roof load, gives away no " +
                 "bearing and no depth budget, and is the same kind of member (" + gov.regime +
                 "). Demand is monotone in each of those and the capacity side is identical, so a " +
                 "member that passes this variant passes all " + sized.length + ". Size this one " +
                 "and the master set is covered.";
    } else {
      out.split = true;
      out.governedBy = null;
      out.note = "NO SINGLE VARIANT GOVERNS" +
        (oneRegime ? ". " : " — and the variants are not even the same kind of member (" +
                     Object.keys(regimes).length + " regimes), so the capacity side moves too. ") +
        "The drivers pull in different directions across the set, so there is no one demand that " +
        "covers it. This tool will NOT compose a maximum out of them: the worst span from one " +
        "elevation with the worst tributary from another is a member for a house nobody builds, " +
        "and it ships the extra depth on every lot. Size each variant — " +
        "FM.solver.solvePlan(FM.weights.planForVariant(plan, id), pack) — and take the deepest " +
        "pick. The per-variant demands are in `variants` and the worst value of each driver, with " +
        "the variant that supplies it, is in `drivers`.";
    }
    return out;
  }

  /* ---------------- assembly ---------------- */

  function merge() {
    var out = {}, i, k, src;
    for (i = 0; i < arguments.length; i++) {
      src = arguments[i];
      if (!src) continue;
      for (k in src) if (Object.prototype.hasOwnProperty.call(src, k)) out[k] = src[k];
    }
    return out;
  }

  function packById(id) { return PACKS.filter(function (p) { return p.id === id; })[0] || null; }
  function planById(id) { return PLANS.filter(function (p) { return p.id === id; })[0] || null; }

  function policyFor(pack, plan, role) {
    var weights = merge(BASE.weights, pack.weights, plan && plan.weights);
    function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined; }
    var ladder = own(LADDERS, role) || LADDERS.rafter;
    var spacings = own(REPETITIVE, role) ? (own(SPACINGS, role) || [16, 24]) : [0];

    return {
      id: pack.id + (role ? ":" + role : ""),
      name: pack.name + (role ? " · " + role : ""),
      role: role || null,
      maxDCR: (plan && plan.maxDCR) || pack.maxDCR || BASE.maxDCR,
      minAvailability: pack.minAvailability === undefined ? BASE.minAvailability : pack.minAvailability,
      specialOrderBelow: pack.specialOrderBelow === undefined ? BASE.specialOrderBelow : pack.specialOrderBelow,
      gammaPcf: pack.gammaPcf || BASE.gammaPcf,
      palette: pack.palette,
      ladder: ladder,
      spacings: spacings,
      weights: weights,
      incisedWhenTreated: INCISED_WHEN_TREATED,
      unifyBonus: UNIFY_BONUS,
      priceOf: function (cand, demand) {
        var p = pack.palette.filter(function (x) {
          return x.species === cand.species && x.grade === cand.grade;
        })[0];
        /* the treated channel, not the wet-service one. A treated-but-dry porch
           beam is stocked as treated; keying this off moisture made the flagship
           Texas lanai beam a special order in the one market that racks it. */
        var channel = (demand && (demand.treated || demand.wet)) ? STOCK.wet : STOCK.dry;
        var sizeAvail = Object.prototype.hasOwnProperty.call(channel, cand.size)
          ? channel[cand.size] : 0.25;
        if (!isFinite(sizeAvail)) sizeAvail = 0.25;
        return {
          bfUSD: p && isFinite(p.bfUSD) ? p.bfUSD : weights.baseBfUSD,
          cullRate: p && isFinite(p.cullRate) ? p.cullRate : 0,
          availability: (p && isFinite(p.stockFactor) ? p.stockFactor : 0.5) * sizeAvail
        };
      }
    };
  }

  function demandFor(mark, plan, pack, variantId) {
    /* A master set is one plan built many ways. Passing `variantId` resolves the
       mark against that elevation/option set FIRST and then sizes what the
       builder will actually build on that lot. Omitting it sizes the stamped
       base case, which is what the solver does today — the fourth argument is
       additive and every existing three-argument call is unchanged. */
    if (variantId && plan) {
      var rv = markFor(plan, mark.id, variantId);
      if (!rv) {
        throw new Error("mark " + mark.id + " is not built in variant \"" + variantId +
                        "\" of plan " + plan.id + " — it is removed by that elevation or option, " +
                        "so it has no demand there");
      }
      mark = rv;
    }
    var role = mark.role;
    var L = pack.loads;
    function assembly(name) {
      /* a typo throws loudly; a prototype key used to return silently and
         launder into a dead load of zero. Both must fail the same way. */
      if (!Object.prototype.hasOwnProperty.call(ASSEMBLY, name)) {
        throw new Error("unknown assembly \"" + name + "\" in pack " + pack.id);
      }
      return ASSEMBLY[name].psf;
    }
    /* The roof covering is the one assembly a plan OPTION changes — tile over
       shingle is the single largest gravity difference in this product, and the
       fl-hvhz pack already says so. A mark (or the variant that resolved it)
       may therefore name its own roof assembly; absent that, the pack's. Note
       that `mark.roofAssembly === "open"` is a different field with a different
       job — it says there is no ceiling under this member, not which covering
       is on top of it. */
    var roofKey = mark.roofAssemblyKey || L.roofAssembly;
    var roofDead = assembly(roofKey);
    var floorDead = assembly(mark.floorAssembly || L.floorAssembly);
    var ceilingDead = assembly(L.ceilingAssembly);

    var d = {
      role: role,
      span: mark.span,
      trib: mark.trib || 0,
      repetitive: Object.prototype.hasOwnProperty.call(REPETITIVE, role) ? !!REPETITIVE[role] : false,
      wet: mark.exposure === "exterior" ? !!pack.service.exteriorWet : !!pack.service.wet,
      braced: mark.braced === undefined ? true : !!mark.braced,
      /* a header bears on jack studs — 1.5 in per jack, not the 3.5 in a beam
         gets on a post cap. Defaulting a header to 3.5 in was 2.33x optimistic
         on bearing, which is the governing check more often than it looks. */
      /* Bearing became a DESIGN INPUT the moment the header default moved to one
         jack stud: it governs 3 of 66 picks and produced 4 of 24 escalations, and
         no mark declared it. Same ruling as `carries` — a header must state its
         jack count rather than inherit one. */

    if (mark.underdetermined) {
      throw new Error("mark " + mark.id + " is underdetermined and must not be sized: " +
                      (mark.underdeterminedNote || UNDETERMINED_GENERIC));
    }
    if (role === "header" && !mark.bearing) {
      throw new Error("header " + mark.id + " must declare `bearing` (jack studs x 1.5 in) — " +
                      "it governs the check and produced false escalations as a silent default");

      (Object.prototype.hasOwnProperty.call(CARRIES_DEFAULT, role) ? CARRIES_DEFAULT[role] : null);

      throw new Error("mark " + mark.id + " is a " + role + " and must declare what it carries");

    }
    d.carries = carries;
    d.memberUse = mark.memberUse || DEFL_BY_CARRIES[carries] || "floor";

    /* Treatment, not moisture, is what forces incising — and it is what decides
       which stock channel the member comes out of. A treated-but-dry porch beam
       in the I-35 corridor is still treated. */
    d.treated = mark.treated !== undefined ? !!mark.treated : (mark.exposure === "exterior");

    /* a header's depth budget is set by the plate and the head height, less a
       double top plate and a shim. A member that does not fit is not a cheaper
       member — it is a plate-height change and a revision. */
    if (mark.maxDepthIn) d.maxDepthIn = mark.maxDepthIn;
    else if (mark.headHeightIn && pack.plateHeightIn) {
      d.maxDepthIn = pack.plateHeightIn - mark.headHeightIn - 3.0 - 0.5;
    }

    /* a porch or lanai beam carries an OPEN roof — no ceiling, no insulation.
       Which covering is on it still matters: tile over an open lanai is 17 psf
       against shingle's 10. Keyed off the EFFECTIVE roof assembly so a tile
       OPTION reaches the lanai beam, not just the pack that ships tile. */
    if (mark.roofAssembly === "open") {
      roofDead = assembly(roofKey === "roof_tile" ? "roof_open_tile" : "roof_open");
    }
    d.roofAssemblyKey = roofKey;

    if (carries === "roof" || carries === "roof-open") {
      d.dead = roofDead; d.live = 0; d.roofLoad = L.roofLoad;
    } else if (carries === "ceiling") {
      d.dead = ceilingDead; d.live = L.ceilingLive; d.roofLoad = 0; d.roofType = "snow";
    } else if (carries === "floor") {
      d.dead = floorDead; d.live = L.floorLive; d.roofLoad = 0; d.roofType = "snow";
    } else if (carries === "deck") {
      d.dead = ASSEMBLY.deck_pt.psf; d.live = L.deckLive; d.roofLoad = 0; d.roofType = "snow";
    } else if (carries === "roof+floor") {
      /* Two load paths with two different tributary widths cannot be expressed by
         one number: HDR-1 meant the floor tributary and HDR-SLD meant the sum, and
         the model applied both full load sets over whichever it was given. The
         engine takes one tributary, so convert exactly — total line load is
         q_roof*t_roof + q_floor*t_floor, expressed as psf over t = t_roof + t_floor. */

      if (!(tR >= 0) || !(tF >= 0) || !(tR + tF > 0)) {

      var tT = tR + tF;
      d.trib = tT;
      d.roofLoadActual = L.roofLoad;   /* the advisory must see the real load, not the blend */
      d.tribRoof = tR; d.tribFloor = tF;
      d.dead = (roofDead * tR + floorDead * tF) / tT;
      d.live = (L.floorLive * tF) / tT;
      d.roofLoad = (L.roofLoad * tR) / tT;
    } else {
      d.dead = roofDead; d.live = 0; d.roofLoad = L.roofLoad;
    }

  }

  /* a mark can be structurally irrelevant in a region — a wood exterior header
     in a concrete-block market is not a member anybody will build */
  function applicability(mark, pack, plan, variantId) {
    if (variantId && plan) {
      var rv = markFor(plan, mark.id, variantId);
      if (!rv) {
        return { applicable: false, reason: "not-in-variant", note:
          "NOT BUILT IN THIS VARIANT — the elevation or option set \"" + variantId + "\" removes " +
          "this mark. It is not a failure and not out of scope; those lots simply do not have this " +
          "member. It stays on the master set because other lots do." };

      return { applicable: false, reason: "underdetermined",
               note: mark.underdeterminedNote || UNDETERMINED_GENERIC };
    }

      return { applicable: false, reason: "out-of-scope", note: mark.componentNote };
    }

               "Manufactured component — designed by its supplier as a deferred sealed submittal." };
    }

       rule used to fire on every header in a block market, which deleted the
       second-floor window headers and the interior roof+floor headers — the very
       members the pack's own note says ARE wood. A mark must opt in by declaring
       itself exterior and first-floor. */

        mark.wallPosition === "exterior-first-floor") {
      return { applicable: false, reason: "wall-system", note: pack.exteriorWallNote ||
               "First-floor exterior walls are concrete block in this market; this opening is spanned by a concrete lintel, not a wood header." };
    }
    return { applicable: true };
  }

  FM.weights = {
    BASE: BASE, PACKS: PACKS, PLANS: PLANS,
    ASSEMBLY: ASSEMBLY, LIVE: LIVE, STOCK: STOCK,
    LADDERS: LADDERS, SPACINGS: SPACINGS, REPETITIVE: REPETITIVE,
    CARRIES_DEFAULT: CARRIES_DEFAULT, DEFL_BY_CARRIES: DEFL_BY_CARRIES,
    UNIFY_BONUS: UNIFY_BONUS,
    INCISED_WHEN_TREATED: INCISED_WHEN_TREATED,
    policyFor: policyFor, demandFor: demandFor, applicability: applicability,
    packById: packById, planById: planById,

    /* master sets — see the contract block above variantsFor() */
    variantsFor: variantsFor,
    planForVariant: planForVariant,
    variantPlansFor: variantPlansFor,
    markFor: markFor,
    envelopeFor: envelopeFor

<script>
/* ============================================================
   Sizing solver — the search that proposes a member; the engine
   is still the only thing that decides whether it passes.

   Two rules govern everything in this file:

     1. The solver never computes a capacity. Every feasibility
        verdict comes from FM.engine.run(), unmodified. The solver
        chooses WHICH members to ask about and in WHAT order.
     2. The weights order the feasible set. They cannot promote an
        infeasible member: feasibility is tested before scoring and
        no weight participates in that test. (Enforced by test
        "weights cannot select an overstressed member".)

   weight model is in solver-spec.md.
   ============================================================ */

(function () {
  "use strict";

  var GAMMA_PCF = 35;          /* calc-spec §1.3 — editable assumption, not a sourced value */
  var EPS = 1e-9;

  function nominalDims(nominal) {
    var m = /^(\d+)x(\d+)$/.exec(nominal || "");
    return m ? { b: Number(m[1]), d: Number(m[2]) } : null;
  }

     so the piece that shows up on the invoice is longer than the span. */
  function stockLength(spanFt) {
    var need = spanFt + 0.5;                  /* bearing at both ends */
    var len = Math.ceil(need / 2) * 2;

       gave it a NEGATIVE drop cost — the longest stick the yard racks is a
       supply constraint (availability), not a discount. */
    return Math.max(8, len);

     The seed bounds in §H1 must be taken against the SAME envelope the check
     uses. This used to be a second implementation here, kept honest by a test
     that compared the two — and it earned its keep: the moment engine.js went
     from four combinations to six, that test caught the drift. The right fix is
     not a better mirror but no mirror at all, so the engine now exports its
     builder and this delegates. One implementation cannot drift from itself. */

  function combosFor(D, L, Lr, roofType, qS) {
    var qLr, snow;
    if (qS !== undefined) { qLr = Lr; snow = qS; }
    else if (roofType === "roof_live") { qLr = Lr; snow = 0; }
    else { qLr = 0; snow = Lr; }
    return FM.engine.buildCombos(D, L, qLr, snow).map(function (c) {
      return { label: c.label, psf: c.psf, cd: c.cd.v, id: c.id };
    });
  }

  /* ---------- demand → engine inputs ----------
     One place builds engine inputs, so the number the solver scored and the
     number the sheet re-checks can never disagree. */

  function tribFt(demand, cand) {

  }

  /* calc-spec §1.3 case (b): a beam's own weight is NOT inside q_D, and it
     depends on the section — so the demand is a function of the candidate.
     Expressed as psf over the tributary width, the engine's w = psf · t_w
     reproduces w_sw = γ·A/144 exactly. */
  function selfWeightPsf(demand, cand, policy) {
    if (demand.repetitive) return 0;
    var sec = FM.engine.findSection(cand.size);
    var t = tribFt(demand, cand);

    var gamma = (policy && policy.gammaPcf) || GAMMA_PCF;

  }

  /* `Number(x) || 0` turns NaN into 0, which designs the member for no load.
     engine.js refuses a NaN load — but only if it ever sees one, and this is the
     only path the product actually uses, so the laundering happened here first.
     Pass the value through untouched and let the engine refuse it. */
  function num(v, dflt) {
    if (v === undefined || v === null) return dflt;
    return Number(v);
  }

  function memberInputs(demand, cand, policy) {
    var sw = selfWeightPsf(demand, cand, policy);
    return {
      species: cand.species, grade: cand.grade, size: cand.size,
      span: demand.span,
      spacing: demand.repetitive ? cand.spacing : Number(demand.trib || 0) * 12,
      dead: num(demand.dead, 0) + sw,
      live: num(demand.live, 0),
      roofLoad: num(demand.roofLoad, 0),
      roofType: demand.roofType || "snow",
      repetitive: !!demand.repetitive,
      wet: !!demand.wet,
      braced: !!demand.braced,
      bearing: num(demand.bearing, 1.5),
      memberUse: demand.memberUse || "floor",
      CF: "auto",                      /* the depth moves, so C_F must move with it */
      /* a refractory species must be incised to take preservative, so a treated
         mark in one carries C_i = 0.80 on F_b and F_v (NDS Table 4.3.8). This
         used to be handled by excluding the species; it is now checked. */

     across candidate sets. Nothing here is a code value; see weights.js. */

  function costOf(demand, cand, policy) {
    var w = policy.weights;
    var sec = FM.engine.findSection(cand.size);

    var len = stockLength(demand.span);
    var bf = boardFeetPerLF(cand.size) * len;
    var lb = (policy.gammaPcf || GAMMA_PCF) * sec.A_in2 / 144 * len;

    var priced = policy.priceOf ? policy.priceOf(cand, demand) : null;
    var bfUSD = priced && isFinite(priced.bfUSD) ? priced.bfUSD : w.baseBfUSD;
    var availability = priced && isFinite(priced.availability) ? priced.availability : 1;
    var cullRate = priced && isFinite(priced.cullRate) ? priced.cullRate : 0;

                                 : Number(demand.trib || 1) * demand.span;
    if (!(area > 0)) area = 1;

    /* Material is charged over the FULL stock length, because that is the stick
       you buy — the drop is already paid for. `dropHandling` is therefore not a
       second charge for the lumber (that was a double-count); it prices sorting,
       stacking and disposing of the offcut, net of whatever gets used elsewhere.
       A `waste: 1.10` weight in the estimating sense does not belong here. */
    var material = bf * bfUSD * w.material * (1 + cullRate);
    var labor = laborPerPiece(demand, w) + w.laborPerLb * lb;
    var drop = (len - demand.span) * boardFeetPerLF(cand.size) * bfUSD * w.dropHandling;
    var depth = sec.d_in * depthWeight(demand, w) * area;
    var stock = (1 - Math.max(0, Math.min(1, availability))) * w.stockPenaltySf * area;

    var total = material + labor + drop + depth + stock + risk;
    /* THE RANKING UNIT. A piece at 16" o.c. and a piece at 24" o.c. do not do the
       same amount of work, so ranking two spacings on per-piece cost silently
       prefers the tighter one — which is how the solver came to recommend 16" o.c.
       roofs to markets that sheathe everything at 24". Repetitive members are
       ranked per square foot of framed area; single members per piece. */
    var unit = demand.repetitive ? area : 1;

      totalUSD: total, unitUSD: total / unit, perSF: total / area, area: area, unit: unit,
      lengthFt: len, boardFeet: bf, weightLb: lb,
      terms: { material: material, labor: labor, drop: drop, depth: depth, stock: stock, risk: risk },
      bfUSD: bfUSD, availability: availability, cullRate: cullRate, cfBasis: cf.basis

     depth costs building height while a roof member's does not. Both weights are
     therefore keyed by role, falling back to the flat value. */
  function laborPerPiece(demand, w) {
    var byRole = w.laborPerPieceByRole || {};

    return isFinite(v) ? v : w.laborPerPiece;
  }
  function depthWeight(demand, w) {
    var byRole = w.depthPerInchSfByRole || {};
    var v = own(byRole, demand.role);
    return isFinite(v) ? v : w.depthPerInchSf;
  }
  /* author-supplied strings are used as keys throughout; a mark whose role or

  function own(o, k) {

  function slackPenalty(dcr, policy) {

     Each bound is taken against the MOST favourable material in the palette and

     omitting it keeps the bound low, i.e. safe.

     the score AND the complete feasible set, candidate for candidate. */

    var D = num(demand.dead, 0), L = num(demand.live, 0), Lr = num(demand.roofLoad, 0);

    var best = { Fb: 0, Fv: 0, E: 0, Fcp: 0 };
    policy.palette.forEach(function (p) {
      policy.ladder.forEach(function (size) {
        var sec = FM.engine.findSection(size);
        if (!sec) return;
        var mat = FM.engine.findValues(p.species, p.grade, sec.d_in, sec.b_in);
        if (!mat) return;

        var v = mat.values_psi;

           overstate capacity for a species that will be checked incised. Using the
           MAXIMUM across the palette keeps it optimistic, which is the safe side. */
        var inc = isIncised(demand, { species: p.species }, policy);
        var fb = v.Fb * cf.CF * (inc ? 0.80 : 1);
        var fv = v.Fv * (inc ? 0.80 : 1);

        if (fv > best.Fv) best.Fv = fv;

      var wTot = (D + L + Lr) * t / 12;

      at: function (sp) { return bySpacing[String(sp || 0)] || bySpacing[String(spacings[0])]; },
      best: best, combos: combos, target: target,
      deflection: { row: demand.memberUse || "floor", live: use.live, total: use.total, cite: use.cite }
    };

  function passesBounds(cand, bounds, demandBearing) {
    var s = FM.engine.findSection(cand.size);
    if (!s) return { ok: false, why: "no section properties" };
    var b = bounds.at(cand.spacing);
    if (!b) return { ok: true };
    if (s.Sx_in3 < b.S_req - EPS) return { ok: false, why: "S_x below the palette's best-case bending requirement" };
    if (s.Ix_in4 < b.I_req - EPS) return { ok: false, why: "I_x below the deflection requirement" };
    if (s.A_in2 < b.A_req - EPS) return { ok: false, why: "A below the shear requirement" };
    if (s.b_in < b.b_req - EPS) {
      /* Bearing is NOT a section wall. Every rung in a header ladder is the same
         breadth, so a bearing shortfall empties the whole ladder and then gets
         reported as a stiffness problem — while the solver's own repair table
         says of bearing "depth does nothing". Classify it separately so the
         answer is "this header needs a second jack stud", not "buy an LVL". */
      return { ok: false, why: "breadth " + s.b_in.toFixed(2) + " in is below the " +
               b.b_req.toFixed(3) + " in the bearing reaction needs at l_b = " +
               Number(demandBearing).toFixed(2) + " in", bearing: true };

  }

     A family is one (species, grade, thickness, spacing). Within a family the
     only free axis is depth, and cost is checked to be nondecreasing in depth
     before any dominance pruning is applied to it (see H2 in solver-spec.md). */

  /* ---------- eligibility gates ----------
     Three things disqualify a candidate before any structural question is asked.
     They are gates, not costs, because none of them is a trade-off the weights
     get to make. Each returns the reason in the engineer's language. */

  function eligibility(cand, demand, policy) {
    /* geometry — a header has a depth budget set by the plate and head heights,
       and a member that does not fit is not a cheaper member, it is no member */
    if (demand.maxDepthIn && cand.d_in > Number(demand.maxDepthIn) + EPS) {
      return { ok: false, kind: "geometry",
               why: cand.size + " is " + cand.d_in.toFixed(2) + " in deep; only " +
                    Number(demand.maxDepthIn).toFixed(2) + " in is available above the head height" };
    }

    /* procurement — a member the yard cannot hand the framer gets substituted in
       the field, and the substitute is nobody's design */
    if (policy.minAvailability !== undefined && policy.priceOf) {
      var pr = policy.priceOf(cand, demand);
      if (pr && isFinite(pr.availability) && pr.availability < policy.minAvailability) {
        /* Printed to enough places to stay TRUE. At two it produced
           "availability 0.10 is below the firm floor of 0.10" — a sentence
           that refutes itself on screen, on the one card the demo dwells on.
           Availability is a product of stock and size factors and lands on
           values like 0.0995; the comparison is exact, so the display has to
           be too. Trailing zeros are trimmed so the common cases stay short. */
        var trim = function (v) {
          return Number(v).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
        };
        return { ok: false, kind: "procurement",
                 why: "availability " + trim(pr.availability) + " is below the firm floor of " +
                      trim(policy.minAvailability) + " — special order, and the field will substitute" };
      }
    }

    return { ok: true };
  }

  function families(demand, policy) {
    var spacings = demand.repetitive ? policy.spacings : [null];
    var out = [], excluded = [];
    policy.palette.forEach(function (p, pi) {
      spacings.forEach(function (sp) {
        var byThickness = {};
        policy.ladder.forEach(function (size) {
          var sec = FM.engine.findSection(size);
          if (!sec) return;
          var cand = {
            species: p.species, grade: p.grade, size: size,
            spacing: sp === null ? 0 : sp,
            b_in: sec.b_in, d_in: sec.d_in, paletteIndex: pi
          };
          var e = eligibility(cand, demand, policy);
          if (!e.ok) {
            if (sp === null || sp === spacings[0]) excluded.push({ cand: cand, kind: e.kind, why: e.why });
            return;
          }
          var key = String(sec.b_in);
          if (!byThickness[key]) byThickness[key] = [];
          byThickness[key].push(cand);
        });
        Object.keys(byThickness).forEach(function (k) {
          var rungs = byThickness[k].sort(function (a, b) { return a.d_in - b.d_in; });
          out.push({
            id: p.species + " " + p.grade + " · " + k + " in thick" + (sp ? " @ " + sp + " o.c." : ""),
            species: p.species, grade: p.grade, thickness: Number(k),
            spacing: sp === null ? 0 : sp, rungs: rungs
          });
        });
      });
    });
    out.excluded = excluded;
    return out;
  }

  /* ---------- H4: which axis to step when a check fails ----------
     Sensitivity of each limit state to depth, from the closed forms in
     calc-spec §3: deflection goes as d³, bending as d², shear as d¹, bearing
     not at all. Used to explain a failure and to propose the next move — never
     to skip an evaluation. */

  var REPAIR = {
    "Deflection (live)":  { axis: "depth",   exponent: 3, move: "go deeper (I ∝ d³) or tighten spacing" },
    "Deflection (total)": { axis: "depth",   exponent: 3, move: "go deeper (I ∝ d³) or tighten spacing" },
    "Bending":            { axis: "depth",   exponent: 2, move: "go deeper (S ∝ d²) or up a grade — F_b moves most between grades" },
    "Shear":              { axis: "area",    exponent: 1, move: "more area — thicker stock helps as much as deeper" },
    "Bearing (Fc⊥)":      { axis: "bearing", exponent: 0, move: "lengthen the bearing or widen the member — depth does nothing" }
  };

  /* Why a mark has no member — one vocabulary for the screen and the paper.

     These are not five flavours of the same answer. "The ladder has nothing
     strong enough" and "a member passes but your availability floor excludes
     it" are opposite findings: one needs a bigger section, the other needs a
     phone call to the yard. The screen distinguished them and the export
     printed a flat "— ESCALATED —" over all of them, which erased exactly the
     distinction the escalation exists to make. */
  var ESCALATION = {
    "escalate:strength":    { badge: "strength",    tag: "NO SECTION STRONG ENOUGH",
                              short: "nothing in the ladder passes the governing check" },
    "escalate:procurement": { badge: "procurement", tag: "EXCLUDED BY AVAILABILITY",
                              short: "a member passes — the availability floor excludes it" },
    "escalate:bearing":     { badge: "bearing",     tag: "BEARING, NOT SIZE",
                              short: "the bearing length governs; a deeper member cannot fix it" },
    "escalate:geometry":    { badge: "geometry",    tag: "DEPTH NOT AVAILABLE",
                              short: "no section fits the depth the condition allows" },
    "escalate:input":       { badge: "input",       tag: "INPUT INCOMPLETE",
                              short: "the demand is underdetermined — nothing was searched" }
  };
  function escalationOf(status) {
    return ESCALATION[status] ||
      { badge: "escalate", tag: "ESCALATED", short: "no member was selected" };
  }

  var GATE_MOVE = {
    geometry:    "raise the plate height, drop the head height, or flush-frame the condition",
    procurement: "confirm the yard will stock it, or lower the availability floor deliberately",
    /* `scope` is retained for a gate that may return it in future; no gate does
       today, because the incising exclusion became a computed C_i factor. */
    scope:       "check it by hand against the factor this engine does not implement"
  };

  /* ---------- the search ---------- */

  function size(demand, policy) {
    if (!FM.engine) throw new Error("solver requires FM.engine");
    /* calc-spec §6.2: DCR <= 1.000 passes, with no tolerance band. A firm may
       set a TIGHTER target; it may not set a looser one. */
    if (!(policy.maxDCR > 0) || policy.maxDCR > 1) {
      policy = shallow(policy);
      policy.maxDCR = Math.min(1, Math.max(0.01, Number(policy.maxDCR) || 0.9));
    }
    var cache = {}, stats = { evaluated: 0, contextEvaluated: 0, cacheHits: 0, prunedByBound: 0,
                              prunedByDominance: 0, prunedByIncumbent: 0, prunedByGate: 0, families: 0 };

    /* calc-spec §2.1 wants six combinations built from separate q_Lr and q_S; the
       engine carries ONE roof load tagged either snow or roof-live, so D + Lr and
       D + S can never be evaluated together. Near the 20 psf roof-live minimum
       either tag is unconservative on one limit state: declared roof-live, snow
       understates bending by up to 8.4%; declared snow, roof-live understates
       deflection. Make the exposure visible instead of silent. */
    var advisories = [];
    /* For a roof+floor mark the roof load is blended into an equivalent psf over
       the summed tributary, so `demand.roofLoad` reads ~14.8 where the member
       carries 20. Testing the blended number switched this advisory off on the
       marks that carry two load paths — including nc-mountain, the one pack
       where the collapse changes the answer. */
    var rl = num(demand.roofLoadActual !== undefined ? demand.roofLoadActual : demand.roofLoad, 0);
    if (rl > 0 && rl >= 16 && rl <= 25) {
      advisories.push({
        kind: "roof-load-crossover",
        text: "Roof load " + rl.toFixed(0) + " psf sits near the 20 psf roof-live minimum, where the " +
              "snow and roof-live cases cross. This engine evaluates only the one you declared (" +
              (demand.roofType === "snow" ? "snow, C_D 1.15" : "roof live, C_D 1.25") + "), so " +
              (demand.roofType === "snow"
                ? "the roof-live case — which governs deflection below 20 psf — was not checked."
                : "the snow case — which governs bending above about 18.4 psf — was not checked.") +
              " Check the other case by hand before this member is used."
      });
    }

    /* if the demand itself is not numeric, no candidate can be checked and none
       should be proposed — refuse the whole search rather than the members */
    var badLoad = ["dead", "live", "roofLoad", "span", "bearing"].filter(function (k) {
      return demand[k] !== undefined && demand[k] !== null && !isFinite(Number(demand[k]));
    });
    if (badLoad.length) {
      return { demand: demand, status: "escalate:input", pick: null, feasible: [], rejected: [],
               advisories: advisories, stats: { evaluated: 0 }, searchSpace: 0,
               policy: { id: policy.id, name: policy.name, maxDCR: policy.maxDCR,
                         ladder: policy.ladder, spacings: policy.spacings, palette: [] },
               note: { wall: "the demand is not numeric: " + badLoad.join(", "),
                       move: "correct the input", counts: {},
                       outOfScope: "Nothing was checked. A member was not proposed." } };
    }

    var bounds = seedBounds(demand, policy);
    var boundPruned = [];
    var fams = families(demand, policy);
    stats.families = fams.length;

    function evaluate(cand) {
      var inputs = memberInputs(demand, cand, policy);
      var key = JSON.stringify(inputs);
      if (cache[key]) { stats.cacheHits++; return cache[key]; }
      stats.evaluated++;
      var r = FM.engine.run(inputs);
      cache[key] = { result: r, inputs: inputs };
      return cache[key];
    }

    /* cost is engine-free, so a family's whole cost vector is known before any
       check runs — which is what makes the dominance and incumbent pruning below
       exact rather than heuristic guesses */
    fams.forEach(function (fam) {
      fam.rungs.forEach(function (c) { c.cost = costOf(demand, c, policy); });
      fam.admissible = fam.rungs.filter(function (c) {
        var pb = passesBounds(c, bounds, demand.bearing);
        if (!pb.ok) boundPruned.push({ cand: c, reason: pb.why, bound: !pb.bearing, bearing: !!pb.bearing });
        return pb.ok;
      });
      fam.monotone = true;
      for (var i = 1; i < fam.rungs.length; i++) {
        if (fam.rungs[i].cost && fam.rungs[i - 1].cost &&
            fam.rungs[i].cost.unitUSD < fam.rungs[i - 1].cost.unitUSD - EPS) { fam.monotone = false; break; }
      }
      fam.lowerBoundUSD = fam.admissible.reduce(function (m, c) {
        return c.cost && c.cost.unitUSD < m ? c.cost.unitUSD : m;
      }, Infinity);
      stats.prunedByBound += fam.rungs.length - fam.admissible.length;
    });

    /* H3: cheapest-possible-family first, so the incumbent gets good early and
       prunes hard */
    fams.sort(function (a, b) {
      if (a.lowerBoundUSD !== b.lowerBoundUSD) return a.lowerBoundUSD - b.lowerBoundUSD;
      return a.id < b.id ? -1 : 1;
    });

    var considered = [], rejected = [], incumbent = null;

    /* candidates that never reached the engine because a gate disqualified them.
       They belong in the record: "we did not check a 4x14" is a different
       statement from "a 4x14 failed", and an engineer needs to know which. */
    (fams.excluded || []).forEach(function (x) {
      stats.prunedByGate++;
      rejected.push({ cand: x.cand, dcr: null, governing: null, gate: x.kind,
                      reason: x.why, next: GATE_MOVE[x.kind] || null });
    });

    fams.forEach(function (fam) {
      if (incumbent && fam.lowerBoundUSD > incumbent.score + EPS) {
        stats.prunedByIncumbent += fam.admissible.length;
        return;
      }
      for (var i = 0; i < fam.admissible.length; i++) {
        var cand = fam.admissible[i];

        if (incumbent && cand.cost.unitUSD > incumbent.score + EPS) {
          /* "rungs are depth-ordered, so cost only grows" is exactly the
             property fam.monotone verifies — and it is not free. A per-size
             price vector (short supply on one rung, clearance on another) makes
             cost non-monotone, and breaking here on that family skips cheaper
             rungs below. Skip this candidate, but keep walking the family. */
          if (fam.monotone) {
            stats.prunedByIncumbent += fam.admissible.length - i;
            break;
          }
          stats.prunedByIncumbent++;
          continue;
        }

        var ev = evaluate(cand);
        var r = ev.result;

        if (r.error) {
          rejected.push({ cand: cand, reason: r.message, dcr: null, governing: null });
          continue;
        }
        var dcr = r.governing.dcr;
        var ok = isFinite(dcr) && dcr <= policy.maxDCR + EPS;
        var row = {
          cand: cand, dcr: dcr, governing: r.governing.name, combo: r.governing.combo,
          kind: r.governing.kind, cost: cand.cost, feasible: ok,
          warnings: r.warnings || [], inputs: ev.inputs,
          checks: r.checks.map(function (c) { return { name: c.name, dcr: c.dcr }; })
        };
        considered.push(row);

        if (!ok) {
          var rep = REPAIR[r.governing.name] || { move: "no repair rule for this limit state" };
          rejected.push({
            cand: cand, dcr: dcr, governing: r.governing.name,
            reason: (r.governing.kind === "service" ? "exceeds the deflection limit" : "overstressed") +
                    " at DCR " + dcr.toFixed(3) + " (target " + policy.maxDCR.toFixed(2) + ")",
            next: rep.move
          });
          continue;
        }

        /* score is the ranking objective, in $/sf for repetitive members and
           $/piece for single ones. pieceScore stays absolute, because SKU
           unification and the plan cost rollup are per-piece questions. */
        row.pieceScore = cand.cost.totalUSD + slackPenalty(dcr, policy);
        row.score = row.pieceScore / cand.cost.unit;
        /* tieBreak decides ties, not losses — reaching it on a strictly worse
           score would let a more expensive candidate take the incumbency */
        if (!incumbent || row.score < incumbent.score - EPS ||
            (Math.abs(row.score - incumbent.score) <= EPS && tieBreak(row, incumbent) < 0)) {
          incumbent = row;
        }

        /* H2 dominance: within a family, deeper rungs cost at least as much as
           this one, so none of them can win. Only applied where the family's
           cost vector was actually verified nondecreasing. */
        if (fam.monotone) {
          stats.prunedByDominance += fam.admissible.length - i - 1;
          break;
        }
      }
    });

    /* ---- explain pass ----
       The search above is an optimiser: it proves which candidate wins while
       evaluating as few as it can. That is the right behaviour for a solver and
       the wrong behaviour for a sheet an engineer has to sign, because it can
       return a single row with nothing to compare it against.

       So after the winner is settled, fill in the rest of the admissible ladder
       for display. These evaluations are counted separately — they are context,
       not search — and they are walked in a fixed order that does not depend on
       the weights, so the ladder an engineer sees is the same ladder regardless
       of what the prices are set to. */
    var budget = policy.explainBudget === undefined ? 40 : policy.explainBudget;
    var seen = {};
    considered.forEach(function (c) { seen[keyOf(c.cand)] = true; });

    /* bound-pruned candidates enter the record too — "we never checked a 2x6
       because no 2x6 can reach the required S_x" is an answer */
    boundPruned.forEach(function (bp) {
      rejected.push({ cand: bp.cand, dcr: null, governing: null,
                      bound: bp.bound, gate: bp.bearing ? "bearing" : undefined,
                      reason: bp.reason,
                      next: bp.bearing ? "lengthen the bearing — a second jack stud, not a deeper section"
                                       : "a deeper or stronger section" });
    });

    var ordered = fams.slice().sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
    var context = [], exhausted = true;
    for (var fi = 0; fi < ordered.length; fi++) {
      var frows = ordered[fi].admissible;
      for (var ci = 0; ci < frows.length; ci++) {
        var cc = frows[ci];
        if (seen[keyOf(cc)]) continue;
        if (context.length >= budget) { exhausted = false; fi = ordered.length; break; }
        seen[keyOf(cc)] = true;
        var cev = evaluate(cc);
        stats.contextEvaluated++;
        if (cev.result.error) {
          rejected.push({ cand: cc, reason: cev.result.message, dcr: null, governing: null, context: true });
          continue;
        }
        var cdcr = cev.result.governing.dcr;
        var cok = isFinite(cdcr) && cdcr <= policy.maxDCR + EPS;
        var crow = {
          cand: cc, dcr: cdcr, governing: cev.result.governing.name, combo: cev.result.governing.combo,
          kind: cev.result.governing.kind, cost: cc.cost, feasible: cok, context: true,
          warnings: cev.result.warnings || [], inputs: cev.inputs,
          checks: cev.result.checks.map(function (c) { return { name: c.name, dcr: c.dcr }; })
        };
        if (cok) {
          crow.pieceScore = cc.cost.totalUSD + slackPenalty(cdcr, policy);
          crow.score = crow.pieceScore / cc.cost.unit;
        }
        else {
          var crep = REPAIR[cev.result.governing.name] || { move: "no repair rule for this limit state" };
          rejected.push({
            cand: cc, dcr: cdcr, governing: cev.result.governing.name,
            reason: (crow.kind === "service" ? "exceeds the deflection limit" : "overstressed") +
                    " at DCR " + cdcr.toFixed(3) + " (target " + policy.maxDCR.toFixed(2) + ")",
            next: crep.move, context: true
          });
        }
        context.push(crow);
      }
    }
    stats.ladderComplete = exhausted;

    var feasible = considered.concat(context).filter(function (c) { return c.feasible; })
      .sort(function (a, b) { return a.score - b.score || tieBreak(a, b); });

    /* self-check: the search claimed optimality, the context pass evaluated more.
       Compare on score AND tie-break, because agreeing on score while disagreeing
       on which member won is exactly the defect this guards. */
    stats.searchOptimal = !incumbent || !feasible.length ||
      (feasible[0] === incumbent) ||
      (Math.abs(feasible[0].score - incumbent.score) <= 1e-9 && tieBreak(feasible[0], incumbent) === 0);

    /* The pick is the head of the ranked list, full stop. Returning the search
       incumbent instead let the recommendation disagree with the table printed
       beside it whenever two candidates tied exactly on score — the incumbent
       was chosen in search order, the list by tieBreak. */
    var pick = feasible[0] || null;

    /* End reactions are the currency of coordination. The truss supplier, the
       EWP supplier and the foundation engineer all need the number in pounds at
       each bearing — not the member size — and the engine already computes it.
       Publishing it is nearly free and is the most useful thing this output can
       hand a production builder. */
    var reactions = pick ? endReactions(demand, pick, policy) : null;

    /* Escalation is a status, not a footnote. A plan with an escalation is not
       a finished schedule and must not read like one. */
    /* B-1: a candidate excluded at the procurement gate was rejected BEFORE any
       engine call. Naming it "the member that passes" was an assertion about a
       member nobody checked — and measured across 112 escalations, 82% of those
       named were overstressed, one at DCR 2.025. Check them, then name only the
       ones that actually passed. */
    var gatedPassing = [], gatedFailing = [];
    if (!pick) {
      rejected.forEach(function (r) {
        if (r.gate !== "procurement") return;
        var gev = evaluate(r.cand);
        stats.contextEvaluated++;
        if (gev.result.error || !isFinite(gev.result.governing.dcr)) { r.checkedDcr = null; return; }
        r.checkedDcr = gev.result.governing.dcr;
        r.checkedGoverning = gev.result.governing.name;
        if (r.checkedDcr <= policy.maxDCR + EPS) gatedPassing.push(r); else gatedFailing.push(r);
      });
    }

    /* Report the wall that actually stopped the search, in this order:
         strength   nothing in the ladder reaches the required section, or every
                    evaluated candidate was overstressed — a real engineering wall
         procurement a member PASSED but the availability floor excluded it
         geometry    a member would fit structurally but not physically
       Falling through to whichever gate happened to appear in the rejection list
       produced "lower your availability floor" as the advice for a member that
       was 4% short on section modulus. */
    /* B-2: ONE classifier produces both the status and the note. They used to be
       decided independently and disagreed — `escalate:strength` was set first on
       any evaluated candidate, so three of the four statuses were unreachable
       while the note took a different branch in the same object. */
    var status = "ok", blocked = null;
    if (!pick) {
      var bearingWall = rejected.filter(function (r) { return r.gate === "bearing"; });
      if (gatedPassing.length)        status = "escalate:procurement";
      else if (bearingWall.length && !considered.length) status = "escalate:bearing";
      else if (rejected.some(function (r) { return r.gate === "geometry"; }) && !considered.length)
                                      status = "escalate:geometry";
      else {
        status = "escalate:strength";
        blocked = boundWall(bounds, policy, policy.ladder);
      }
    }

    return {
      demand: demand,
      status: status,
      advisories: advisories,
      blocked: blocked,
      reactions: reactions,
      policy: { id: policy.id, name: policy.name, maxDCR: policy.maxDCR,
                ladder: policy.ladder, spacings: policy.spacings,
                palette: policy.palette.map(function (p) { return p.species + " " + p.grade; }) },
      pick: pick,
      feasible: feasible,
      rejected: rejected,
      bounds: bounds,
      stats: stats,
      /* `evaluated` is every engine run, which includes the explain pass — and
         the explain pass re-runs candidates the search had already pruned by
         dominance or incumbent, so it double-counts them against the space.
         The trace needs the SEARCH's own evaluations to make its arithmetic
         close, so name that number rather than making each reader derive it. */
      searchEvaluated: Math.max(0, (stats.evaluated || 0) - (stats.contextEvaluated || 0)),
      /* The WHOLE candidate population, gate-excluded ones included.

         It used to count only the rungs that survived eligibility, so the
         trace card printed "search space 14 · cut by seed bounds 14 · engine
         evaluations 2 · rejected 10 of 16" — 14 + 2 = 16 out of a space of 14,
         under a footer reading "every cut is exact, no candidate was dropped
         on a guess." The cuts WERE exact; the denominator was two candidates
         short, because a gate removes a candidate before the family that would
         have counted it is built. A trace whose own arithmetic does not close
         is worth less than no trace, so the space is now everything that was
         ever a candidate and `prunedByGate` is its own line. */
      searchSpace: fams.reduce(function (n, f) { return n + f.rungs.length; }, 0) +
                   ((fams.excluded || []).length),
      note: feasible.length ? null
        : noFeasibleNote(demand, policy, rejected, blocked, status, gatedPassing, gatedFailing),
    };
  }

  /* R = w·L/2 per bearing, at the governing combination — calc-spec §3.2.
     Reported unreduced: the §3.4.3.1 d-reduction is a shear allowance and must
     never be applied to a bearing reaction. */
  function endReactions(demand, row, policy) {
    var D = Number(row.inputs.dead || 0), L = Number(row.inputs.live || 0),
        Lr = Number(row.inputs.roofLoad || 0);
    var combos = combosFor(D, L, Lr, row.inputs.roofType);
    var t = row.inputs.spacing / 12;
    var worst = null;
    combos.forEach(function (c) {
      var R = (c.psf * t) * demand.span / 2;
      if (!worst || R > worst.lb) worst = { lb: R, combo: c.label, psf: c.psf };
    });
    return {
      perBearingLb: worst ? worst.lb : null,
      combo: worst ? worst.combo : null,
      note: "Unreduced support reaction at each bearing, governing gravity combination. " +
            "Hand this to the truss, EWP or connector designer — the connection is not designed here."
    };
  }

  /* When the seed bounds emptied the ladder, name the section property that did
     it and by how much — "no section reaches S_x = 76.95 in³" is an answer; a
     gate label is not. */
  /* Rank by how far SHORT the ladder falls, not by which number is numerically
     largest. Comparing in³ against in⁴ against in² meant I_x won essentially
     always — it was named in 17 of 17 reports, including the ones where the
     ladder cleared it with 25% to spare. Bearing is excluded: it is not a
     property of the section. */
  function boundWall(bounds, policy, ladder) {
    var best = { Sx: 0, Ix: 0, A: 0 };
    (ladder || []).forEach(function (sz) {
      var sec = FM.engine.findSection(sz);
      if (!sec) return;
      if (sec.Sx_in3 > best.Sx) best.Sx = sec.Sx_in3;
      if (sec.Ix_in4 > best.Ix) best.Ix = sec.Ix_in4;
      if (sec.A_in2 > best.A) best.A = sec.A_in2;
    });
    var worst = null;
    Object.keys(bounds.bySpacing).forEach(function (k) {
      var b = bounds.bySpacing[k];
      [["S_x", "in³", b.S_req, best.Sx], ["I_x", "in⁴", b.I_req, best.Ix], ["A", "in²", b.A_req, best.A]]
        .forEach(function (t) {
          if (!(t[3] > 0)) return;
          var ratio = t[2] / t[3];
          if (ratio <= 1 + EPS) return;                 /* the ladder satisfies it — not a wall */
          if (!worst || ratio > worst.ratio) {
            worst = { prop: t[0], unit: t[1], value: t[2], available: t[3], ratio: ratio, spacing: k };
          }
        });
    });
    return worst ? {
      property: worst.prop, required: worst.value, available: worst.available,
      unit: worst.unit, shortfall: worst.ratio,
      text: "the deepest section in the ladder gives " + worst.available.toFixed(2) + " " +
            worst.unit + " of " + worst.prop + " and this member needs " +
            worst.value.toFixed(2) + " — short by " + Math.round((worst.ratio - 1) * 100) +

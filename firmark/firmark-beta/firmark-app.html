            "% at the firm's DCR target of " + policy.maxDCR.toFixed(2)
    } : null;
  }

  /* deterministic all the way down — same inputs, same schedule, every run */
  function tieBreak(a, b) {
    if (a.cand.d_in !== b.cand.d_in) return a.cand.d_in - b.cand.d_in;
    if (a.cand.b_in !== b.cand.b_in) return a.cand.b_in - b.cand.b_in;
    if (a.cand.paletteIndex !== b.cand.paletteIndex) return a.cand.paletteIndex - b.cand.paletteIndex;
    if (a.cand.spacing !== b.cand.spacing) return b.cand.spacing - a.cand.spacing;
    return a.cand.size < b.cand.size ? -1 : (a.cand.size > b.cand.size ? 1 : 0);
  }

  /* When nothing fits, say which wall the search hit and what would move it.
     A solver that only reports "no solution" is telling the engineer nothing. */
  function noFeasibleNote(demand, policy, rejected, blocked, status, gatedPassing, gatedFailing) {
    if (status === "escalate:procurement") {
      var names = gatedPassing.map(function (r) {
        return skuOf(r.cand) + " (checked, DCR " + r.checkedDcr.toFixed(3) + ")";
      }).join(", ");
      var alsoTried = gatedFailing.length
        ? " " + gatedFailing.length + " other excluded member(s) were checked and do NOT pass." : "";
      return {
        wall: "a solid-sawn member passes this check — your availability floor excludes it",
        counts: {}, procurement: names,
        move: "confirm the yard will supply " + names + ", or lower the availability floor deliberately",
        outOfScope: "This is a PROCUREMENT decision for the member(s) named — each was run through " +
                    "the engine and passed." + alsoTried + " " + OUT_OF_SCOPE
      };
    }
    if (status === "escalate:bearing") {
      var br = rejected.filter(function (r) { return r.gate === "bearing"; })[0];
      return {
        wall: br ? br.reason : "the bearing reaction exceeds what this bearing length can carry",
        counts: {},
        move: "lengthen the bearing — a second jack stud. Depth does nothing for bearing.",
        outOfScope: "This is a DETAILING question, not a member-size question. No section in the " +
                    "ladder is wider, so a deeper member cannot solve it."
      };
    }
    if (status === "escalate:geometry") {
      var g = rejected.filter(function (r) { return r.gate === "geometry"; })[0];
      return {
        wall: g ? g.reason : "no section in the ladder fits the depth available",
        counts: {}, move: GATE_MOVE.geometry,
        outOfScope: "This is a GEOMETRY question, not a member-size question. A deeper section " +
                    "is the wrong direction — the space above the head height is the constraint."
      };
    }
    if (blocked) {
      return { wall: blocked.text, counts: {}, move: "a deeper or stronger section than the ladder offers",
               outOfScope: OUT_OF_SCOPE };
    }
    var byCheck = {};
    rejected.forEach(function (r) {
      if (!r.governing) return;
      byCheck[r.governing] = (byCheck[r.governing] || 0) + 1;
    });
    var worst = Object.keys(byCheck).sort(function (a, b) { return byCheck[b] - byCheck[a]; })[0];
    var rep = REPAIR[worst] || null;
    return {
      wall: worst || "no candidate could even be evaluated",
      counts: byCheck,
      move: rep ? rep.move : "widen the palette or the size ladder",
      outOfScope: OUT_OF_SCOPE
    };
  }

  var OUT_OF_SCOPE =
    "Multi-ply built-up members, engineered lumber (LVL/PSL/LSL) and I-joists are outside this " +
    "engine (calc-spec §8.6, §8.19). A span this size in a tract plan is normally an engineered " +
    "header — that selection cannot be made here.";

  /* ---------- plan-level solve ---------- */

  function solvePlan(plan, pack, opts) {
    opts = opts || {};
    var policy = FM.weights.policyFor(pack, plan);
    var marks = plan.marks.map(function (mk) {
      /* A mark can be structurally irrelevant in a region — a wood exterior
         header in a concrete-block market, or a truss. Reporting it as
         "no solution" would be wrong twice over: it is not a failure, and it is
         not this engine's member. Say what it actually is. */
      var appl = FM.weights.applicability ? FM.weights.applicability(mk, pack) : { applicable: true };
      if (!appl.applicable) {
        return { mark: mk, demand: null, solution: null, policy: null,
                 notApplicable: { reason: appl.reason, note: appl.note } };
      }
      var demand = FM.weights.demandFor(mk, plan, pack);
      var rolePolicy = FM.weights.policyFor(pack, plan, mk.role);
      var sol = size(demand, rolePolicy);
      return { mark: mk, demand: demand, solution: sol, policy: rolePolicy };
    });
    var out = { plan: plan, pack: pack, marks: marks, policy: policy };
    out.unified = opts.unify === false ? null : unify(out);

    /* ---- borrowed reactions, resolved LIVE ----

       A mark this engine will not size — a post — still has a design load, and
       it is the end reaction of the beam above it, which this engine does
       compute. Those numbers used to be written into the mark's prose by hand:
       "1,231 lb per post, flat across all six packs."

       Every one of them was correct when it was typed. Then the deck live load
       moved from 40 to 60 psf and that sentence became 1,231 against a reaction
       schedule printing 1,718 in the same document — two different reactions
       for one bearing, on one page, with nothing failing. Three of the seven
       such figures in the plan set were stale by the time anyone looked.

       So a mark declares `reactionFrom: ["DK-2"]` and the number is resolved
       here, from this run, for this pack and this variant. A named mark that
       escalates publishes nothing and gets `null` — the note says no reaction
       is published for it, and none is invented. */
    marks.forEach(function (m) {
      var from = m.mark && m.mark.reactionFrom;
      if (!from || !from.length || !m.notApplicable) return;
      m.notApplicable.reactions = from.map(function (id) {
        var src = marks.filter(function (x) { return x.mark.id === id; })[0];
        var rx = src && src.solution && src.solution.reactions;
        return {
          id: id,
          perBearingLb: (rx && isFinite(rx.perBearingLb)) ? rx.perBearingLb : null,
          combo: (rx && rx.combo) || null,
          why: src ? (src.notApplicable ? "not this engine's member"
                    : (src.solution && !src.solution.pick ? "escalates — no member, so no reaction" : null))
                   : "not on this plan"
        };
      });
    });

    out.rollup = rollup(out);
    return out;
  }

  /* ---------- H7: SKU unification ----------
     A tract plan is built dozens of times. Two marks that land one rung apart
     cost the builder a second SKU on every lot — pallet space, a second pick,
     a second chance to install the wrong one. Collapse a mark up to a sibling's
     size when the extra lumber costs less than the weights say a distinct SKU
     costs. Only ever collapses UPWARD to a member that already passed its own
     check, so nothing here can weaken a member. */

  function unify(planResult) {
    var w = planResult.policy.weights;
    var bonus = planResult.policy.unifyBonus || {};
    var groups = {};
    planResult.marks.forEach(function (m) {
      if (!m.solution || !m.solution.pick) return;
      var g = safeKey(m.mark.skuGroup || m.mark.role);
      if (!Object.prototype.hasOwnProperty.call(groups, g)) groups[g] = [];
      groups[g].push(m);
    });

    var moves = [];
    Object.keys(groups).forEach(function (g) {
      var members = groups[g];
      if (members.length < 2) return;

      var distinct = {};
      members.forEach(function (m) { distinct[skuOf(m.solution.pick.cand)] = 1; });
      var skusBefore = Object.keys(distinct).length;
      if (skusBefore < 2) return;

      /* Every distinct size in the group is a candidate target, not just the
         deepest. A group of {2x8 ×10, 2x10 ×40, 2x12 ×1} should raise the 2x8s
         to 2x10 and leave the single 2x12 alone — collapsing all 51 pieces onto
         2x12 to kill two SKUs is the expensive answer, and only considering the
         deepest member was the reason it used to be the only answer. */
      var candidates = [];
      members.forEach(function (m) {
        var t = m.solution.pick.cand;
        if (!candidates.some(function (c) { return skuOf(c) === skuOf(t); })) candidates.push(t);
      });

      var best = null;
      candidates.forEach(function (target) {
        var delta = 0, raised = [], ok = true, skusAfter = {};
        members.forEach(function (m) {
          if (!ok) return;
          var pick = m.solution.pick;
          if (skuOf(pick.cand) === skuOf(target)) { skusAfter[skuOf(target)] = 1; return; }
          /* never collapse DOWN, and never onto a member this mark did not
             itself check and pass */
          if (target.d_in < pick.cand.d_in) { skusAfter[skuOf(pick.cand)] = 1; return; }
          var alt = m.solution.feasible.filter(function (f) {
            return f.cand.size === target.size && f.cand.species === target.species &&
                   f.cand.grade === target.grade && f.cand.spacing === pick.cand.spacing;
          })[0];
          if (!alt) { ok = false; return; }
          /* compare on SCORE, the same objective the search optimised. Raising a
             member always increases its slack, and cost alone cannot see that. */
          delta += (alt.pieceScore - pick.pieceScore) * pieceCount(m);
          raised.push({ mark: m.mark.id, from: skuOf(pick.cand), to: skuOf(target), row: m, alt: alt });
          skusAfter[skuOf(target)] = 1;
        });
        if (!ok || !raised.length) return;
        var nAfter = Object.keys(skusAfter).length;
        /* the per-SKU handling charge, plus the system bonus that only exists
           when the group actually collapses to a single size */
        /* the system bonus is for collapsing to ONE SIZE — a same-size grade
           swap creates no band, no single rim depth and no single hanger SKU */
        var sizesBefore = {}, sizesAfter = {};
        members.forEach(function (m) { sizesBefore[m.solution.pick.cand.size] = 1; });
        Object.keys(skusAfter).forEach(function (k) { sizesAfter[k.split(" ")[0]] = 1; });
        var collapsedSizes = Object.keys(sizesBefore).length > 1 && Object.keys(sizesAfter).length === 1;
        var saved = (skusBefore - nAfter) * w.skuPenalty +
                    (nAfter === 1 && collapsedSizes ? (own(bonus, g) || 0) : 0);
        if (saved <= 0) return;
        var net = delta - saved;
        if (!best || net < best.net) {
          best = { net: net, delta: delta, saved: saved, target: target, raised: raised,
                   skusAfter: nAfter };
        }
      });

      if (!best) return;
      moves.push({
        group: g, skusBefore: skusBefore, skusAfter: best.skusAfter, target: skuOf(best.target),
        extraLumberUSD: best.delta, skuSavingUSD: best.saved, accepted: best.net <= 0,
        raised: best.raised.map(function (r) { return { mark: r.mark, from: r.from, to: r.to }; })
      });
      if (best.net <= 0) {
        best.raised.forEach(function (r) { r.row.unifiedTo = r.alt; });
      }
    });
    return moves;
  }

  /* A repetitive mark's piece count follows from the run and the spacing the
     solver chose, so it cannot be a fixed number in the plan: quoting a 12 ft
     deck at 16 marks while the solver picks 12" o.c. (which needs 22) makes the
     plan cost meaningless. Non-repetitive marks keep their literal count. */
  function pieceCount(m) {
    var row = m.unifiedTo || (m.solution && m.solution.pick);
    if (row && m.demand && m.demand.repetitive && m.mark.runFt && row.cand.spacing) {
      return Math.ceil(Number(m.mark.runFt) * 12 / row.cand.spacing) + 1;
    }
    return m.mark.count || 1;
  }

  function skuOf(cand) {
    return cand.size + " " + cand.species + " " + cand.grade;
  }
  function shallow(o) {
    var out = {}, k;
    for (k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
    return out;
  }
  function keyOf(cand) {
    return skuOf(cand) + "@" + (cand.spacing || 0);
  }

  function rollup(planResult) {
    var skus = {}, solved = 0, escalated = 0, notApplicable = 0, flagged = 0, totalUSD = 0;
    planResult.marks.forEach(function (m) {
      if (m.notApplicable) { notApplicable++; return; }
      var row = m.unifiedTo || (m.solution && m.solution.pick);
      if (!row) { escalated++; return; }
      solved++;
      var n = pieceCount(m);
      totalUSD += row.cost.totalUSD * n;
      var k = safeKey(skuOf(row.cand));
      if (!Object.prototype.hasOwnProperty.call(skus, k)) skus[k] = 0;
      skus[k] += n;
      if (row.cost.cfBasis === "held") flagged++;
    });
    var windGoverned = !!(planResult.pack && planResult.pack.governs === "wind");
    return {
      solved: solved, escalated: escalated, unsolved: escalated, notApplicable: notApplicable,
      flaggedCF: flagged,
      /* A schedule is not complete while anything is escalated, while any mark
         was removed as not-this-engine, or in a market where wind governs the
         members this engine only checked for gravity. */
      complete: escalated === 0 && notApplicable === 0 && !windGoverned,
      incompleteBecause: escalated ? "marks escalated"
        : (notApplicable ? "marks removed as not this engine's member"
        : (windGoverned ? "wind governs in this market and is not checked here" : null)),
      skuCount: Object.keys(skus).length, skus: skus, lumberUSD: totalUSD
    };
  }

  /* ---------- the repeat matrix ----------
     One plan, several region packs. This is the whole point of a tract plan:
     what actually has to change when the same house is built in another state. */

  /* One vocabulary for a mark's portability, so the matrix badge, the stat
     cards and the export cannot describe the same row three different ways.
     `tone` is the badge class the views already use; `text` is the sentence
     that has to survive being read on paper with no colour at all. */
  function portability(row) {
    var nSilent = row.silentPacks.length, nNa = row.naPacks.length;
    if (row.unanswered) {
      return { key: "unanswered", badge: "Unanswered", tone: "b-fail",
               text: "no member in any region — this mark is unanswered, not portable" };
    }
    if (row.common) {
      return { key: "common", badge: "Common", tone: "b-gold",
               text: "one member, all " + row.ofPacks + " regions" };
    }
    if (row.partial) {
      var parts = [];
      if (nSilent) parts.push("no member in " + row.silentPacks.join(", "));
      if (nNa) parts.push("out of scope in " + row.naPacks.join(", "));
      return { key: "partial", badge: "Partial · " + row.answeredIn + "/" + row.ofPacks,
               tone: "b-mute",
               text: (row.varies || row.answeredIn > 1 ? "sized in " + row.answeredIn + " of " +
                      row.ofPacks + " regions" : "sized in one region only") +
                     " — " + parts.join("; ") + ". Not one member everywhere." };
    }
    return { key: "varies", badge: "Varies", tone: "b-blue",
             text: "a different member by region — " + row.ofPacks + " regions, all answered" };
  }

  function compare(plan, packs) {
    var runs = packs.map(function (p) { return { pack: p, result: solvePlan(plan, p) }; });
    var rows = plan.marks.map(function (mk) {
      var cells = runs.map(function (r) {
        var m = r.result.marks.filter(function (x) { return x.mark.id === mk.id; })[0];
        if (m && m.notApplicable) {
          return { pack: r.pack.id, sku: null, spacing: null, dcr: null, governing: null,
                   notApplicable: true, note: m.notApplicable.reason };
        }
        var row = m && (m.unifiedTo || (m.solution && m.solution.pick));
        return {
          pack: r.pack.id,
          sku: row ? skuOf(row.cand) : null,
          spacing: row ? row.cand.spacing : null,
          dcr: row ? row.dcr : null,
          governing: row ? row.governing : null,
          note: row ? null : (m && m.solution && m.solution.note ? m.solution.note.wall : "no solution")
        };
      });
      var distinct = {};
      cells.forEach(function (c) { if (c.sku) distinct[c.sku + "@" + c.spacing] = 1; });
      var n = Object.keys(distinct).length;

      /* "One member, every region" is the product's central claim, so the bar
         for making it has to be every region — not every region that answered.

         Silence was counted as agreement twice. The first fix caught TOTAL
         silence: a mark with no member anywhere was reading as common to all
         six. It left PARTIAL silence behind, which is the more dangerous half —
         a mark sized identically in five regions and escalated in the sixth
         still had n === 1, so it printed a green Common badge next to a NONE
         cell. That is the badge asserting portability against the evidence in
         the same row.

         So: common requires an answer in every cell. A mark that agrees where
         it answers but is silent somewhere is `partial` — worth showing, and
         worth naming the silent regions, but not the same claim. */
      var silent = cells.filter(function (c) { return !c.sku && !c.notApplicable; });
      var na     = cells.filter(function (c) { return c.notApplicable; });
      var gaps   = silent.length + na.length;

      return { mark: mk, cells: cells, everSolved: n > 0,
               varies: n > 1 && gaps === 0,
               common: n === 1 && gaps === 0,
               partial: n > 0 && gaps > 0,
               unanswered: n === 0,
               silentPacks: silent.map(function (c) { return c.pack; }),
               naPacks: na.map(function (c) { return c.pack; }),
               answeredIn: cells.length - gaps, ofPacks: cells.length };
    });
    return {
      plan: plan, runs: runs, rows: rows,
      commonMarks: rows.filter(function (r) { return r.common; }).length,
      varyingMarks: rows.filter(function (r) { return r.varies; }).length,
      partialMarks: rows.filter(function (r) { return r.partial; }).length,
      unansweredMarks: rows.filter(function (r) { return r.unanswered; }).length,
      solvedMarks: rows.filter(function (r) { return r.everSolved; }).length
    };
  }

  FM.solver = {
    size: size, solvePlan: solvePlan, compare: compare, portability: portability,
    ESCALATION: ESCALATION, escalationOf: escalationOf,
    seedBounds: seedBounds, families: families, combosFor: combosFor,
    memberInputs: memberInputs, costOf: costOf, skuOf: skuOf, slackPenalty: slackPenalty,
    eligibility: eligibility,
    stockLength: stockLength, boardFeetPerLF: boardFeetPerLF,
    REPAIR: REPAIR, GAMMA_PCF: GAMMA_PCF
  };
})();

</script>
<script>
/* ============================================================
   Schedule export.

   calc-spec §8 opens: "The app must print this list, verbatim and
   unabridged, on every output. A calculation that does not state
   its boundaries is not an engineering deliverable."

   Until now nothing left the sizing view at all, and what the sheet
   exported carried a ten-item paraphrase instead of the 24. So every
   honesty mechanism the product has — the escalations, the marks it
   refuses, the wind note, the advisories, the provenance — died at
   the browser window, and a schedule arrived at the next desk as a
   bare list of members.

   This is the artifact that carries them. It is deliberately plain
   text: it has to survive being pasted into an email.

   Three things it must not do, each of which it did once:

   1. State the deflection basis as "IBC Table 1604.3" flat. Every pack
      declares code.family "IRC", and IRC Table R301.7 has no D + L
      column at all — so the total-load row is a firm overlay, not a
      code citation. It is now derived from the pack's own declaration.
   2. Keep the C_F provenance caveat as a paragraph at the back. C_F is
      a function of depth, so it is a fact about the member that was
      picked; it is printed on the member.
   3. Restate engine.js's LIMITS in prose. That list is maintained
      elsewhere and it grows, so it is rendered from the array.

   And a schedule for a MASTER SET — one stamped plan reused across
   elevations and options — that does not say which combination it
   covers is not a usable document. The record names the combination it
   was solved for, says in terms that it is one combination and not an
   envelope, partitions the marks that move across the set from the ones
   that do not, lists the marks a variant ADDS or REMOVES, and — the
   question the master set exists to ask — reports per mark whether the
   combination solved here is the one that GOVERNS it, or whether the
   member printed above was sized against a case that is not the worst
   one the builder will build.

   It reads FM.weights.variantsFor() and envelopeFor() where they exist
   and the plan's own `elevations` / `options` where they do not, and it
   emits nothing at all for a plan that declares neither. What it must
   never do is infer: a variant's effect is read from what the variant
   declares, and any key it declares that this file does not model is
   printed as a plan-wide change rather than silently dropped.
   ============================================================ */

(function () {
  "use strict";

  function rule(ch) { return new Array(79).join(ch || "="); }
  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }
  function lpad(s, n) { s = String(s); while (s.length < n) s = " " + s; return s; }
  /* core.js supplies these in the browser; the text generator must also run in
     the headless harness, which loads only the DOM-free layers. */
  function comma(v) {
    if (FM.comma) return FM.comma(v);
    if (v === null || v === undefined || !isFinite(v)) return "—";
    return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function n2(v, d) {
    if (v === null || v === undefined || !isFinite(v)) return "—";
    return Number(v).toFixed(d === undefined ? 2 : d);
  }
  function wrap(text, width, indent) {
    var words = String(text).split(/\s+/), lines = [], line = "";
    width = width || 76;
    for (var i = 0; i < words.length; i++) {
      if (line && (line + " " + words[i]).length > width) { lines.push(line); line = ""; }
      line = line ? line + " " + words[i] : words[i];
    }
    if (line) lines.push(line);
    return lines.map(function (l, i) { return (i && indent ? indent : "") + l; });
  }
  function isArr(v) { return Object.prototype.toString.call(v) === "[object Array]"; }
  function str(v, dflt) {
    return (v === null || v === undefined || v === "") ? (dflt === undefined ? "" : dflt) : String(v);
  }

  /* ---------------- the deflection basis ----------------

     This line used to read "deflection per IBC Table 1604.3", unconditionally,
     on every schedule. Every region pack in the product declares
     `code.family: "IRC"` — repeatable one- and two-family homes are permitted
     under the IRC — and IRC Table R301.7 has NO total-load (D + L) column at
     all. So the total-load row this tool reports against every member is a
     FIRM OVERLAY, an IBC-derived limit carried on top of what the IRC asks
     for. Printing it as a code citation asserted a basis these markets do not
     have. The pack tells us which family it is; say what follows from that. */

  function codeFamily(pack) {
    return (pack && pack.code && str(pack.code.family)) || "not declared";
  }
  function deflHeadline(pack) {
    var fam = codeFamily(pack);
    if (fam === "IBC") return "IBC Table 1604.3 — the code family this pack declares";
    if (fam === "not declared")
      return "IBC Table 1604.3 rows — this pack declares no code family (see DEFLECTION BASIS)";
    return "IBC Table 1604.3 rows, applied as a FIRM OVERLAY — this market builds " +
           "under the " + fam + " (see DEFLECTION BASIS)";
  }

  /* C_F moves with the depth, so it is a property of the picked member and not
     of the schedule. Returns the record only where the basis is one the reader
     has to act on — `held` (catalog silent, held at 1.00) or `repo_partial` (a
     threshold-testing field, not a citable table). */
  function cfBasisOf(cand) {
    if (!FM.engine || typeof FM.engine.sizeFactor !== "function") return null;
    var cf;
    try { cf = FM.engine.sizeFactor(cand.species, cand.grade, cand.size); } catch (e) { return null; }
    if (!cf || (cf.basis !== "held" && cf.basis !== "repo_partial")) return null;
    return { CF: Number(cf.CF), basis: String(cf.basis), note: str(cf.note) };
  }

  /* ---------------- master sets ----------------

     A production plan is one stamped set reused across elevations and options,
     and `weights.js` now models that properly: `variantsFor(plan)` returns the
     elevations, the options, and — the number that matters — the
     COMBINATIONS the builder actually builds, each with its expected lot
     count and the marks it `touches`. `envelopeFor(plan, markId, pack)` says
     which combination governs a given mark, or that no single one does.

     This section exists because a schedule for a master set that does not say
     which variant it covers is not a usable document, and because the solver
     sizes ONE combination at a time. If the members below were sized for a
     combination that does not govern a mark, that is the revision D11 warns
     about, and it should be visible on the schedule rather than discovered at
     framing.

     Everything is read through the helpers where they exist and through the
     plan's own `elevations` / `options` where they do not. A plan that
     declares neither exports exactly as it always did. Nothing is inferred:
     a key a variant declares that this file does not model is printed rather
     than dropped. */

  var VARIANT_META = { id: 1, kind: 1, type: 1, label: 1, name: 1, base: 1, isBase: 1,
                       "default": 1, takeRate: 1, takeRateCls: 1, takeRateBasis: 1, note: 1,
                       notes: 1, overrides: 1, markOverrides: 1, declared: 1, touches: 1,
                       add: 1, adds: 1, remove: 1, removes: 1, geometry: 1, movesNoMember: 1,
                       requiresElevation: 1, excludes: 1, planId: 1, elevationId: 1,
                       optionIds: 1, lotsExpected: 1, roofAssemblyKey: 1 };

  function idsOf(v) {
    var ids = [];
    if (!v) return ids;
    if (isArr(v)) v.forEach(function (o) {
      if (o === null || o === undefined) return;
      ids.push(String(typeof o === "object" ? (o.id || o.mark || o.markId || "(unnamed)") : o));
    });
    else if (typeof v === "object") Object.keys(v).forEach(function (k) { ids.push(String(k)); });
    return ids;
  }

  function normVariant(v, kind) {
    if (!v || typeof v !== "object") return null;
    var tr = Number(v.takeRate);
    var decl = (v.declared && typeof v.declared === "object") ? v.declared : v;
    /* `touches` is the helper's resolved answer and already accounts for a
       plan-wide change such as a roof-assembly swap; fall back to the raw
       override keys only when it is absent */
    var touches = isArr(v.touches) ? v.touches.map(String)
                                   : idsOf(v.overrides || v.markOverrides || null);
    var wide = [];
    Object.keys(v).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(VARIANT_META, k)) return;
      var val = v[k];
      if (val === null || val === undefined || val === false) return;
      wide.push(k + (typeof val === "object" ? "" : " = " + String(val)));
    });
    if (v.roofAssemblyKey) wide.push("roof assembly → " + String(v.roofAssemblyKey));
    return {
      id: str(v.id, str(v.name, str(v.label, "(unnamed)"))),
      label: str(v.label, str(v.name, str(v.id, ""))),
      kind: kind,
      takeRate: (v.takeRate === undefined || v.takeRate === null || !isFinite(tr)) ? null : tr,
      lots: isFinite(Number(v.lotsExpected)) ? Number(v.lotsExpected) : null,
      base: !!(v.base || v.isBase || v["default"]),
      movesNoMember: !!v.movesNoMember,
      marks: touches,
      added: idsOf(decl.add || decl.adds || null),
      removed: idsOf(decl.remove || decl.removes || null),
      planWide: wide
    };
  }

  function variantInfo(plan, pack, opts) {
    /* A plan materialised by planForVariant() carries the combination it is and
       an `ofPlan` back-reference — which is an ID STRING, not the object. The
       master set is that plan, and computing the envelope against the variant
       plan instead silently answers a different question: it reports the
       variant as its own base and names the wrong governing combination. */
    var master = plan;
    if (plan && plan.ofPlan) {
      if (plan.ofPlan.marks) master = plan.ofPlan;
      else if (FM.weights && typeof FM.weights.planById === "function") {
        var back = null;
        try { back = FM.weights.planById(String(plan.ofPlan)); } catch (e) { back = null; }
        if (back && back.marks) master = back;
      }
    }
    var raw = null, viaHelper = false;
    if (FM.weights && typeof FM.weights.variantsFor === "function") {
      try { raw = FM.weights.variantsFor(master); viaHelper = !!raw; } catch (e) { raw = null; }
    }
    if (!raw && (isArr(master.elevations) || isArr(master.options))) {
      raw = { elevations: master.elevations, options: master.options };
    }
    if (!raw || typeof raw !== "object" || isArr(raw) === false && raw.declaresVariants === false) {
      if (!raw || typeof raw !== "object") return null;
    }

    var elevations = [], options = [], combinations = [];
    function take(v, fallbackKind) {
      var kind = str(v && (v.kind || v.type), fallbackKind || "elevation");
      var n = normVariant(v, kind === "option" ? "option" : "elevation");
      if (n) (n.kind === "option" ? options : elevations).push(n);
    }
    if (isArr(raw)) raw.forEach(function (v) { take(v, "elevation"); });
    else {
      if (isArr(raw.elevations)) raw.elevations.forEach(function (v) { take(v, "elevation"); });
      if (isArr(raw.options)) raw.options.forEach(function (v) { take(v, "option"); });
      if (isArr(raw.variants)) raw.variants.forEach(function (v) { take(v, "elevation"); });
      if (isArr(raw.combinations)) raw.combinations.forEach(function (c) {
        var n = normVariant(c, "combination");
        if (n) combinations.push(n);
      });
    }
    if (!elevations.length && !options.length && !combinations.length) return null;

    /* which combination the members below were solved for */
    var sf = (opts && opts.variant) || plan.variant || plan.variantId || plan.elevation ||
             (!isArr(raw) && (raw.solvedFor || raw.current)) || null;
    var solvedId = null, solvedFor = null, solvedIsBase = false;
    if (sf && typeof sf === "object") { solvedId = str(sf.id); solvedFor = str(sf.label, str(sf.name, solvedId)); }
    else if (sf) { solvedId = String(sf); solvedFor = solvedId; }
    if (solvedId) {
      var hit = combinations.filter(function (c) { return c.id === solvedId; })[0] ||
                elevations.concat(options).filter(function (c) { return c.id === solvedId; })[0];
      if (hit) { solvedFor = hit.label || hit.id; solvedIsBase = hit.base; }
    }
    if (!solvedId) {
      var b = combinations.filter(function (c) { return c.base; })[0] ||
              elevations.filter(function (e) { return e.base; })[0];
      if (b) { solvedId = b.id; solvedFor = b.label || b.id; solvedIsBase = true; }
    }

    var all = elevations.concat(options);

    var by = {}, order = [];
    function note(map, list, mid, txt) {
      var k = " " + mid;                                  /* author strings as keys */
      if (!Object.prototype.hasOwnProperty.call(map, k)) { map[k] = []; list.push(mid); }
      if (map[k].indexOf(txt) === -1) map[k].push(txt);
    }
    all.forEach(function (v) {
      var who = (v.kind === "option" ? "option " : "elevation ") + (v.label || v.id);
      v.marks.forEach(function (mid) { note(by, order, mid, who); });
    });
    var changing = order.map(function (mid) { return { mark: mid, by: by[" " + mid] }; });

    var addBy = {}, addOrder = [], remBy = {}, remOrder = [];
    all.forEach(function (v) {
      var who = (v.kind === "option" ? "option " : "elevation ") + (v.label || v.id);
      v.added.forEach(function (mid) { note(addBy, addOrder, mid, who); });
      v.removed.forEach(function (mid) { note(remBy, remOrder, mid, who); });
    });

    var changed = {};
    order.forEach(function (mid) { changed[" " + mid] = true; });
    var common = plan.marks.filter(function (mk) {
      return !Object.prototype.hasOwnProperty.call(changed, " " + mk.id);
    }).map(function (mk) { return mk.id; });

    /* and the question a master set exists to ask: for each mark, is the
       combination this schedule was solved for the one that governs it? */
    var envelope = null;
    if (FM.weights && typeof FM.weights.envelopeFor === "function" && pack) {
      envelope = [];
      plan.marks.forEach(function (mk) {
        var e;
        try { e = FM.weights.envelopeFor(master, mk.id, pack); } catch (err) { return; }
        if (!e) return;
        envelope.push({
          mark: mk.id,
          sizedOn: Number(e.sizedOn) || 0,
          builtOn: Number(e.builtOn) || 0,
          split: !!e.split,
          governedBy: e.governedBy ? String(e.governedBy) : null,
          isHere: !!(solvedId && e.governedBy && String(e.governedBy) === solvedId)
        });
      });
      if (!envelope.length) envelope = null;
    }

    return { elevations: elevations, options: options, combinations: combinations,
             solvedFor: solvedFor, solvedId: solvedId, declared: !!sf,
             solvedIsBase: solvedIsBase, viaHelper: viaHelper,
             lots: (!isArr(raw) && isFinite(Number(raw.lots))) ? Number(raw.lots) : null,
             changing: changing,
             added: addOrder.map(function (m) { return { mark: m, by: addBy[" " + m] }; }),
             removed: remOrder.map(function (m) { return { mark: m, by: remBy[" " + m] }; }),
             common: common, envelope: envelope };
  }

  /* ---------------- the record ---------------- */

  function scheduleText(plan, pack, opts) {
    opts = opts || {};
    var res = FM.solver.solvePlan(plan, pack);
    var L = [];
    function say(s) { L.push(s === undefined ? "" : s); }
    function block(title) { say(); say(rule("=")); say(title); say(rule("=")); say(); }

    /* ---- header ---- */
    say("FIRMARK — MEMBER SCHEDULE (beta)");
    say(rule("="));
    say("Plan          : " + plan.name + " — " + plan.summary);
    say("Region pack   : " + pack.name + " · " + pack.markets);
    var vi = variantInfo(plan, pack, opts);
    if (vi) {
      say("Variant       : " + (vi.solvedFor ? vi.solvedFor : "NOT DECLARED — base marks as the plan carries them") +
          "   (master set — see MASTER SET)");
    }
    say("Code family   : " + codeFamily(pack) +
        "   Firm DCR target: " + n2(pack.maxDCR));
    say("Basis         : NDS 2024 ASD · ASCE 7 §2.4");
    /* wrap() collapses runs of whitespace, so the label cannot go through it */
    wrap(deflHeadline(pack), 60).forEach(function (x, i) {
      say((i ? pad("", 16) : "Deflection    : ") + x);
    });
    if (opts.at) say("Generated     : " + opts.at);
    say();
    say("NOT SEALED ENGINEERING. A licensed engineer must review the inputs, the");
    say("assumptions and the results and take professional responsibility for them.");
    say("This schedule is a gravity member check and is not a design (see SCOPE).");

    /* ---- the thing a wind-governed market must read first ---- */
    if (pack.governs === "wind") {
      say();
      say(rule("!"));
      say("!! GRAVITY ONLY — WIND GOVERNS IN THIS MARKET");
      say(rule("!"));
      wrap(pack.governsNote, 76).forEach(say);
    }
    if (plan.note) { say(); wrap("PLAN NOTE — " + plan.note, 76, "  ").forEach(say); }
    if (pack.exteriorWallNote) { say(); wrap("WALL SYSTEM — " + pack.exteriorWallNote, 76, "  ").forEach(say); }

    /* ---- what was and was not answered ---- */
    var r = res.rollup;
    block("SUMMARY");
    say("  Marks on the plan          : " + plan.marks.length);
    say("  Members proposed           : " + r.solved);
    say("  Escalated (no member)      : " + r.escalated);
    say("  Not this engine's member   : " + r.notApplicable);
    say("  Distinct SKUs              : " + r.skuCount);
    say("  Modelled cost per house    : $" + comma(r.lumberUSD) + "   (market placeholders — see PROVENANCE)");
    say();
    if (!r.complete) {
      say("  ** THIS IS NOT A COMPLETE SCHEDULE — " + String(r.incompleteBecause).toUpperCase() + " **");
      say("  Do not read the members below as a finished design.");
    }

    /* ---- which of the master set's variants this actually is ---- */
    if (vi) {
      block("MASTER SET — WHAT THIS SCHEDULE COVERS");
      say("  Solved for   : " + (vi.solvedFor ? vi.solvedFor : "NOT DECLARED") +
          (vi.solvedIsBase ? "   [the declared base case]" : ""));
      say("  Master set   : " + vi.elevations.length + " elevation(s) x " +
          vi.options.length + " option(s)" +
          (vi.combinations.length ? " = " + vi.combinations.length + " buildable combination(s)" : "") +
          (vi.lots === null ? "" : "   over " + comma(vi.lots) + " lots"));
      if (!vi.viaHelper) {
        say("  Read from    : the plan's own `elevations` / `options` declarations");
      }
      say();
      if (!vi.declared && !vi.solvedId) {
        say("  ** THE VARIANT IS NOT DECLARED. The members were solved from the plan's");
        say("     base marks. Do not issue this against a specific elevation or option");
        say("     set until the variant is named. **");
        say();
      }
      say("  ** ONE COMBINATION, NOT AN ENVELOPE. The solver optimises one demand per");
      say("     mark, and the marks it was given are this combination's. Sizing a base");
      say("     elevation and letting an option move a bearing is how a revision gets");
      say("     manufactured after permit. **");
      say();

      /* one renderer for elevations and options alike — an elevation carries a
         take rate too, and both can move a member */
      function variantRows(title, list) {
        if (!list.length) return;
        say("  " + title);
        list.forEach(function (v) {
          var effect = [];
          if (v.marks.length) effect.push("touches " + v.marks.length + ": " + v.marks.join(", "));
          if (v.added.length) effect.push("ADDS " + v.added.length + ": " + v.added.join(", "));
          if (v.removed.length) effect.push("REMOVES " + v.removed.length + ": " + v.removed.join(", "));
          v.planWide.forEach(function (k) { effect.push("PLAN-WIDE: " + k); });
          if (!effect.length) {
            effect.push(v.movesNoMember ? "declared to move no member this engine sizes"
                        : (v.base ? "the stamped base case — what the marks below were sized as"
                                  : "no change declared"));
          } else if (v.movesNoMember) {
            effect.push("declared to move no member this engine sizes");
          }
          var head = "      " + pad(v.label || v.id, 46) +
                     pad(v.takeRate === null ? "take rate —" : "take " + n2(v.takeRate * 100, 0) + "%", 11) +
                     (v.base ? "[base]" : "");
          say(head.replace(/\s+$/, ""));
          wrap(effect.join(" · "), 64).forEach(function (x) { say("          " + x); });
        });
        say();
      }
      variantRows("ELEVATIONS", vi.elevations);
      variantRows("OPTIONS", vi.options);

      /* the question the master set exists to ask */
      if (vi.envelope) {
        var off = vi.envelope.filter(function (e) {
          return e.sizedOn > 0 && !e.isHere && (e.split || e.governedBy);
        });
        say("  DOES THIS COMBINATION GOVERN? — per mark, across all " +
            vi.combinations.length + " combination(s)");
        say("  " + rule("-").slice(0, 76));
        say("  " + pad("MARK", 12) + pad("GOVERNING COMBINATION", 40) + "THIS SCHEDULE");
        vi.envelope.forEach(function (e) {
          var gov, verdict;
          if (!e.sizedOn) { gov = "not sized in any combination"; verdict = "—"; }
          else if (e.split) { gov = "NO SINGLE COMBINATION GOVERNS"; verdict = "NOT THE ENVELOPE"; }
          else if (!e.governedBy) { gov = "—"; verdict = "—"; }
          else { gov = e.governedBy; verdict = e.isHere ? "governs" : "NOT THE GOVERNING CASE"; }
          say("  " + pad(e.mark, 12) + pad(gov, 40) + verdict);
        });
        say();
        if (off.length) {
          wrap("** " + off.length + " mark(s) above are governed by a combination this schedule " +
               "was NOT solved for. The member printed for each of them is adequate for THIS " +
               "combination and was not checked against the one that governs. Re-run the " +
               "schedule for the governing combination before the set is issued, or size the " +
               "envelope. **", 74, "  ").forEach(function (x) { say("  " + x); });
          say();
        }
        say("  \"Governs\" compares the DEMAND drivers — span, tributary, dead, live, roof");
        say("  load, bearing and depth budget — and names a combination only where one is");
        say("  at least as severe as every other on all of them. It is a comparison of");
        say("  demands, not of members: no member was re-solved for another combination.");
        say();
      }

      say("  MARKS THAT CHANGE ACROSS THE MASTER SET — " + vi.changing.length);
      if (!vi.changing.length) say("      (no variant touches a mark)");
      vi.changing.forEach(function (c) {
        var onPlan = plan.marks.filter(function (mk) { return mk.id === c.mark; })[0];
        /* wrap() collapses whitespace, so the mark column is applied outside it */
        wrap((onPlan ? "" : "(not a mark on this combination) ") + "moved by: " + c.by.join(", "), 58)
          .forEach(function (x, i) { say("      " + (i ? pad("", 14) : pad(c.mark, 14)) + x); });
      });
      say();

      if (vi.added.length) {
        say("  MARKS A VARIANT ADDS — " + vi.added.length);
        vi.added.forEach(function (c) {
          var onPlan = plan.marks.filter(function (mk) { return mk.id === c.mark; })[0];
          wrap((onPlan ? "on this combination · " : "NOT ON THIS COMBINATION — NOT SIZED ABOVE · ") +
               "added by: " + c.by.join(", "), 58)
            .forEach(function (x, i) { say("      " + (i ? pad("", 14) : pad(c.mark, 14)) + x); });
        });
        say("      A mark that is not on the base sheet has nobody checking it. Run the");
        say("      schedule for the variant that adds it.");
        say();
      }
      if (vi.removed.length) {
        say("  MARKS A VARIANT REMOVES — " + vi.removed.length);
        vi.removed.forEach(function (c) {
          wrap("removed by: " + c.by.join(", "), 58)
            .forEach(function (x, i) { say("      " + (i ? pad("", 14) : pad(c.mark, 14)) + x); });
        });
        say();
      }

      say("  MARKS COMMON TO EVERY VARIANT — " + vi.common.length);
      if (!vi.common.length) say("      (none)");
      else wrap(vi.common.join(", "), 68).forEach(function (x) { say("      " + x); });
      say();
      say("  A mark is listed as common because no variant declares that it touches it.");
      say("  That is a statement about the declared inputs, not a re-check: nothing here");
      say("  was re-solved against every variant, and a shared input that moves — a plate");
      say("  height, a truss direction, a roof assembly — still moves a mark nobody named.");
    }

    /* ---- the members ---- */
    block("MEMBER SCHEDULE");
    say("  " + pad("MARK", 12) + pad("MEMBER", 34) + pad("SPACING", 10) +
        pad("GOVERNS", 14) + lpad("DCR", 6));
    say("  " + rule("-").slice(0, 76));
    var cfFlagged = 0;
    res.marks.forEach(function (m) {
      if (m.notApplicable) {
        say("  " + pad(m.mark.id, 12) + pad("— not sized —", 34) + "see NOT SIZED below");
        return;
      }
      var row = m.unifiedTo || (m.solution && m.solution.pick);
      if (!row) {
        /* The reason belongs on the line. A reader scanning the member table
           for what to buy needs to know that a procurement escalation has a
           member behind it and a strength escalation does not — printing the
           same "— ESCALATED —" over both made them one problem. */
        var e = FM.solver.escalationOf(m.solution && m.solution.status);
        say("  " + pad(m.mark.id, 12) + pad("— ESCALATED: " + e.badge + " —", 34) + e.tag);
        return;
      }
      say("  " + pad(m.mark.id, 12) +
          pad(row.cand.size + " " + row.cand.species + " " + row.cand.grade, 34) +
          pad(row.cand.spacing ? row.cand.spacing + "\" o.c." : "single", 10) +
          pad(row.governing, 14) + lpad(n2(row.dcr, 3), 6) +
          (m.unifiedTo ? "  [unified]" : ""));
      say("  " + pad("", 12) + m.mark.label + " · span " + n2(m.mark.span, 1) + " ft" +
          (m.demand.trib ? " · tributary " + n2(m.demand.trib, 2) + " ft" : "") +
          " · bearing " + n2(m.demand.bearing, 2) + " in" +
          " · " + (m.demand.wet ? "wet service" : "dry") +
          (m.demand.treated ? ", treated" : "") +
          (m.demand.braced ? ", braced" : ", UNBRACED"));
      /* The C_F caveat used to live only in a general paragraph at the back of
         the record, which made it a disclaimer rather than a fact about a
         member. C_F is a function of depth, so it is a property of THIS pick —
         print its basis on the mark that carries it. */
      var cf = cfBasisOf(row.cand);
      if (cf) {
        cfFlagged++;
        wrap("C_F " + n2(cf.CF, 3) + " · basis " + cf.basis + (cf.note ? " — " + cf.note : ""), 60, "  ")
          .forEach(function (x) { say("  " + pad("", 12) + x); });
      }
    });
    if (cfFlagged) {
      say();
      say("  C_F BASIS, printed above on the " + cfFlagged + " member(s) whose size factor is");
      say("  not sourced. 'repo_partial' is a catalog field the catalog itself declares is");
      say("  for threshold testing only — it is not a citable published size-factor table.");
      say("  'held' means the catalog is silent and C_F is held at 1.00, which is");
      say("  conservative below 14 in; 14 in and wider is refused outright, not held.");
    }

    /* ---- reactions: the number the next designer actually needs ---- */
    block("REACTION SCHEDULE");
    say("  Unreduced support reaction at each bearing, governing gravity combination.");
    say("  The §3.4.3.1 shear reduction is a shear allowance and is never applied to a");
    say("  reaction. NO CONNECTION IS DESIGNED HERE (calc-spec §8 item 17).");
    say();
    say("  " + pad("MARK", 12) + pad("REACTION", 14) + "GOVERNING COMBINATION");
    say("  " + rule("-").slice(0, 76));
    res.marks.forEach(function (m) {
      var rx = m.solution && m.solution.reactions;
      if (!rx || !rx.perBearingLb) return;
      say("  " + pad(m.mark.id, 12) + pad(comma(rx.perBearingLb) + " lb", 14) + rx.combo);
    });

    /* ---- what it refused to answer, and why ---- */
    var esc = res.marks.filter(function (m) { return !m.notApplicable && m.solution && !m.solution.pick; });
    if (esc.length) {
      /* grouped and counted by reason, because "5 marks escalated" is a number
         a reader cannot act on and "3 need a bigger section, 2 need a phone
         call to the yard" is two different afternoons */
      var byReason = {};
      esc.forEach(function (m) {
        var k = (m.solution && m.solution.status) || "escalate";
        (byReason[k] = byReason[k] || []).push(m);
      });
      var reasons = Object.keys(byReason).sort();
      block("ESCALATIONS — " + esc.length + " MARK(S) HAVE NO MEMBER, IN " +
            reasons.length + " CATEGOR" + (reasons.length === 1 ? "Y" : "IES"));
      reasons.forEach(function (k) {
        var e = FM.solver.escalationOf(k);
        say("  " + pad(byReason[k].length + " × " + e.tag, 34) + e.short);
      });
      if (reasons.length > 1) {
        say();
        say("  These are not the same finding. A procurement escalation names a member that");
        say("  was run through the engine and passed; a strength escalation means no section");
        say("  in the ladder passes at all. Read the category before the mark.");
      }
      say();

      /* Labelled field with a hanging indent under the text, not under the
         label. wrap() normalises runs of whitespace, so the label cannot be
         padded inside the wrapped string — "wall   :" came back out as
         "wall :" and the continuations hung off a column that was no longer
         there. Wrap the value, then lay the label alongside it. */
      function field(label, text) {
        var head = "    " + pad(label, 7) + ": ";
        var body = new Array(head.length + 1).join(" ");
        var lines = wrap(String(text === undefined || text === null || text === "" ? "—" : text),
                         78 - head.length);
        say(head + lines[0]);
        lines.slice(1).forEach(function (x) { say(body + x); });
      }

      esc.forEach(function (m) {
        var s = m.solution;
        var ei = FM.solver.escalationOf(s.status);
        say("  " + m.mark.id + " — " + m.mark.label + "   [" + ei.tag + "]");
        field("status", s.status + " — " + ei.short);
        field("wall", s.note ? s.note.wall : null);
        field("next", s.note ? s.note.move : null);
        if (s.note && s.note.procurement) field("member", s.note.procurement);
        if (s.note && s.note.outOfScope) field("scope", s.note.outOfScope);
        say();
      });
    }

    /* ---- and what it declined to treat as its own member ---- */
    var na = res.marks.filter(function (m) { return m.notApplicable; });
    if (na.length) {
      block("NOT SIZED — " + na.length + " MARK(S) ARE NOT THIS ENGINE'S MEMBER");
      say("  Carried deliberately. A schedule that omits them reads as if they were fine.");
      say();
      na.forEach(function (m) {
        say("  " + m.mark.id + " — " + m.mark.label + "   [" + m.notApplicable.reason + "]");
        wrap(m.notApplicable.note, 72, "    ").forEach(function (x) { say("    " + x); });
        /* the design load this mark borrows, from THIS run — never from prose */
        (m.notApplicable.reactions || []).forEach(function (rx) {
          say("      design load from " + rx.id + ": " +
              (rx.perBearingLb === null
                 ? "no reaction published — " + (rx.why || "not computed")
                 : comma(rx.perBearingLb) + " lb per bearing" + (rx.combo ? "  (" + rx.combo + ")" : "")));
        });
        say();
      });
    }

    /* ---- anything the search flagged as not checked ---- */
    var adv = [];
    res.marks.forEach(function (m) {
      (m.solution && m.solution.advisories || []).forEach(function (a) {
        adv.push({ id: m.mark.id, text: a.text });
      });
    });
    if (adv.length) {
      block("ADVISORIES — CASES THIS ENGINE DID NOT CHECK");
      adv.forEach(function (a) {
        wrap(a.id + " — " + a.text, 74, "    ").forEach(function (x) { say("  " + x); });
        say();
      });
    }

    /* ---- unification, so the reader knows a member was raised for economics ---- */
    var moves = (res.unified || []).filter(function (u) { return u.accepted; });
    if (moves.length) {
      block("SKU UNIFICATION");
      say("  Members raised for repeatability, not for capacity. Every raised member");
      say("  passed its own check at its own span and load before it was raised.");
      say();
      moves.forEach(function (u) {
        say("  " + u.group + " → " + u.target + "   (extra lumber $" + n2(u.extraLumberUSD) +
            " vs modelled SKU saving $" + n2(u.skuSavingUSD) + ")");
        u.raised.forEach(function (x) { say("      " + x.mark + ": " + x.from + " → " + x.to); });
      });
    }

    /* ---- purchase list ---- */
    block("SKU LIST");
    Object.keys(r.skus).sort().forEach(function (k) {
      say("  " + lpad(r.skus[k], 5) + "  " + k);
    });

    /* ---- where the loads came from ---- */
    block("DESIGN LOADS AND THEIR PROVENANCE");
    var A = FM.weights.ASSEMBLY;
    say("  Roof assembly    : " + A[pack.loads.roofAssembly].label + " · " +
        A[pack.loads.roofAssembly].psf + " psf  [market takeoff, not code]");
    say("      " + A[pack.loads.roofAssembly].makeup);
    say("  Floor assembly   : " + A[pack.loads.floorAssembly].label + " · " +
        A[pack.loads.floorAssembly].psf + " psf  [market takeoff, not code]");
    say("  Floor live       : " + pack.loads.floorLive + " psf  [code — " + FM.weights.LIVE.floor_residential.cite + "]");
    say("  Design roof load : " + pack.loads.roofLoad + " psf · " +
        (pack.loads.roofType === "snow" ? "snow, C_D 1.15" : "roof live, C_D 1.25"));

    /* The deck load was absent from this block entirely while the schedule
       above it sized deck members. It also sits on a code fork that a reader
       has a right to see resolved rather than assumed, so both numbers print
       and the unused one says it is unused. */
    if (pack.loads.deckLive !== undefined) {
      var dk = FM.weights.LIVE.deck, dkI = FM.weights.LIVE.deck_irc;
      say("  Deck live        : " + pack.loads.deckLive + " psf  [" + dk.cls + " — " + dk.cite + "]");
      if (dkI) {
        say("      IRC prescriptive path uses " + dkI.psf + " psf (" + dkI.cite + ").");
        say("      NOT USED HERE. This engine is on the IBC/ASCE path throughout —");
        say("      ASCE 7-22 §2.4.1 combinations, IBC Table 1604.3 deflection — and taking");
        say("      one load from the other code would make the result reproducible under");
        say("      neither. A project permitted under the IRC prescriptive deck provisions");
        say("      must be checked against that path in full.");
      }
    }
    say();
    wrap("ROOF LOAD BASIS — " + pack.loads.roofLoadBasis, 74, "    ").forEach(function (x) { say("  " + x); });
    say();
    say("  SITE VALUES BELOW ARE PLANNING DEFAULTS, NOT SITE VALUES. Replace them from");
    say("  the ASCE 7 Hazard Tool and the AHJ before anything is stamped.");
    ["groundSnow", "roofLive", "windMph", "exposure", "sdc"].forEach(function (k) {
      var c = pack.climate[k];
      if (!c) return;
      say("      " + pad(k, 14) + pad(String(c.v), 10) + "[" + c.cls + "]" + (c.note ? "  " + c.note : ""));
    });
    say();
    if (pack.code && pack.code.note) {
      wrap("CODE — " + pack.code.note, 74, "    ").forEach(function (x) { say("  " + x); });
    }
    say();
    say("  Prices, availability, labor and SKU weights are FIRM PLACEHOLDERS with no");
    say("  code standing. They rank members that already passed; they cannot make a");
    say("  member pass. Availability, however, decides which members are offered at all.");

    /* ---- the deflection basis, which is not the citation it used to print ---- */
    var fam = codeFamily(pack);
    block("DEFLECTION BASIS");
    say("  Code family declared by this pack : " + fam);
    say("  Deflection rows used by the engine: IBC Table 1604.3");
    say();
    if (fam !== "IBC") {
      var famReq = fam === "not declared" ? "a code requirement" : "an " + fam + " requirement";
      wrap("This schedule reports a TOTAL-LOAD (D + L) deflection row against every " +
           "member. IRC Table R301.7 — the table that governs one- and two-family " +
           "dwellings, which is what these plans are — has NO total-load column at all. " +
           "That row is therefore a FIRM OVERLAY this tool applies on top of the code, " +
           "not " + famReq + ". It adds a check the code does not ask for, so on that row " +
           "this schedule is more conservative than the code and not less: a member " +
           "governed by total-load deflection is deeper than the code compels. The " +
           "live-load rows do have counterparts in R301.7 — they are not reproduced here " +
           "and must be verified against the adopted edition.", 74, "  ")
        .forEach(function (x) { say("  " + x); });
      say();
    }
    /* rendered from the engine's own table, not restated, so a row that moves
       moves here too */
    var D = FM.engine && FM.engine.DEFL;
    if (D) {
      say("  Rows as the engine carries them (its citation strings, verbatim):");
      Object.keys(D).forEach(function (k) {
        var row = D[k] || {};
        say("      " + pad(k, 18) +
            pad("live ℓ/" + str(row.live, "—"), 12) +
            pad("total ℓ/" + str(row.total, "—"), 13) + str(row.cite, "—"));
      });
      say();
      if (D.roof_no_ceiling && Number(D.roof_no_ceiling.total) === 180) {
        wrap("NOTE — the roof/no-ceiling total row is carried at ℓ/180 where the " +
             "printed table gives ℓ/120. That is a firm overlay held deliberately and " +
             "in the conservative direction; the citation string beside it names the " +
             "table, which is not where the number comes from.", 74, "  ")
          .forEach(function (x) { say("  " + x); });
        say();
      }
    }
    if (pack.code && pack.code.deflectionTable) {
      wrap("PACK STATEMENT — " + pack.code.deflectionTable, 74, "    ").forEach(function (x) { say("  " + x); });
    } else {
      say("  This pack carries no `code.deflectionTable` statement of its own, so the");
      say("  paragraph above is derived from its declared code family alone. Read it");
      say("  against the pack's CODE note under DESIGN LOADS — a state that amends the");
      say("  deflection table (Florida does) amends what is written here.");
    }

    /* ---- provenance of the material values ---- */
    var meta = (typeof window !== "undefined" && window.MATDATA && window.MATDATA.meta) || {};
    block("MATERIAL PROVENANCE");
    say("  Reference design values : " + ((meta.species_grades && meta.species_grades.source_file) || "—"));
    say("                            revision " + ((meta.species_grades && meta.species_grades.dataset_version) || "—"));
    say("  Section properties      : " + ((meta.sections && meta.sections.source_file) || "—"));
    say("                            revision " + ((meta.sections && meta.sections.dataset_version) || "—"));
    say("  Southern Pine           : " + ((meta.southern_pine && meta.southern_pine.source_file) || "—"));
    say();
    say("  C_F basis is printed PER MEMBER in the schedule above, on every mark whose");
    say("  size factor is held or repo_partial, and again on that member's calculation");
    say("  sheet. A value shown as 'repo_partial' comes from a catalog field the catalog");
    say("  itself declares is for threshold testing only, and is not a citable published");
    say("  size-factor table.");

    /* ---- the engine's own boundaries, as the engine declares them ----
       LIMITS is maintained in engine.js and grows: it is where calc-spec §1.4's
       slope statement and the absence of any wall dead load were put. Rendering
       the array rather than restating it means an item added there reaches the
       schedule without anyone remembering to copy it. It is NOT a summary of
       the 24 below — the two lists overlap and neither replaces the other. */
    /* ---- engine limits, then the 24 verbatim ----
       Both come from FM.scope.render, which the calc record in core.js also
       calls. The two outputs used to build this section independently and the
       calc record's copy had gone stale at 13 paraphrased items. */
    FM.scope.render(say, { heading: block });

    say();
    say(rule("="));
    say("END OF SCHEDULE — " + plan.name + " / " + pack.name);
    say(rule("="));
    return L.join("\n");
  }

  function download(text, filename) {
    var blob = new Blob([text], { type: "text/plain" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function exportSchedule(plan, pack) {
    var text = scheduleText(plan, pack, { at: new Date().toISOString().slice(0, 16).replace("T", " ") + " UTC" });
    download(text, "firmark-schedule-" + plan.id + "-" + pack.id + ".txt");
    if (FM.toast) FM.toast("Schedule exported — carries calc-spec §8 in full.");
  }

  FM.exportSchedule = exportSchedule;
  FM.scheduleText = scheduleText;
})();

<script>
/* ============================================================
   Materials browser — reads the embedded MATDATA payload, which
   was extracted verbatim from the public material-databases repo.
   Every value shown here carries the seed file it came from.
   ============================================================ */

(function () {
  "use strict";

  var el = FM.el, card = FM.card, fmt = FM.fmt, comma = FM.comma;

  var TABS = [
    { id: "sections",   label: "Section properties", cite: "sections" },
    { id: "sawn",       label: "Sawn design values", cite: "species_grades" },
    { id: "southern",   label: "Southern Pine",      cite: "southern_pine" },
    { id: "glulam",     label: "Glulam",             cite: "glulam" },
    { id: "steel",      label: "Steel shapes",       cite: "steel_shapes" }
  ];

  function meta(key) {
    return (window.MATDATA && MATDATA.meta && MATDATA.meta[key]) || {};
  }

  function citation(key) {
    var m = meta(key);
    if (!m.source_file) return null;
    return el("p", { class: "src-note", style: "margin-top:10px" }, [
      el("span", { text: "Source: " }),
      el("strong", { text: m.source_file }),
      el("span", { text: m.dataset_version ? "  ·  dataset revision " + m.dataset_version : "" }),
      el("br"),
      el("span", { text: m.governing_reference || m.title || "" })
    ]);
  }

  /* meta = { total, query, noun } — the count context.

     A filter with no matches used to render a table with headers and nothing
     under them, while the stat cards overhead still read "86 S4S sections".
     Nothing on the page said the list had been filtered, so an empty catalog
     and an over-narrow filter looked identical. The row count travels with the
     table now, and an empty result says what was searched and what it searched
     against — a table is not allowed to be silent about being empty. */
  function tableFrom(cols, rows, rowFn, meta) {
    meta = meta || {};
    var total = meta.total === undefined ? rows.length : meta.total;
    var noun = meta.noun || "rows";
    var q = (meta.query || "").trim();

    var tb = el("tbody");
    if (!rows.length) {
      tb.appendChild(el("tr", {}, [
        el("td", { colspan: String(cols.length), class: "empty-cell" }, [
          el("div", { class: "empty", style: "margin:0" }, [
            el("strong", { text: q ? "No " + noun + " match “" + q + "”" : "No " + noun + " in this tab" }),
            el("div", { class: "clause", style: "margin-top:4px",
                        text: q ? "The tab holds " + comma(total) + " " + noun +
                                  ". Clear the filter to see them."
                                : "The catalog payload carries none for this tab." })
          ])
        ])
      ]));
    } else {
      rows.forEach(function (r) { tb.appendChild(rowFn(r)); });
    }

    var showing = rows.length === total
      ? comma(total) + " " + noun
      : comma(rows.length) + " of " + comma(total) + " " + noun + (q ? " · filter “" + q + "”" : "");

    return el("div", {}, [
      el("div", { class: "tw", tabindex: "0", role: "region",
                  "aria-label": "Material data table — " + showing }, [
        el("table", {}, [
          el("thead", {}, [el("tr", {}, cols.map(function (c) {
            return el("th", { class: c.n ? "n" : null, text: c.label });
          }))]),
          tb
        ])
      ]),
      el("div", { class: "clause", style: "margin-top:6px", role: "status",
                  text: "Showing " + showing })
    ]);
  }

  FM.VIEWS.materials = function (host) {
    if (!window.MATDATA) {
      host.appendChild(FM.pageHead("Materials", "Catalog data"));
      host.appendChild(el("div", { class: "empty", text: "Material catalog failed to load." }));
      return;
    }

    host.appendChild(FM.pageHead("Materials", "Sourced reference values — the number on the sheet is the number in the book.", [
      el("button", {
        class: "btn btn-sm",
        onclick: function () { FM.toast("Catalogs are published for review at github.com/Firmark/material-databases"); },
        text: "About this data"
      })
    ]));

    /* headline counts, computed from the payload itself */
    var counts = [
      { v: comma(MATDATA.sections.length), l: "S4S sections" },
      { v: comma(MATDATA.species_grades.length), l: "Sawn design values" },
      { v: comma(MATDATA.southern_pine.records.length), l: "Southern Pine rows" },
      { v: comma(MATDATA.glulam.length), l: "Glulam classes" },
      { v: comma(MATDATA.steel_shapes.length), l: "W-shapes" }
    ];
    host.appendChild(el("div", { class: "grid g5", style: "margin-bottom:16px" },
      counts.map(function (c) { return FM.statCard(c.v, c.l); })));

    var state = { tab: "sections", q: "" };

    var tabs = el("div", { class: "seg", role: "tablist", "aria-label": "Material catalog", style: "margin-bottom:12px" });

    function selectTab(id, focus) {
      state.tab = id;
      Array.prototype.forEach.call(tabs.querySelectorAll("button"), function (b, i) {
        var on = TABS[i].id === id;
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.tabIndex = on ? 0 : -1;
        if (on && focus) b.focus();
      });
      draw();
    }

    TABS.forEach(function (t, i) {
      tabs.appendChild(el("button", {
        role: "tab", id: "mtab-" + t.id, "aria-controls": "mpanel",
        "aria-selected": t.id === state.tab ? "true" : "false",
        tabindex: t.id === state.tab ? "0" : "-1",
        text: t.label,
        onclick: function () { selectTab(t.id, false); },
        onkeydown: function (e) {
          var n = null;
          if (e.key === "ArrowRight") n = TABS[(i + 1) % TABS.length];
          else if (e.key === "ArrowLeft") n = TABS[(i - 1 + TABS.length) % TABS.length];
          else if (e.key === "Home") n = TABS[0];
          else if (e.key === "End") n = TABS[TABS.length - 1];
          if (n) { e.preventDefault(); selectTab(n.id, true); }
        }
      }));
    });

    var search = el("input", {
      type: "text", placeholder: "Filter…", "aria-label": "Filter material rows",
      style: "max-width:240px"
    });
    search.addEventListener("input", function () { state.q = this.value; draw(); });

    host.appendChild(el("div", { class: "filter-bar", style: "margin-bottom:12px" }, [tabs, search]));

    var body = el("div", { id: "mpanel", role: "tabpanel", tabindex: "0" });
    host.appendChild(body);

    function match(hay) {
      var q = state.q.trim().toLowerCase();
      return !q || hay.toLowerCase().indexOf(q) !== -1;
    }

    function draw() {
      body.innerHTML = "";
      var node, key;

      if (state.tab === "sections") {
        key = "sections";
        var rows = MATDATA.sections.filter(function (r) { return match(r.nominal + " " + r.size_class); });
        node = tableFrom(
          [{ label: "Nominal" }, { label: "Class" }, { label: "b (in)", n: 1 }, { label: "d (in)", n: 1 },
           { label: "A (in²)", n: 1 }, { label: "Sx (in³)", n: 1 }, { label: "Ix (in⁴)", n: 1 }],
          rows,
          function (r) {
            return el("tr", {}, [
              el("td", { class: "k", text: r.nominal }),
              el("td", { text: r.size_class }),
              el("td", { class: "n", text: fmt(r.b_in, 3) }),
              el("td", { class: "n", text: fmt(r.d_in, 3) }),
              el("td", { class: "n", text: fmt(r.A_in2, 3) }),
              el("td", { class: "n", text: fmt(r.Sx_in3, 3) }),
              el("td", { class: "n", text: fmt(r.Ix_in4, 2) })
            ]);
          },
          { total: MATDATA.sections.length, query: state.q, noun: "S4S sections" }
        );
      } else if (state.tab === "sawn" || state.tab === "southern") {
        key = state.tab === "sawn" ? "species_grades" : "southern_pine";
        var src = state.tab === "sawn" ? MATDATA.species_grades : MATDATA.southern_pine.records;
        var recs = src.filter(function (r) { return match(r.species + " " + r.grade + " " + r.size_class); });
        node = tableFrom(
          [{ label: "Species" }, { label: "Grade" }, { label: "Size class" },
           { label: "Fb", n: 1 }, { label: "Ft", n: 1 }, { label: "Fv", n: 1 },
           { label: "Fc⊥", n: 1 }, { label: "Fc", n: 1 }, { label: "E", n: 1 }, { label: "Emin", n: 1 }],
          recs,
          function (r) {
            var v = r.values_psi || {};
            return el("tr", {}, [
              el("td", { class: "k" }, [
                el("span", { text: r.species }),
                r.common ? el("span", { class: "badge b-gold", style: "margin-left:6px", text: "Common" }) : null
              ]),
              el("td", { text: r.grade }),
              el("td", { text: r.size_class }),
              el("td", { class: "n", text: v.Fb == null ? "—" : comma(v.Fb) }),
              el("td", { class: "n", text: v.Ft == null ? "—" : comma(v.Ft) }),
              el("td", { class: "n", text: v.Fv == null ? "—" : comma(v.Fv) }),
              el("td", { class: "n", text: v.Fc_perp == null ? "—" : comma(v.Fc_perp) }),
              el("td", { class: "n", text: v.Fc == null ? "—" : comma(v.Fc) }),
              el("td", { class: "n", text: v.E == null ? "—" : comma(v.E) }),
              el("td", { class: "n", text: v.Emin == null ? "—" : comma(v.Emin) })
            ]);
          },
          { total: src.length, query: state.q,
            noun: state.tab === "sawn" ? "sawn design-value rows" : "Southern Pine rows" }
        );
      } else if (state.tab === "glulam") {
        key = "glulam";
        var gl = MATDATA.glulam.filter(function (r) { return match(r.stress_class); });
        node = tableFrom(
          [{ label: "Stress class" }, { label: "Fbx+", n: 1 }, { label: "Fbx−", n: 1 }, { label: "Fvx", n: 1 },
           { label: "Fc⊥x", n: 1 }, { label: "Ex (app)", n: 1 }, { label: "Ex min", n: 1 }, { label: "Ft", n: 1 }, { label: "Fc", n: 1 }],
          gl,
          function (r) {
            return el("tr", {}, [
              el("td", { class: "k", text: r.stress_class }),
              el("td", { class: "n", text: r.Fbx_pos == null ? "—" : comma(r.Fbx_pos) }),
              el("td", { class: "n", text: r.Fbx_neg == null ? "—" : comma(r.Fbx_neg) }),
              el("td", { class: "n", text: r.Fvx == null ? "—" : comma(r.Fvx) }),
              el("td", { class: "n", text: r.Fc_perp_x == null ? "—" : comma(r.Fc_perp_x) }),
              el("td", { class: "n", text: r.Ex_app == null ? "—" : comma(r.Ex_app) }),
              el("td", { class: "n", text: r.Ex_min == null ? "—" : comma(r.Ex_min) }),
              el("td", { class: "n", text: r.Ft == null ? "—" : comma(r.Ft) }),
              el("td", { class: "n", text: r.Fc == null ? "—" : comma(r.Fc) })
            ]);
          },
          { total: MATDATA.glulam.length, query: state.q, noun: "glulam classes" }
        );
      } else {
        key = "steel_shapes";
        var st = MATDATA.steel_shapes.filter(function (r) { return match(r.designation + " " + r.family); });
        node = tableFrom(
          [{ label: "Shape" }, { label: "W (lb/ft)", n: 1 }, { label: "A (in²)", n: 1 }, { label: "d (in)", n: 1 },
           { label: "Ix (in⁴)", n: 1 }, { label: "Sx (in³)", n: 1 }, { label: "Zx (in³)", n: 1 }, { label: "ry (in)", n: 1 }],
          st,
          function (r) {
            return el("tr", {}, [
              el("td", { class: "k", text: r.designation }),
              el("td", { class: "n", text: fmt(r.W_lbft, 1) }),
              el("td", { class: "n", text: fmt(r.A_in2, 2) }),
              el("td", { class: "n", text: fmt(r.d_in, 2) }),
              el("td", { class: "n", text: comma(r.Ix_in4) }),
              el("td", { class: "n", text: fmt(r.Sx_in3, 1) }),
              el("td", { class: "n", text: fmt(r.Zx_in3, 1) }),
              el("td", { class: "n", text: fmt(r.ry_in, 2) })
            ]);
          },
          { total: MATDATA.steel_shapes.length, query: state.q, noun: "W-shapes" }
        );
      }

      body.setAttribute("aria-labelledby", "mtab-" + state.tab);
      body.appendChild(node);
      var c = citation(key);
      if (c) body.appendChild(c);
    }

    draw();

    /* the honest note about what the catalog does NOT carry */
    host.appendChild(el("div", { style: "margin-top:18px" }, [
      card("Not in the catalog", el("span", { class: "badge b-warn", text: "Gap", style: "margin-left:auto" }),
        el("div", { style: "display:grid;gap:8px;font-size:.85rem" }, [
          el("p", { text: "The NDS size-factor (C_F) table is not published in the material catalog. The engine therefore treats C_F as a typed input, marked as unsourced on every sheet that uses it, rather than substituting a remembered value." }),
          el("p", { class: "src-note", text: "Checked: Table 4A seed metadata, member_db migrations, and the phase-1 member database. The only C_F numbers in the repo are per-record wet-service threshold helpers, flagged by the seed itself as not a citable adjustment table." })
        ]),
        "Values are never invented, interpolated, or decoded from model names")
    ]));
  };
})();

      foundation: "slab-on-grade",
      exteriorWall: "cmu",
      exteriorWallNote: "HVHZ production housing is essentially all concrete block with concrete lintels. Wood " +
                        "exterior headers do not exist in this market.",
      roofFraming: "truss",
      service: { wet: false, exteriorWet: true },
      loads: {
        roofAssembly: "roof_tile", floorAssembly: "floor_res", ceilingAssembly: "ceiling_attic",
        roofLoad: 20, roofType: "roof_live",
        roofLoadBasis: "No snow. Lr = 20 psf, C_D = 1.25. What moves here is the DEAD load: concrete tile at " +
                       "22 psf total against 15 psf for shingle. That alone takes a 12 ft lanai beam from a 4x10 " +
                       "to a 4x12, so tile must be a plan VARIANT and not an afterthought.",
        floorLive: LIVE.floor_residential.psf, ceilingLive: LIVE.attic_no_storage.psf,
        deckLive: LIVE.deck.psf
      },
      plateHeightIn: 109.125,
      palette: [
        { species: "Southern Pine", grade: "No.2", bfUSD: 0.72, stockFactor: 1.00, cullRate: 0.04 },
        { species: "Southern Pine", grade: "No.1", bfUSD: 0.90, stockFactor: 0.85, cullRate: 0.04 },
        { species: "Southern Pine", grade: "Select Structural", bfUSD: 1.15, stockFactor: 0.55, cullRate: 0.04 }
      ],
      weights: { depthPerInchSfByRole: { joist: 0.120, rafter: 0.010, ceiling: 0.005, header: 0, beam: 0.015 } },
      maxDCR: 0.85,
      maxDCRBasis: "Firm policy: leave gravity headroom where the same section will also be checked for uplift."
    }
  ];

  /* ---------------- unification bonus ----------------
     Collapsing a group to ONE size buys system effects that a per-SKU handling
     charge does not price: one rim depth, one hanger SKU, one subfloor
     elevation, no bay transitions, and no chance of a 2x10 landing in a 2x12
     bay. Estimators put a single floor depth at $150–400 per house on its own —
     far more than the $40 the generic SKU term carries. It is awarded only when
     a group actually collapses to a single SKU, because that is the only
     condition under which those effects exist. All [market], all estimates. */
  var UNIFY_BONUS = {
    floor:   220,   /* one joist depth for the whole floor                    [market] */
    header:  120,   /* a banded header schedule is the biggest SKU reduction
                       available in a production plan                          [market] */
    roof:     60,
    ceiling:  40,
    deck:     40,
    porch:     0    /* two porch beams of different spans are two members, and
                       nobody bundles them                                     [market] */
  };

  /* ---------------- ladders, spacings, roles ----------------
     Solid sawn only. Multi-ply built-up members and engineered lumber are
     outside the engine (calc-spec §8.6, §8.19), and nothing 14 in or wider is
     offered because the catalog carries no C_F for it (gap #1) and the engine
     refuses rather than hold C_F at 1.00. */
  var LADDERS = {
    rafter:  ["2x6", "2x8", "2x10", "2x12"],
    joist:   ["2x8", "2x10", "2x12"],
    ceiling: ["2x4", "2x6", "2x8", "2x10"],
    header:  ["4x6", "4x8", "4x10", "4x12"],
    beam:    ["4x6", "4x8", "4x10", "4x12"],
    deck:    ["2x8", "2x10", "2x12"]
  };

  /* 19.2 in o.c. is on the tape and saves 20% of the pieces, and sawn-lumber
     crews still mislay it. It is offered on engineered floors only, and this
     build has none — so floors are 16 in o.c. */
  var SPACINGS = {
    rafter:  [16, 24],
    joist:   [16],
    ceiling: [16, 24],
    deck:    [12, 16]
  };

  var REPETITIVE = { rafter: true, joist: true, ceiling: true, deck: true, header: false, beam: false };

  var DEFL_ROW = {
    rafter:  "roof_nonplaster",     /* gypsum ceiling below */
    ceiling: "roof_nonplaster",
    joist:   "floor",
    deck:    "floor",
    header:  "roof_nonplaster",
    beam:    "roof_no_ceiling"      /* open porch soffit, nothing applied to the underside */
  };

  /* ---------------- repeatable tract-home plans ----------------
     Built around the marks that are REAL in these three states.

     A production roof in Texas, the Carolinas and Florida is a truss package
     at 24 in o.c., engineered by the truss supplier as a deferred sealed
     submittal. Rafter and ceiling-joist marks are fiction outside porch roofs,
     dormers and tray areas. Long openings are engineered headers. Both are
     carried here as marks with `component: true` or `escalate: true` so the
     schedule shows what it is NOT designing — a plan that silently omits the
     garage header reads as if the garage header were fine.

     Where this engine is genuinely the right tool: treated lanai and porch
     beams, North Carolina crawlspace floor joists and decks, and small-to-mid
     headers. Those are the marks it solves. */

  var PLANS = [
    {
      id: "sunbelt-ranch-1850",
      name: "Sunbelt Ranch 1850",
      summary: "1,860 sf single-story slab-on-grade, 50 ft × 46 ft, two-car garage, trusses at 24 in o.c.",
      lots: 100,
      note: "The entry-level production footprint in DFW, San Antonio, Orlando, Tampa, Charlotte and Raleigh. " +
            "The roof clear-spans on common trusses, which is the product feature — it is what makes the " +
            "partitions movable between elevations.",
      marks: [
        { id: "T-1",     label: "Common roof truss · 46 ft clear span", role: "rafter", span: 46, count: 22,
          component: true,
          componentNote: "Truss package, deferred sealed submittal by the truss supplier. Out of scope: this engine " +
                         "designs simple-span solid-sawn members only (calc-spec §8.6, §8.19)." },
        { id: "BM-LAN",  label: "Lanai beam", role: "beam", span: 12.0, trib: 7.0, count: 2,
          exposure: "exterior", braced: false, skuGroup: "porch",
          note: "The best-fitting mark in the system: simple span, uniform load, treated Southern Pine, wet service." },
        { id: "BM-LAN-W", label: "Lanai beam · wide bay", role: "beam", span: 16.0, trib: 7.0, count: 1,
          exposure: "exterior", braced: false, skuGroup: "porch" },
        { id: "HDR-W",   label: "Window header · typical", role: "header", span: 5.0, trib: 4.0, count: 14,
          skuGroup: "header", headHeightIn: 80 },
        { id: "HDR-GAR-G", label: "Garage header · gable end over the door", role: "header", span: 16.67, trib: 2.0, count: 1,
          skuGroup: "header", headHeightIn: 84,
          note: "Same opening as HDR-GAR-B. The truss direction is the entire design: 2 ft of tributary here, 11 ft there." },
        { id: "HDR-GAR-B", label: "Garage header · trusses bearing", role: "header", span: 16.67, trib: 11.0, count: 1,
          skuGroup: "header", headHeightIn: 84, escalateExpected: true,
          note: "Under a bearing truss line this is a 3-ply LVL or a girder truss in every one of these markets." },
        { id: "HDR-SLD", label: "Rear slider header · under clear-span truss", role: "header", span: 12.0, trib: 23.0, count: 1,
          skuGroup: "header", headHeightIn: 80, escalateExpected: true,
          note: "Tributary is half the 46 ft truss span. This is why exterior openings in production single-stories " +
                "are almost always engineered." }
      ]
    },
    {
      id: "two-story-2450",
      name: "Two-Story 2450",
      summary: "2,450 sf two-story, 40 ft × 38 ft first floor, ~1,180 sf second floor, centre bearing line",
      lots: 60,
      note: "The second floor is the mark set that matters. In Texas and Florida this floor is increasingly an " +
            "open-web truss or an I-joist; sawn 2x is Carolina value product and some Texas builders.",
      marks: [
        { id: "FJ-1", label: "2nd floor joist · front bay", role: "joist", span: 13.5, count: 26, skuGroup: "floor",
          note: "The DCR-policy mark: 2x10 SYP #2 reaches 13 ft 3 in at a 0.90 target and 14 ft 0 in at 1.00." },
        { id: "FJ-2", label: "2nd floor joist · rear bay", role: "joist", span: 15.0, count: 24, skuGroup: "floor" },
        { id: "FJ-3", label: "2nd floor joist · bath and laundry", role: "joist", span: 9.5, count: 10, skuGroup: "floor",
          note: "Solves shallow, and is the prime unification target — one floor depth is worth more than the lumber." },
        { id: "GB-1", label: "Centre floor girder", role: "beam", span: 12.0, trib: 13.5, count: 2, skuGroup: "girder",
          braced: true, escalateExpected: true,
          note: "Multi-ply LVL or a steel W-shape in the market. The catalog carries 48 W-shapes; the calc-spec has " +
                "no steel method, so this engine cannot design either answer." },
        { id: "HDR-1", label: "1st-floor opening header", role: "header", span: 5.0, trib: 6.75, count: 10,
          carries: "roof+floor", skuGroup: "header", headHeightIn: 80 },
        { id: "HDR-2", label: "2nd-floor window header", role: "header", span: 4.0, trib: 12.0, count: 12,
          skuGroup: "header", headHeightIn: 80 },
        { id: "DK-1", label: "Deck joist · treated", role: "deck", span: 12.0, count: 16, skuGroup: "deck",
          exposure: "exterior",
          note: "North Carolina production homes very often carry one. IRC R507, 40 psf live." },
        { id: "DK-2", label: "Deck beam · treated", role: "beam", span: 8.0, trib: 6.0, count: 2, skuGroup: "deck",
          exposure: "exterior", braced: false }
      ]
    },
    {
      id: "coastal-duplex-1600",
      name: "Coastal Duplex 1600",
      summary: "1,600 sf per unit, two-story paired duplex, 26 ft × 32 ft per unit, party wall bearing",
      lots: 24,
      note: "Maps to the sample Punta Gorda project — Charlotte County, windborne-debris region, not HVHZ. " +
            "This is the archetype where the engine has the least to say: the design action that governs the " +
            "building is the continuous uplift load path, and it is excluded by calc-spec §8.11 and §8.17.",
      marks: [
        { id: "T-1",  label: "Common roof truss · 26 ft", role: "rafter", span: 26, count: 17, component: true,
          componentNote: "Truss package, uplift-governed, deferred sealed submittal. Out of scope." },
        { id: "FJ-1", label: "2nd floor joist", role: "joist", span: 15.5, count: 25, skuGroup: "floor",
          note: "Runs tight against the 2x12 limit — the mark that shows why a firm DCR target below 1.00 exists." },
        { id: "BM-POR", label: "Porch beam · treated", role: "beam", span: 10.0, trib: 6.0, count: 2,
          exposure: "exterior", braced: false, skuGroup: "porch" },
        { id: "HDR-SLD", label: "1st-floor slider header · roof + floor", role: "header", span: 8.0, trib: 20.75, count: 2,
          carries: "roof+floor", skuGroup: "header", headHeightIn: 80, escalateExpected: true }
      ]
    }
  ];

  /* ---------------- assembly ---------------- */

  function merge() {
    var out = {}, i, k, src;
    for (i = 0; i < arguments.length; i++) {
      src = arguments[i];
      if (!src) continue;
      for (k in src) if (Object.prototype.hasOwnProperty.call(src, k)) out[k] = src[k];
    }
    return out;
  }

  function packById(id) { return PACKS.filter(function (p) { return p.id === id; })[0] || null; }
  function planById(id) { return PLANS.filter(function (p) { return p.id === id; })[0] || null; }

  function policyFor(pack, plan, role) {
    var weights = merge(BASE.weights, pack.weights, plan && plan.weights);
    var ladder = LADDERS[role] || LADDERS.rafter;
    var spacings = REPETITIVE[role] ? (SPACINGS[role] || [16, 24]) : [0];

    return {
      id: pack.id + (role ? ":" + role : ""),
      name: pack.name + (role ? " · " + role : ""),
      role: role || null,
      maxDCR: (plan && plan.maxDCR) || pack.maxDCR || BASE.maxDCR,
      minAvailability: pack.minAvailability === undefined ? BASE.minAvailability : pack.minAvailability,
      gammaPcf: pack.gammaPcf || BASE.gammaPcf,
      palette: pack.palette,
      ladder: ladder,
      spacings: spacings,
      weights: weights,
      incisedWhenTreated: INCISED_WHEN_TREATED,
      unifyBonus: UNIFY_BONUS,
      priceOf: function (cand, demand) {
        var p = pack.palette.filter(function (x) {
          return x.species === cand.species && x.grade === cand.grade;
        })[0];
        var channel = (demand && demand.wet) ? STOCK.wet : STOCK.dry;
        var sizeAvail = channel[cand.size];
        if (sizeAvail === undefined) sizeAvail = 0.25;
        return {
          bfUSD: p && isFinite(p.bfUSD) ? p.bfUSD : weights.baseBfUSD,
          cullRate: p && isFinite(p.cullRate) ? p.cullRate : 0,
          availability: (p && isFinite(p.stockFactor) ? p.stockFactor : 0.5) * sizeAvail
        };
      }
    };
  }

  function demandFor(mark, plan, pack) {
    var role = mark.role;
    var L = pack.loads;
    var roofDead = ASSEMBLY[L.roofAssembly].psf;
    var floorDead = ASSEMBLY[L.floorAssembly].psf;
    var ceilingDead = ASSEMBLY[L.ceilingAssembly].psf;

    var d = {
      role: role,
      span: mark.span,
      trib: mark.trib || 0,
      repetitive: !!REPETITIVE[role],
      wet: mark.exposure === "exterior" ? !!pack.service.exteriorWet : !!pack.service.wet,
      braced: mark.braced === undefined ? true : !!mark.braced,
      bearing: mark.bearing || (REPETITIVE[role] ? 3.0 : 3.5),
      memberUse: mark.memberUse || DEFL_ROW[role] || "floor",
      roofType: L.roofType
    };

    /* a header's depth budget is set by the plate and the head height, less a
       double top plate and a shim. A member that does not fit is not a cheaper
       member — it is a plate-height change and a revision. */
    if (mark.maxDepthIn) d.maxDepthIn = mark.maxDepthIn;
    else if (mark.headHeightIn && pack.plateHeightIn) {
      d.maxDepthIn = pack.plateHeightIn - mark.headHeightIn - 3.0 - 0.5;
    }

    if (role === "rafter") {
      d.dead = roofDead; d.live = 0; d.roofLoad = L.roofLoad;
    } else if (role === "ceiling") {
      d.dead = ceilingDead; d.live = L.ceilingLive; d.roofLoad = 0; d.roofType = "snow";
    } else if (role === "joist") {
      d.dead = floorDead; d.live = L.floorLive; d.roofLoad = 0; d.roofType = "snow";
    } else if (role === "deck") {
      d.dead = ASSEMBLY.deck_pt.psf; d.live = L.deckLive; d.roofLoad = 0; d.roofType = "snow";
    } else if (role === "header" || role === "beam") {
      if (mark.carries === "roof+floor") {
        d.dead = roofDead + floorDead; d.live = L.floorLive; d.roofLoad = L.roofLoad;
      } else if (mark.carries === "floor") {
        d.dead = floorDead; d.live = L.floorLive; d.roofLoad = 0; d.roofType = "snow";
      } else {
        d.dead = roofDead; d.live = 0; d.roofLoad = L.roofLoad;
      }
    } else {
      d.dead = roofDead; d.live = 0; d.roofLoad = L.roofLoad;
    }
    return d;
  }

  /* a mark can be structurally irrelevant in a region — a wood exterior header
     in a concrete-block market is not a member anybody will build */
  function applicability(mark, pack) {
    if (mark.component) {
      return { applicable: false, reason: "component", note: mark.componentNote ||
               "Manufactured component — designed by its supplier as a deferred sealed submittal." };
    }
    if (mark.role === "header" && pack.exteriorWall === "cmu" && mark.carries !== "floor") {
      return { applicable: false, reason: "wall-system", note: pack.exteriorWallNote ||
               "Exterior walls are concrete block in this market; this opening is spanned by a concrete lintel, not a wood header." };
    }
    return { applicable: true };
  }

  FM.weights = {
    BASE: BASE, PACKS: PACKS, PLANS: PLANS,
    ASSEMBLY: ASSEMBLY, LIVE: LIVE, STOCK: STOCK,
    LADDERS: LADDERS, SPACINGS: SPACINGS, REPETITIVE: REPETITIVE, DEFL_ROW: DEFL_ROW,
    UNIFY_BONUS: UNIFY_BONUS,
    INCISED_WHEN_TREATED: INCISED_WHEN_TREATED,
    policyFor: policyFor, demandFor: demandFor, applicability: applicability,
    packById: packById, planById: planById
  };
})();

<script>
/* ============================================================
   Sizing solver — the search that proposes a member; the engine
   is still the only thing that decides whether it passes.

   Two rules govern everything in this file:

     1. The solver never computes a capacity. Every feasibility
        verdict comes from FM.engine.run(), unmodified. The solver
        chooses WHICH members to ask about and in WHAT order.
     2. The weights order the feasible set. They cannot promote an
        infeasible member: feasibility is tested before scoring and
        no weight participates in that test. (Enforced by test
        "weights cannot select an overstressed member".)

   Full derivation of the bounds, the dominance argument and the
   weight model is in solver-spec.md.
   ============================================================ */

(function () {
  "use strict";

  var GAMMA_PCF = 35;          /* calc-spec §1.3 — editable assumption, not a sourced value */
  var EPS = 1e-9;

  /* ---------- small geometry helpers ---------- */

  function nominalDims(nominal) {
    var m = /^(\d+)x(\d+)$/.exec(nominal || "");
    return m ? { b: Number(m[1]), d: Number(m[2]) } : null;
  }

  /* Lumber is bought in even 2-ft lengths. A 13'-0" rafter is cut from a 14-footer,
     so the piece that shows up on the invoice is longer than the span. */
  function stockLength(spanFt) {
    var need = spanFt + 0.5;                  /* bearing at both ends */
    var len = Math.ceil(need / 2) * 2;
    return Math.max(8, Math.min(24, len));
  }

  function boardFeetPerLF(nominal) {
    var n = nominalDims(nominal);
    return n ? (n.b * n.d) / 12 : 0;
  }

  /* ---------- load combinations ----------
     Mirrors the combination set engine.js builds, so the seed bounds in §H1 are
     taken against the same envelope the check will use. Guarded by the test
     "solver combos match engine combos" — if engine.js ever changes its
     combination set, that test fails rather than the bound going quietly wrong. */

  function combosFor(D, L, Lr, roofType) {
    var CD = FM.engine.CD;
    var roofCD = roofType === "roof_live" ? CD.roof_live : CD.snow;
    var out = [{ label: "D", psf: D, cd: CD.dead.v }];
    if (L > 0) out.push({ label: "D + L", psf: D + L, cd: CD.live.v });
    if (Lr > 0) out.push({ label: "D + R", psf: D + Lr, cd: roofCD.v });
    if (L > 0 && Lr > 0) out.push({ label: "D + 0.75L + 0.75R", psf: D + 0.75 * L + 0.75 * Lr, cd: roofCD.v });
    return out;
  }

  /* ---------- demand → engine inputs ----------
     One place builds engine inputs, so the number the solver scored and the
     number the sheet re-checks can never disagree. */

  function tribFt(demand, cand) {
    return demand.repetitive ? cand.spacing / 12 : Number(demand.trib || 0);
  }

  /* calc-spec §1.3 case (b): a beam's own weight is NOT inside q_D, and it
     depends on the section — so the demand is a function of the candidate.
     Expressed as psf over the tributary width, the engine's w = psf · t_w
     reproduces w_sw = γ·A/144 exactly. */
  function selfWeightPsf(demand, cand, policy) {
    if (demand.repetitive) return 0;
    var sec = FM.engine.findSection(cand.size);
    var t = tribFt(demand, cand);
    if (!sec || !(t > 0)) return 0;
    var gamma = (policy && policy.gammaPcf) || GAMMA_PCF;
    return (gamma * sec.A_in2 / 144) / t;
  }

  function memberInputs(demand, cand, policy) {
    var sw = selfWeightPsf(demand, cand, policy);
    return {
      species: cand.species, grade: cand.grade, size: cand.size,
      span: demand.span,
      spacing: demand.repetitive ? cand.spacing : Number(demand.trib || 0) * 12,
      dead: Number(demand.dead || 0) + sw,
      live: Number(demand.live || 0),
      roofLoad: Number(demand.roofLoad || 0),
      roofType: demand.roofType || "snow",
      repetitive: !!demand.repetitive,
      wet: !!demand.wet,
      braced: !!demand.braced,
      bearing: Number(demand.bearing || 1.5),
      memberUse: demand.memberUse || "floor",
      CF: "auto",                      /* the depth moves, so C_F must move with it */
      selfWeightPsf: sw
    };
  }

  /* ---------- the weighted objective ----------
     Every term is in dollars, so scores are comparable across regions and
     across candidate sets. Nothing here is a code value; see weights.js. */

  function costOf(demand, cand, policy) {
    var w = policy.weights;
    var sec = FM.engine.findSection(cand.size);
    if (!sec) return null;

    var len = stockLength(demand.span);
    var bf = boardFeetPerLF(cand.size) * len;
    var lb = (policy.gammaPcf || GAMMA_PCF) * sec.A_in2 / 144 * len;

    var priced = policy.priceOf ? policy.priceOf(cand, demand) : null;
    var bfUSD = priced && isFinite(priced.bfUSD) ? priced.bfUSD : w.baseBfUSD;
    var availability = priced && isFinite(priced.availability) ? priced.availability : 1;
    var cullRate = priced && isFinite(priced.cullRate) ? priced.cullRate : 0;

    /* area served by one piece — repetitive framing is compared per square foot
       of floor/roof, which is the only way a spacing change can be scored
       honestly against a size change */
    var area = demand.repetitive ? (cand.spacing / 12) * demand.span
                                 : Number(demand.trib || 1) * demand.span;
    if (!(area > 0)) area = 1;

    /* Material is charged over the FULL stock length, because that is the stick
       you buy — the drop is already paid for. `dropHandling` is therefore not a
       second charge for the lumber (that was a double-count); it prices sorting,
       stacking and disposing of the offcut, net of whatever gets used elsewhere.
       A `waste: 1.10` weight in the estimating sense does not belong here. */
    var material = bf * bfUSD * w.material * (1 + cullRate);
    var labor = laborPerPiece(demand, w) + w.laborPerLb * lb;
    var drop = (len - demand.span) * boardFeetPerLF(cand.size) * bfUSD * w.dropHandling;
    var depth = sec.d_in * depthWeight(demand, w) * area;
    var stock = (1 - Math.max(0, Math.min(1, availability))) * w.stockPenaltySf * area;

    var cf = FM.engine.sizeFactor(cand.species, cand.grade, cand.size);
    var risk = cf.basis === "held" ? w.unsourcedCF : 0;

    var total = material + labor + drop + depth + stock + risk;
    return {
      totalUSD: total, perSF: total / area, area: area,
      lengthFt: len, boardFeet: bf, weightLb: lb,
      terms: { material: material, labor: labor, drop: drop, depth: depth, stock: stock, risk: risk },
      bfUSD: bfUSD, availability: availability, cullRate: cullRate, cfBasis: cf.basis
    };
  }

  /* A lanai beam and a floor joist are not the same job, and a floor joist's
     depth costs building height while a roof member's does not. Both weights are
     therefore keyed by role, falling back to the flat value. */
  function laborPerPiece(demand, w) {
    var byRole = w.laborPerPieceByRole || {};
    var v = byRole[demand.role];
    return isFinite(v) ? v : w.laborPerPiece;
  }
  function depthWeight(demand, w) {
    var byRole = w.depthPerInchSfByRole || {};
    var v = byRole[demand.role];
    return isFinite(v) ? v : w.depthPerInchSf;
  }

  /* slack is scored only after a candidate is known feasible, so it can never
     act on the pass/fail decision — it just stops the search from proposing a
     4x12 where a 2x8 was already inside the firm's DCR target */
  function slackPenalty(dcr, policy) {
    var target = policy.maxDCR;
    var unused = Math.max(0, target - dcr) / target;
    return unused * policy.weights.slackPenalty;
  }

  /* ---------- H1: admissible seed bounds ----------
     Lower bounds on the section properties any member in this palette must have.
     Each bound is taken against the MOST favourable material in the palette and
     the MOST favourable factor stack (C_L = 1, C_M = 1, C_r if reachable), so a
     candidate that fails a bound cannot pass the real check for any material
     offered. Self-weight is deliberately left out: it only adds demand, so
     omitting it keeps the bound low, i.e. safe.

     Test "pruned candidates are genuinely infeasible" runs the full exhaustive
     search against the pruned one and asserts the feasible sets are identical. */

  function seedBounds(demand, policy) {
    var span = Number(demand.span), L_in = span * 12;
    var D = Number(demand.dead || 0), L = Number(demand.live || 0), Lr = Number(demand.roofLoad || 0);
    var combos = combosFor(D, L, Lr, demand.roofType);
    var use = FM.engine.DEFL[demand.memberUse] || FM.engine.DEFL.floor;

    var best = { Fb: 0, Fv: 0, E: 0, Fcp: 0 };
    policy.palette.forEach(function (p) {
      policy.ladder.forEach(function (size) {
        var sec = FM.engine.findSection(size);
        if (!sec) return;
        var mat = FM.engine.findValues(p.species, p.grade, sec.d_in, sec.b_in);
        if (!mat) return;
        var cf = FM.engine.sizeFactor(p.species, p.grade, size);
        var v = mat.values_psi;
        if (v.Fb * cf.CF > best.Fb) best.Fb = v.Fb * cf.CF;
        if (v.Fv > best.Fv) best.Fv = v.Fv;
        if (v.E > best.E) best.E = v.E;
        if (v.Fc_perp > best.Fcp) best.Fcp = v.Fc_perp;
      });
    });

    /* C_r is reachable only by a repetitive member ≤24" o.c. and ≤4" thick.
       Taken per spacing, because a 24" o.c. candidate can reach it and a 32"
       o.c. one cannot. */
    var target = policy.maxDCR;
    var spacings = demand.repetitive ? policy.spacings : [0];

    /* Bounds are computed PER SPACING and never maxed across them.
       Spacing is a candidate axis, not a property of the demand: a member at
       16" o.c. carries two-thirds of what the same member carries at 24", and
       judging it against the 24" requirement prunes valid — indeed optimal —
       candidates. That defect shipped once; the exhaustive-vs-pruned test in
       test/run-tests.js is what caught it and is what keeps it caught. */
    function boundsAt(sp) {
      var t = demand.repetitive ? sp / 12 : Number(demand.trib || 0);
      var Cr = (demand.repetitive && sp > 0 && sp <= 24) ? 1.15 : 1;
      var S_req = 0, A_req = 0, b_req = 0, I_req = 0;

      combos.forEach(function (c) {
        var w = c.psf * t;                                  /* plf */
        var M = 1.5 * w * span * span;                      /* in-lb, calc-spec §0.2 */
        var Fb_cap = best.Fb * c.cd * Cr;
        if (Fb_cap > 0) S_req = Math.max(S_req, M / (Fb_cap * target));

        var V = w * span / 2;
        var Fv_cap = best.Fv * c.cd;
        if (Fv_cap > 0) A_req = Math.max(A_req, 1.5 * V / (Fv_cap * target));

        /* bearing bounds the BREADTH, not the depth — C_D never touches F_c⊥ */
        var lb = Number(demand.bearing || 1.5);
        if (best.Fcp > 0 && lb > 0) b_req = Math.max(b_req, V / (best.Fcp * lb * target));
      });

      var wVar = (L + Lr) * t / 12;                         /* lb/in, mirrors engine.js */
      var wTot = (D + L + Lr) * t / 12;
      if (best.E > 0) {
        I_req = Math.max(
          5 * wVar * Math.pow(L_in, 4) / (384 * best.E * (L_in / use.live) * target),
          5 * wTot * Math.pow(L_in, 4) / (384 * best.E * (L_in / use.total) * target));
      }
      return { S_req: S_req, I_req: I_req, A_req: A_req, b_req: b_req, Cr: Cr, spacing: sp };
    }

    var bySpacing = {};
    spacings.forEach(function (sp) { bySpacing[String(sp)] = boundsAt(sp); });

    return {
      bySpacing: bySpacing,
      at: function (sp) { return bySpacing[String(sp || 0)] || bySpacing[String(spacings[0])]; },
      best: best, combos: combos, target: target,
      deflection: { row: demand.memberUse || "floor", live: use.live, total: use.total, cite: use.cite }
    };
  }

  function passesBounds(cand, bounds) {
    var s = FM.engine.findSection(cand.size);
    if (!s) return { ok: false, why: "no section properties" };
    var b = bounds.at(cand.spacing);
    if (!b) return { ok: true };
    if (s.Sx_in3 < b.S_req - EPS) return { ok: false, why: "S_x below the palette's best-case bending requirement" };
    if (s.Ix_in4 < b.I_req - EPS) return { ok: false, why: "I_x below the deflection requirement" };
    if (s.A_in2 < b.A_req - EPS) return { ok: false, why: "A below the shear requirement" };
    if (s.b_in < b.b_req - EPS) return { ok: false, why: "breadth below the bearing requirement" };
    return { ok: true };
  }

  /* ---------- enumeration ----------
     A family is one (species, grade, thickness, spacing). Within a family the
     only free axis is depth, and cost is checked to be nondecreasing in depth
     before any dominance pruning is applied to it (see H2 in solver-spec.md). */

  /* ---------- eligibility gates ----------
     Three things disqualify a candidate before any structural question is asked.
     They are gates, not costs, because none of them is a trade-off the weights
     get to make. Each returns the reason in the engineer's language. */

  function eligibility(cand, demand, policy) {
    /* geometry — a header has a depth budget set by the plate and head heights,
       and a member that does not fit is not a cheaper member, it is no member */
    if (demand.maxDepthIn && cand.d_in > Number(demand.maxDepthIn) + EPS) {
      return { ok: false, kind: "geometry",
               why: cand.size + " is " + cand.d_in.toFixed(2) + " in deep; only " +
                    Number(demand.maxDepthIn).toFixed(2) + " in is available above the head height" };
    }

    /* procurement — a member the yard cannot hand the framer gets substituted in
       the field, and the substitute is nobody's design */
    if (policy.minAvailability !== undefined && policy.priceOf) {
      var pr = policy.priceOf(cand, demand);
      if (pr && isFinite(pr.availability) && pr.availability < policy.minAvailability) {
        return { ok: false, kind: "procurement",
                 why: "availability " + pr.availability.toFixed(2) + " is below the firm floor of " +
                      Number(policy.minAvailability).toFixed(2) + " — special order, and the field will substitute" };
      }
    }

    /* treated refractory species — the engine applies C_M but NOT C_i.
       calc-spec §4.8 specifies the incising factor; engine.js does not implement
       it. For species that must be incised to take preservative, running the
       check without C_i overstates F_b and F_v by 20% (NDS Table 4.3.8). So the
       candidate is excluded rather than checked optimistically. Southern Pine
       takes treatment without incising, which is why it survives this gate. */
    if (demand.wet && policy.incisedWhenTreated && policy.incisedWhenTreated[cand.species]) {
      return { ok: false, kind: "scope",
               why: "treated " + cand.species + " is incised; C_i = 0.80 (NDS Table 4.3.8) is not " +
                    "implemented in this engine, so checking it here would overstate capacity by 20%" };
    }
    return { ok: true };
  }

  function families(demand, policy) {
    var spacings = demand.repetitive ? policy.spacings : [null];
    var out = [], excluded = [];
    policy.palette.forEach(function (p, pi) {
      spacings.forEach(function (sp) {
        var byThickness = {};
        policy.ladder.forEach(function (size) {
          var sec = FM.engine.findSection(size);
          if (!sec) return;
          var cand = {
            species: p.species, grade: p.grade, size: size,
            spacing: sp === null ? 0 : sp,
            b_in: sec.b_in, d_in: sec.d_in, paletteIndex: pi
          };
          var e = eligibility(cand, demand, policy);
          if (!e.ok) {
            if (sp === null || sp === spacings[0]) excluded.push({ cand: cand, kind: e.kind, why: e.why });
            return;
          }
          var key = String(sec.b_in);
          if (!byThickness[key]) byThickness[key] = [];
          byThickness[key].push(cand);
        });
        Object.keys(byThickness).forEach(function (k) {
          var rungs = byThickness[k].sort(function (a, b) { return a.d_in - b.d_in; });
          out.push({
            id: p.species + " " + p.grade + " · " + k + " in thick" + (sp ? " @ " + sp + " o.c." : ""),
            species: p.species, grade: p.grade, thickness: Number(k),
            spacing: sp === null ? 0 : sp, rungs: rungs
          });
        });
      });
    });
    out.excluded = excluded;
    return out;
  }

  /* ---------- H4: which axis to step when a check fails ----------
     Sensitivity of each limit state to depth, from the closed forms in
     calc-spec §3: deflection goes as d³, bending as d², shear as d¹, bearing
     not at all. Used to explain a failure and to propose the next move — never
     to skip an evaluation. */

  var REPAIR = {
    "Deflection (live)":  { axis: "depth",   exponent: 3, move: "go deeper (I ∝ d³) or tighten spacing" },
    "Deflection (total)": { axis: "depth",   exponent: 3, move: "go deeper (I ∝ d³) or tighten spacing" },
    "Bending":            { axis: "depth",   exponent: 2, move: "go deeper (S ∝ d²) or up a grade — F_b moves most between grades" },
    "Shear":              { axis: "area",    exponent: 1, move: "more area — thicker stock helps as much as deeper" },
    "Bearing (Fc⊥)":      { axis: "bearing", exponent: 0, move: "lengthen the bearing or widen the member — depth does nothing" }
  };

  var GATE_MOVE = {
    geometry:    "raise the plate height, drop the head height, or flush-frame the condition",
    procurement: "confirm the yard will stock it, or lower the availability floor deliberately",
    scope:       "use a species that takes treatment without incising, or check it by hand with C_i"
  };

  /* ---------- the search ---------- */

  function size(demand, policy) {
    if (!FM.engine) throw new Error("solver requires FM.engine");
    var t0 = 0;
    var cache = {}, stats = { evaluated: 0, cacheHits: 0, prunedByBound: 0, prunedByDominance: 0, prunedByIncumbent: 0, families: 0 };

    var bounds = seedBounds(demand, policy);
    var fams = families(demand, policy);
    stats.families = fams.length;

    function evaluate(cand) {
      var inputs = memberInputs(demand, cand, policy);
      var key = JSON.stringify(inputs);
      if (cache[key]) { stats.cacheHits++; return cache[key]; }
      stats.evaluated++;
      var r = FM.engine.run(inputs);
      cache[key] = { result: r, inputs: inputs };
      return cache[key];
    }

    /* cost is engine-free, so a family's whole cost vector is known before any
       check runs — which is what makes the dominance and incumbent pruning below
       exact rather than heuristic guesses */
    fams.forEach(function (fam) {
      fam.rungs.forEach(function (c) { c.cost = costOf(demand, c, policy); });
      fam.admissible = fam.rungs.filter(function (c) { return passesBounds(c, bounds).ok; });
      fam.monotone = true;
      for (var i = 1; i < fam.rungs.length; i++) {
        if (fam.rungs[i].cost && fam.rungs[i - 1].cost &&
            fam.rungs[i].cost.totalUSD < fam.rungs[i - 1].cost.totalUSD - EPS) { fam.monotone = false; break; }
      }
      fam.lowerBoundUSD = fam.admissible.reduce(function (m, c) {
        return c.cost && c.cost.totalUSD < m ? c.cost.totalUSD : m;
      }, Infinity);
      stats.prunedByBound += fam.rungs.length - fam.admissible.length;
    });

    /* H3: cheapest-possible-family first, so the incumbent gets good early and
       prunes hard */
    fams.sort(function (a, b) {
      if (a.lowerBoundUSD !== b.lowerBoundUSD) return a.lowerBoundUSD - b.lowerBoundUSD;
      return a.id < b.id ? -1 : 1;
    });

    var considered = [], rejected = [], incumbent = null;

    /* candidates that never reached the engine because a gate disqualified them.
       They belong in the record: "we did not check a 4x14" is a different
       statement from "a 4x14 failed", and an engineer needs to know which. */
    (fams.excluded || []).forEach(function (x) {
      rejected.push({ cand: x.cand, dcr: null, governing: null, gate: x.kind,
                      reason: x.why, next: GATE_MOVE[x.kind] || null });
    });

    fams.forEach(function (fam) {
      if (incumbent && fam.lowerBoundUSD >= incumbent.score - EPS) {
        stats.prunedByIncumbent += fam.admissible.length;
        return;
      }
      for (var i = 0; i < fam.admissible.length; i++) {
        var cand = fam.admissible[i];

        if (incumbent && cand.cost.totalUSD >= incumbent.score - EPS) {
          /* "rungs are depth-ordered, so cost only grows" is exactly the
             property fam.monotone verifies — and it is not free. A per-size
             price vector (short supply on one rung, clearance on another) makes
             cost non-monotone, and breaking here on that family skips cheaper
             rungs below. Skip this candidate, but keep walking the family. */
          if (fam.monotone) {
            stats.prunedByIncumbent += fam.admissible.length - i;
            break;
          }
          stats.prunedByIncumbent++;
          continue;
        }

        var ev = evaluate(cand);
        var r = ev.result;

        if (r.error) {
          rejected.push({ cand: cand, reason: r.message, dcr: null, governing: null });
          continue;
        }
        var dcr = r.governing.dcr;
        var ok = isFinite(dcr) && dcr <= policy.maxDCR + EPS;
        var row = {
          cand: cand, dcr: dcr, governing: r.governing.name, combo: r.governing.combo,
          kind: r.governing.kind, cost: cand.cost, feasible: ok,
          warnings: r.warnings || [], inputs: ev.inputs,
          checks: r.checks.map(function (c) { return { name: c.name, dcr: c.dcr }; })
        };
        considered.push(row);

        if (!ok) {
          var rep = REPAIR[r.governing.name] || { move: "no repair rule for this limit state" };
          rejected.push({
            cand: cand, dcr: dcr, governing: r.governing.name,
            reason: (r.governing.kind === "service" ? "exceeds the deflection limit" : "overstressed") +
                    " at DCR " + dcr.toFixed(3) + " (target " + policy.maxDCR.toFixed(2) + ")",
            next: rep.move
          });
          continue;
        }

        row.score = cand.cost.totalUSD + slackPenalty(dcr, policy);
        /* tieBreak decides ties, not losses — reaching it on a strictly worse
           score would let a more expensive candidate take the incumbency */
        if (!incumbent || row.score < incumbent.score - EPS ||
            (Math.abs(row.score - incumbent.score) <= EPS && tieBreak(row, incumbent) < 0)) {
          incumbent = row;
        }

        /* H2 dominance: within a family, deeper rungs cost at least as much as
           this one, so none of them can win. Only applied where the family's
           cost vector was actually verified nondecreasing. */
        if (fam.monotone) {
          stats.prunedByDominance += fam.admissible.length - i - 1;
          break;
        }
      }
    });

    /* ---- explain pass ----
       The search above is an optimiser: it proves which candidate wins while
       evaluating as few as it can. That is the right behaviour for a solver and
       the wrong behaviour for a sheet an engineer has to sign, because it can
       return a single row with nothing to compare it against.

       So after the winner is settled, fill in the rest of the admissible ladder
       for display. These evaluations are counted separately — they are context,
       not search — and they are walked in a fixed order that does not depend on
       the weights, so the ladder an engineer sees is the same ladder regardless
       of what the prices are set to. */
    var budget = policy.explainBudget === undefined ? 40 : policy.explainBudget;
    var seen = {};
    considered.forEach(function (c) { seen[keyOf(c.cand)] = true; });

    var ordered = fams.slice().sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
    var context = [], exhausted = true;
    for (var fi = 0; fi < ordered.length; fi++) {
      var frows = ordered[fi].admissible;
      for (var ci = 0; ci < frows.length; ci++) {
        var cc = frows[ci];
        if (seen[keyOf(cc)]) continue;
        if (context.length >= budget) { exhausted = false; fi = ordered.length; break; }
        seen[keyOf(cc)] = true;
        var cev = evaluate(cc);
        stats.contextEvaluated++;
        if (cev.result.error) {
          rejected.push({ cand: cc, reason: cev.result.message, dcr: null, governing: null, context: true });
          continue;
        }
        var cdcr = cev.result.governing.dcr;
        var cok = isFinite(cdcr) && cdcr <= policy.maxDCR + EPS;
        var crow = {
          cand: cc, dcr: cdcr, governing: cev.result.governing.name, combo: cev.result.governing.combo,
          kind: cev.result.governing.kind, cost: cc.cost, feasible: cok, context: true,
          warnings: cev.result.warnings || [], inputs: cev.inputs,
          checks: cev.result.checks.map(function (c) { return { name: c.name, dcr: c.dcr }; })
        };
        if (cok) crow.score = cc.cost.totalUSD + slackPenalty(cdcr, policy);
        else {
          var crep = REPAIR[cev.result.governing.name] || { move: "no repair rule for this limit state" };
          rejected.push({
            cand: cc, dcr: cdcr, governing: cev.result.governing.name,
            reason: (crow.kind === "service" ? "exceeds the deflection limit" : "overstressed") +
                    " at DCR " + cdcr.toFixed(3) + " (target " + policy.maxDCR.toFixed(2) + ")",
            next: crep.move, context: true
          });
        }
        context.push(crow);
      }
    }
    stats.ladderComplete = exhausted;

    var feasible = considered.concat(context).filter(function (c) { return c.feasible; })
      .sort(function (a, b) { return a.score - b.score || tieBreak(a, b); });

    /* self-check: the search claimed optimality, the context pass evaluated more.
       If anything the context pass found scores below the pick, the search was
       wrong — surface it rather than quietly serve the better one. */
    stats.searchOptimal = !incumbent || !feasible.length ||
      feasible[0].score >= incumbent.score - 1e-9;

    var pick = incumbent || null;

    /* End reactions are the currency of coordination. The truss supplier, the
       EWP supplier and the foundation engineer all need the number in pounds at
       each bearing — not the member size — and the engine already computes it.
       Publishing it is nearly free and is the most useful thing this output can
       hand a production builder. */
    var reactions = pick ? endReactions(demand, pick, policy) : null;

    /* Escalation is a status, not a footnote. A plan with an escalation is not
       a finished schedule and must not read like one. */
    var status = "ok";
    if (!pick) {
      status = rejected.some(function (r) { return r.gate === "geometry"; }) && !considered.length
        ? "escalate:geometry"
        : (rejected.some(function (r) { return r.gate === "procurement"; }) && !considered.length
            ? "escalate:procurement"
            : "escalate:scope");
    }

    return {
      demand: demand,
      status: status,
      reactions: reactions,
      policy: { id: policy.id, name: policy.name, maxDCR: policy.maxDCR,
                ladder: policy.ladder, spacings: policy.spacings,
                palette: policy.palette.map(function (p) { return p.species + " " + p.grade; }) },
      pick: pick,
      feasible: feasible,
      rejected: rejected,
      bounds: bounds,
      stats: stats,
      searchSpace: fams.reduce(function (n, f) { return n + f.rungs.length; }, 0),
      note: feasible.length ? null : noFeasibleNote(demand, policy, rejected),
      elapsed: t0
    };
  }

  /* R = w·L/2 per bearing, at the governing combination — calc-spec §3.2.
     Reported unreduced: the §3.4.3.1 d-reduction is a shear allowance and must
     never be applied to a bearing reaction. */
  function endReactions(demand, row, policy) {
    var D = Number(row.inputs.dead || 0), L = Number(row.inputs.live || 0),
        Lr = Number(row.inputs.roofLoad || 0);
    var combos = combosFor(D, L, Lr, row.inputs.roofType);
    var t = row.inputs.spacing / 12;
    var worst = null;
    combos.forEach(function (c) {
      var R = (c.psf * t) * demand.span / 2;
      if (!worst || R > worst.lb) worst = { lb: R, combo: c.label, psf: c.psf };
    });
    return {
      perBearingLb: worst ? worst.lb : null,
      combo: worst ? worst.combo : null,
      note: "Unreduced support reaction at each bearing, governing gravity combination. " +
            "Hand this to the truss, EWP or connector designer — the connection is not designed here."
    };
  }

  /* deterministic all the way down — same inputs, same schedule, every run */
  function tieBreak(a, b) {
    if (a.cand.d_in !== b.cand.d_in) return a.cand.d_in - b.cand.d_in;
    if (a.cand.b_in !== b.cand.b_in) return a.cand.b_in - b.cand.b_in;
    if (a.cand.paletteIndex !== b.cand.paletteIndex) return a.cand.paletteIndex - b.cand.paletteIndex;
    if (a.cand.spacing !== b.cand.spacing) return b.cand.spacing - a.cand.spacing;
    return a.cand.size < b.cand.size ? -1 : (a.cand.size > b.cand.size ? 1 : 0);
  }

  /* When nothing fits, say which wall the search hit and what would move it.
     A solver that only reports "no solution" is telling the engineer nothing. */
  function noFeasibleNote(demand, policy, rejected) {
    var byCheck = {};
    rejected.forEach(function (r) {
      if (!r.governing) return;
      byCheck[r.governing] = (byCheck[r.governing] || 0) + 1;
    });
    var worst = Object.keys(byCheck).sort(function (a, b) { return byCheck[b] - byCheck[a]; })[0];
    var rep = REPAIR[worst] || null;
    return {
      wall: worst || "no candidate could even be evaluated",
      counts: byCheck,
      move: rep ? rep.move : "widen the palette or the size ladder",
      outOfScope: "Multi-ply built-up members, engineered lumber (LVL/PSL/LSL) and I-joists are " +
                  "outside this engine (calc-spec §8.6, §8.19). A span this size in a tract plan is " +
                  "normally an engineered header — that selection cannot be made here."
    };
  }

  /* ---------- plan-level solve ---------- */

  function solvePlan(plan, pack, opts) {
    opts = opts || {};
    var policy = FM.weights.policyFor(pack, plan);
    var marks = plan.marks.map(function (mk) {
      /* A mark can be structurally irrelevant in a region — a wood exterior
         header in a concrete-block market, or a truss. Reporting it as
         "no solution" would be wrong twice over: it is not a failure, and it is
         not this engine's member. Say what it actually is. */
      var appl = FM.weights.applicability ? FM.weights.applicability(mk, pack) : { applicable: true };
      if (!appl.applicable) {
        return { mark: mk, demand: null, solution: null, policy: null,
                 notApplicable: { reason: appl.reason, note: appl.note } };
      }
      var demand = FM.weights.demandFor(mk, plan, pack);
      var rolePolicy = FM.weights.policyFor(pack, plan, mk.role);
      var sol = size(demand, rolePolicy);
      return { mark: mk, demand: demand, solution: sol, policy: rolePolicy };
    });
    var out = { plan: plan, pack: pack, marks: marks, policy: policy };
    out.unified = opts.unify === false ? null : unify(out);
    out.rollup = rollup(out);
    return out;
  }

  /* ---------- H7: SKU unification ----------
     A tract plan is built dozens of times. Two marks that land one rung apart
     cost the builder a second SKU on every lot — pallet space, a second pick,
     a second chance to install the wrong one. Collapse a mark up to a sibling's
     size when the extra lumber costs less than the weights say a distinct SKU
     costs. Only ever collapses UPWARD to a member that already passed its own
     check, so nothing here can weaken a member. */

  function unify(planResult) {
    var w = planResult.policy.weights;
    var bonus = planResult.policy.unifyBonus || {};
    var groups = {};
    planResult.marks.forEach(function (m) {
      if (!m.solution || !m.solution.pick) return;
      var g = m.mark.skuGroup || m.mark.role;
      if (!Object.prototype.hasOwnProperty.call(groups, g)) groups[g] = [];
      groups[g].push(m);
    });

    var moves = [];
    Object.keys(groups).forEach(function (g) {
      var members = groups[g];
      if (members.length < 2) return;

      var distinct = {};
      members.forEach(function (m) { distinct[skuOf(m.solution.pick.cand)] = 1; });
      var skusBefore = Object.keys(distinct).length;
      if (skusBefore < 2) return;

      /* Every distinct size in the group is a candidate target, not just the
         deepest. A group of {2x8 ×10, 2x10 ×40, 2x12 ×1} should raise the 2x8s
         to 2x10 and leave the single 2x12 alone — collapsing all 51 pieces onto
         2x12 to kill two SKUs is the expensive answer, and only considering the
         deepest member was the reason it used to be the only answer. */
      var candidates = [];
      members.forEach(function (m) {
        var t = m.solution.pick.cand;
        if (!candidates.some(function (c) { return skuOf(c) === skuOf(t); })) candidates.push(t);
      });

      var best = null;
      candidates.forEach(function (target) {
        var delta = 0, raised = [], ok = true, skusAfter = {};
        members.forEach(function (m) {
          if (!ok) return;
          var pick = m.solution.pick;
          if (skuOf(pick.cand) === skuOf(target)) { skusAfter[skuOf(target)] = 1; return; }
          /* never collapse DOWN, and never onto a member this mark did not
             itself check and pass */
          if (target.d_in < pick.cand.d_in) { skusAfter[skuOf(pick.cand)] = 1; return; }
          var alt = m.solution.feasible.filter(function (f) {
            return f.cand.size === target.size && f.cand.species === target.species &&
                   f.cand.grade === target.grade && f.cand.spacing === pick.cand.spacing;
          })[0];
          if (!alt) { ok = false; return; }
          /* compare on SCORE, the same objective the search optimised. Raising a
             member always increases its slack, and cost alone cannot see that. */
          delta += (alt.score - pick.score) * (m.mark.count || 1);
          raised.push({ mark: m.mark.id, from: skuOf(pick.cand), to: skuOf(target), row: m, alt: alt });
          skusAfter[skuOf(target)] = 1;
        });
        if (!ok || !raised.length) return;
        var nAfter = Object.keys(skusAfter).length;
        /* the per-SKU handling charge, plus the system bonus that only exists
           when the group actually collapses to a single size */
        var saved = (skusBefore - nAfter) * w.skuPenalty +
                    (nAfter === 1 ? (bonus[g] || 0) : 0);
        if (saved <= 0) return;
        var net = delta - saved;
        if (!best || net < best.net) {
          best = { net: net, delta: delta, saved: saved, target: target, raised: raised,
                   skusAfter: nAfter };
        }
      });

      if (!best) return;
      moves.push({
        group: g, skusBefore: skusBefore, skusAfter: best.skusAfter, target: skuOf(best.target),
        extraLumberUSD: best.delta, skuSavingUSD: best.saved, accepted: best.net <= 0,
        raised: best.raised.map(function (r) { return { mark: r.mark, from: r.from, to: r.to }; })
      });
      if (best.net <= 0) {
        best.raised.forEach(function (r) { r.row.unifiedTo = r.alt; });
      }
    });
    return moves;
  }

  function skuOf(cand) {
    return cand.size + " " + cand.species + " " + cand.grade;
  }
  function keyOf(cand) {
    return skuOf(cand) + "@" + (cand.spacing || 0);
  }

  function rollup(planResult) {
    var skus = {}, solved = 0, escalated = 0, notApplicable = 0, flagged = 0, totalUSD = 0;
    planResult.marks.forEach(function (m) {
      if (m.notApplicable) { notApplicable++; return; }
      var row = m.unifiedTo || (m.solution && m.solution.pick);
      if (!row) { escalated++; return; }
      solved++;
      var n = m.mark.count || 1;
      totalUSD += row.cost.totalUSD * n;
      var k = skuOf(row.cand);
      if (!Object.prototype.hasOwnProperty.call(skus, k)) skus[k] = 0;
      skus[k] += n;
      if (row.cost.cfBasis === "held") flagged++;
    });
    return {
      solved: solved, escalated: escalated, unsolved: escalated, notApplicable: notApplicable,
      flaggedCF: flagged, complete: escalated === 0,
      skuCount: Object.keys(skus).length, skus: skus, lumberUSD: totalUSD
    };
  }

  /* ---------- the repeat matrix ----------
     One plan, several region packs. This is the whole point of a tract plan:
     what actually has to change when the same house is built in another state. */

  function compare(plan, packs) {
    var runs = packs.map(function (p) { return { pack: p, result: solvePlan(plan, p) }; });
    var rows = plan.marks.map(function (mk) {
      var cells = runs.map(function (r) {
        var m = r.result.marks.filter(function (x) { return x.mark.id === mk.id; })[0];
        if (m && m.notApplicable) {
          return { pack: r.pack.id, sku: null, spacing: null, dcr: null, governing: null,
                   notApplicable: true, note: m.notApplicable.reason };
        }
        var row = m && (m.unifiedTo || (m.solution && m.solution.pick));
        return {
          pack: r.pack.id,
          sku: row ? skuOf(row.cand) : null,
          spacing: row ? row.cand.spacing : null,
          dcr: row ? row.dcr : null,
          governing: row ? row.governing : null,
          note: row ? null : (m && m.solution && m.solution.note ? m.solution.note.wall : "no solution")
        };
      });
      var distinct = {};
      cells.forEach(function (c) { if (c.sku) distinct[c.sku + "@" + c.spacing] = 1; });
      return { mark: mk, cells: cells, varies: Object.keys(distinct).length > 1,
               everSolved: Object.keys(distinct).length > 0 };
    });
    return {
      plan: plan, runs: runs, rows: rows,
      commonMarks: rows.filter(function (r) { return !r.varies; }).length,
      varyingMarks: rows.filter(function (r) { return r.varies; }).length
    };
  }

  FM.solver = {
    size: size, solvePlan: solvePlan, compare: compare,
    seedBounds: seedBounds, families: families, combosFor: combosFor,
    memberInputs: memberInputs, costOf: costOf, skuOf: skuOf, slackPenalty: slackPenalty,
    eligibility: eligibility,
    stockLength: stockLength, boardFeetPerLF: boardFeetPerLF,
    REPAIR: REPAIR, GAMMA_PCF: GAMMA_PCF
  };
})();

</script>
<script>
/* ============================================================
   Materials browser — reads the embedded MATDATA payload, which
   was extracted verbatim from the public material-databases repo.
   Every value shown here carries the seed file it came from.
   ============================================================ */

(function () {
  "use strict";

  var el = FM.el, card = FM.card, fmt = FM.fmt, comma = FM.comma;

  var TABS = [
    { id: "sections",   label: "Section properties", cite: "sections" },
    { id: "sawn",       label: "Sawn design values", cite: "species_grades" },
    { id: "southern",   label: "Southern Pine",      cite: "southern_pine" },
    { id: "glulam",     label: "Glulam",             cite: "glulam" },
    { id: "steel",      label: "Steel shapes",       cite: "steel_shapes" }
  ];

  function meta(key) {
    return (window.MATDATA && MATDATA.meta && MATDATA.meta[key]) || {};
  }

  function citation(key) {
    var m = meta(key);
    if (!m.source_file) return null;
    return el("p", { class: "src-note", style: "margin-top:10px" }, [
      el("span", { text: "Source: " }),
      el("strong", { text: m.source_file }),
      el("span", { text: m.dataset_version ? "  ·  dataset revision " + m.dataset_version : "" }),
      el("br"),
      el("span", { text: m.governing_reference || m.title || "" })
    ]);
  }

  function tableFrom(cols, rows, rowFn) {
    var tb = el("tbody");
    rows.forEach(function (r) { tb.appendChild(rowFn(r)); });
    return el("div", { class: "tw", tabindex: "0", role: "region", "aria-label": "Material data table" }, [
      el("table", {}, [
        el("thead", {}, [el("tr", {}, cols.map(function (c) {
          return el("th", { class: c.n ? "n" : null, text: c.label });
        }))]),
        tb
      ])
    ]);
  }

  FM.VIEWS.materials = function (host) {
    if (!window.MATDATA) {
      host.appendChild(FM.pageHead("Materials", "Catalog data"));
      host.appendChild(el("div", { class: "empty", text: "Material catalog failed to load." }));
      return;
    }

    host.appendChild(FM.pageHead("Materials", "Sourced reference values — the number on the sheet is the number in the book.", [
      el("button", {
        class: "btn btn-sm",
        onclick: function () { FM.toast("Catalogs are published for review at github.com/Firmark/material-databases"); },
        text: "About this data"
      })
    ]));

    /* headline counts, computed from the payload itself */
    var counts = [
      { v: comma(MATDATA.sections.length), l: "S4S sections" },
      { v: comma(MATDATA.species_grades.length), l: "Sawn design values" },
      { v: comma(MATDATA.southern_pine.records.length), l: "Southern Pine rows" },
      { v: comma(MATDATA.glulam.length), l: "Glulam classes" },
      { v: comma(MATDATA.steel_shapes.length), l: "W-shapes" }
    ];
    host.appendChild(el("div", { class: "grid g5", style: "margin-bottom:16px" },
      counts.map(function (c) { return FM.statCard(c.v, c.l); })));

    var state = { tab: "sections", q: "" };

    var tabs = el("div", { class: "seg", role: "tablist", "aria-label": "Material catalog", style: "margin-bottom:12px" });

    function selectTab(id, focus) {
      state.tab = id;
      Array.prototype.forEach.call(tabs.querySelectorAll("button"), function (b, i) {
        var on = TABS[i].id === id;
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.tabIndex = on ? 0 : -1;
        if (on && focus) b.focus();
      });
      draw();
    }

    TABS.forEach(function (t, i) {
      tabs.appendChild(el("button", {
        role: "tab", id: "mtab-" + t.id, "aria-controls": "mpanel",
        "aria-selected": t.id === state.tab ? "true" : "false",
        tabindex: t.id === state.tab ? "0" : "-1",
        text: t.label,
        onclick: function () { selectTab(t.id, false); },
        onkeydown: function (e) {
          var n = null;
          if (e.key === "ArrowRight") n = TABS[(i + 1) % TABS.length];
          else if (e.key === "ArrowLeft") n = TABS[(i - 1 + TABS.length) % TABS.length];
          else if (e.key === "Home") n = TABS[0];
          else if (e.key === "End") n = TABS[TABS.length - 1];
          if (n) { e.preventDefault(); selectTab(n.id, true); }
        }
      }));
    });

    var search = el("input", {
      type: "text", placeholder: "Filter…", "aria-label": "Filter material rows",
      style: "max-width:240px"
    });
    search.addEventListener("input", function () { state.q = this.value; draw(); });

    host.appendChild(el("div", { class: "filter-bar", style: "margin-bottom:12px" }, [tabs, search]));

    var body = el("div", { id: "mpanel", role: "tabpanel", tabindex: "0" });
    host.appendChild(body);

    function match(hay) {
      var q = state.q.trim().toLowerCase();
      return !q || hay.toLowerCase().indexOf(q) !== -1;
    }

    function draw() {
      body.innerHTML = "";
      var node, key;

      if (state.tab === "sections") {
        key = "sections";
        var rows = MATDATA.sections.filter(function (r) { return match(r.nominal + " " + r.size_class); });
        node = tableFrom(
          [{ label: "Nominal" }, { label: "Class" }, { label: "b (in)", n: 1 }, { label: "d (in)", n: 1 },
           { label: "A (in²)", n: 1 }, { label: "Sx (in³)", n: 1 }, { label: "Ix (in⁴)", n: 1 }],
          rows,
          function (r) {
            return el("tr", {}, [
              el("td", { class: "k", text: r.nominal }),
              el("td", { text: r.size_class }),
              el("td", { class: "n", text: fmt(r.b_in, 3) }),
              el("td", { class: "n", text: fmt(r.d_in, 3) }),
              el("td", { class: "n", text: fmt(r.A_in2, 3) }),
              el("td", { class: "n", text: fmt(r.Sx_in3, 3) }),
              el("td", { class: "n", text: fmt(r.Ix_in4, 2) })
            ]);
          }
        );
      } else if (state.tab === "sawn" || state.tab === "southern") {
        key = state.tab === "sawn" ? "species_grades" : "southern_pine";
        var src = state.tab === "sawn" ? MATDATA.species_grades : MATDATA.southern_pine.records;
        var recs = src.filter(function (r) { return match(r.species + " " + r.grade + " " + r.size_class); });
        node = tableFrom(
          [{ label: "Species" }, { label: "Grade" }, { label: "Size class" },
           { label: "Fb", n: 1 }, { label: "Ft", n: 1 }, { label: "Fv", n: 1 },
           { label: "Fc⊥", n: 1 }, { label: "Fc", n: 1 }, { label: "E", n: 1 }, { label: "Emin", n: 1 }],
          recs,
          function (r) {
            var v = r.values_psi || {};
            return el("tr", {}, [
              el("td", { class: "k" }, [
                el("span", { text: r.species }),
                r.common ? el("span", { class: "badge b-gold", style: "margin-left:6px", text: "Common" }) : null
              ]),
              el("td", { text: r.grade }),
              el("td", { text: r.size_class }),
              el("td", { class: "n", text: v.Fb == null ? "—" : comma(v.Fb) }),
              el("td", { class: "n", text: v.Ft == null ? "—" : comma(v.Ft) }),
              el("td", { class: "n", text: v.Fv == null ? "—" : comma(v.Fv) }),
              el("td", { class: "n", text: v.Fc_perp == null ? "—" : comma(v.Fc_perp) }),
              el("td", { class: "n", text: v.Fc == null ? "—" : comma(v.Fc) }),
              el("td", { class: "n", text: v.E == null ? "—" : comma(v.E) }),
              el("td", { class: "n", text: v.Emin == null ? "—" : comma(v.Emin) })
            ]);
          }
        );
      } else if (state.tab === "glulam") {
        key = "glulam";
        var gl = MATDATA.glulam.filter(function (r) { return match(r.stress_class); });
        node = tableFrom(
          [{ label: "Stress class" }, { label: "Fbx+", n: 1 }, { label: "Fbx−", n: 1 }, { label: "Fvx", n: 1 },
           { label: "Fc⊥x", n: 1 }, { label: "Ex (app)", n: 1 }, { label: "Ex min", n: 1 }, { label: "Ft", n: 1 }, { label: "Fc", n: 1 }],
          gl,
          function (r) {
            return el("tr", {}, [
              el("td", { class: "k", text: r.stress_class }),
              el("td", { class: "n", text: r.Fbx_pos == null ? "—" : comma(r.Fbx_pos) }),
              el("td", { class: "n", text: r.Fbx_neg == null ? "—" : comma(r.Fbx_neg) }),
              el("td", { class: "n", text: r.Fvx == null ? "—" : comma(r.Fvx) }),
              el("td", { class: "n", text: r.Fc_perp_x == null ? "—" : comma(r.Fc_perp_x) }),
              el("td", { class: "n", text: r.Ex_app == null ? "—" : comma(r.Ex_app) }),
              el("td", { class: "n", text: r.Ex_min == null ? "—" : comma(r.Ex_min) }),
              el("td", { class: "n", text: r.Ft == null ? "—" : comma(r.Ft) }),
              el("td", { class: "n", text: r.Fc == null ? "—" : comma(r.Fc) })
            ]);
          }
        );
      } else {
        key = "steel_shapes";
        var st = MATDATA.steel_shapes.filter(function (r) { return match(r.designation + " " + r.family); });
        node = tableFrom(
          [{ label: "Shape" }, { label: "W (lb/ft)", n: 1 }, { label: "A (in²)", n: 1 }, { label: "d (in)", n: 1 },
           { label: "Ix (in⁴)", n: 1 }, { label: "Sx (in³)", n: 1 }, { label: "Zx (in³)", n: 1 }, { label: "ry (in)", n: 1 }],
          st,
          function (r) {
            return el("tr", {}, [
              el("td", { class: "k", text: r.designation }),
              el("td", { class: "n", text: fmt(r.W_lbft, 1) }),
              el("td", { class: "n", text: fmt(r.A_in2, 2) }),
              el("td", { class: "n", text: fmt(r.d_in, 2) }),
              el("td", { class: "n", text: comma(r.Ix_in4) }),
              el("td", { class: "n", text: fmt(r.Sx_in3, 1) }),
              el("td", { class: "n", text: fmt(r.Zx_in3, 1) }),
              el("td", { class: "n", text: fmt(r.ry_in, 2) })
            ]);
          }
        );
      }

      body.setAttribute("aria-labelledby", "mtab-" + state.tab);
      body.appendChild(node);
      var c = citation(key);
      if (c) body.appendChild(c);
    }

    draw();

    /* the honest note about what the catalog does NOT carry */
    host.appendChild(el("div", { style: "margin-top:18px" }, [
      card("Not in the catalog", el("span", { class: "badge b-warn", text: "Gap", style: "margin-left:auto" }),
        el("div", { style: "display:grid;gap:8px;font-size:.85rem" }, [
          el("p", { text: "The NDS size-factor (C_F) table is not published in the material catalog. The engine therefore treats C_F as a typed input, marked as unsourced on every sheet that uses it, rather than substituting a remembered value." }),
          el("p", { class: "src-note", text: "Checked: Table 4A seed metadata, member_db migrations, and the phase-1 member database. The only C_F numbers in the repo are per-record wet-service threshold helpers, flagged by the seed itself as not a citable adjustment table." })
        ]),
        "Values are never invented, interpolated, or decoded from model names")
    ]));
  };
})();

</script>
<script>
/* ============================================================
   The calculation sheet. Header strip → inputs → live results.
   Recomputes on every input change; nothing is cached.
   ============================================================ */

(function () {
  "use strict";

  var el = FM.el, fmt = FM.fmt, card = FM.card, dl = FM.dl;

  function pct(d) { return Math.round(d * 100) + "%"; }

  /* short labels for the header chips — the full names carry glyphs
     (Fc⊥) that mangle under text-transform: uppercase */
  var SHORT = {
    "Bending": "Bending",
    "Shear": "Shear",
    "Deflection (live)": "Defl · L",
    "Deflection (total)": "Defl · TL",
    "Bearing (Fc⊥)": "Bearing"
  };
  function utilClass(d) { return d > 1 ? "is-fail" : (d > 0.9 ? "is-warn" : "is-pass"); }

  FM.VIEWS.sheet = function (host) {
    var sheet = FM.SHEETS.filter(function (s) { return s.id === FM.state.sheetId; })[0] || FM.SHEETS[0];
    var proj = FM.PROJECTS.filter(function (p) { return p.id === sheet.project; })[0];
    var prof = FM.getProfile(proj ? proj.profile : "firm-standard");

    /* working copy of the inputs so edits don't mutate the stored sheet until changed */
    var inp = {};
    Object.keys(sheet.inputs).forEach(function (k) { inp[k] = sheet.inputs[k]; });
    inp.deflLive = prof.deflLive;
    inp.deflTotal = prof.deflTotal;
    if (inp.CF === undefined) inp.CF = 1.0;

    document.title = "Firmark · " + sheet.id + " — " + sheet.label;

    var wrap = el("div", { class: "sheet" });
    var headHost = el("div", { class: "sheet-headhost" });
    var inputPane = el("div", { class: "input-pane" });
    var resultPane = el("div", { class: "result-pane" });

    host.appendChild(headHost);
    wrap.appendChild(inputPane);
    wrap.appendChild(resultPane);
    host.appendChild(wrap);

    /* ---------- header strip ---------- */

    function drawHead(r) {
      headHost.innerHTML = "";
      var strip = el("div", { class: "sheet-head" });
      var failed = !r.error && isFinite(r.governing.dcr) && r.governing.dcr > 1;

      var top = el("div", { class: "sheet-head-top" }, [
        el("h1", { class: "sheet-mark", text: sheet.id }),
        el("span", { class: "badge b-mute", text: sheet.role }),
        el("span", { style: "font-size:.83rem;color:var(--muted)", text: sheet.label })
      ]);

      var tools = el("div", { class: "sheet-tools" }, [
        el("div", { class: "seg", role: "group", "aria-label": "View density" }, [
          el("button", {
            "aria-pressed": FM.state.density === "quick" ? "true" : "false", text: "Quick",
            "data-refocus": "quick",
            onclick: function () { FM.state.density = "quick"; apply("quick"); }
          }),
          el("button", {
            "aria-pressed": FM.state.density === "detailed" ? "true" : "false", text: "Detailed",
            "data-refocus": "detailed",
            onclick: function () { FM.state.density = "detailed"; apply("detailed"); }
          })
        ]),
        el("button", {
          class: "btn btn-sm", "aria-pressed": FM.state.locked ? "true" : "false",
          text: FM.state.locked ? "Unlock" : "Lock", "data-refocus": "lock",
          onclick: function () { FM.state.locked = !FM.state.locked; apply("lock"); }
        })
      ]);
      top.appendChild(tools);
      strip.appendChild(top);

      if (r.error) {
        strip.appendChild(el("div", { class: "banner banner-warn", style: "margin:0" }, [
          el("strong", { text: "Not evaluated — " }), el("span", { text: r.message })
        ]));
        headHost.appendChild(strip);
        return;
      }

      /* per-check utilization chips, straight from the engine result */
      var chips = el("div", { class: "sheet-utils" });
      r.checks.forEach(function (c) {
        var isGov = c.name === r.governing.name;
        if (!isFinite(c.dcr)) return;
        chips.appendChild(el("span", {
          class: "util " + utilClass(c.dcr) + (isGov ? " is-gov" : ""),
          title: c.name + " · DCR " + fmt(c.dcr, 3) + " · " + c.combo
        }, [
          el("span", { class: "util-k", text: SHORT[c.name] || c.name }),
          el("span", { class: "util-v", text: pct(c.dcr) })
        ]));
      });

      var verb = !failed ? "Governing · "
        : (r.governing.kind === "service" ? "Exceeds deflection limit · " : "Overstressed · ");
      var pill = el("span", { class: "gov-pill" + (failed ? " is-fail" : "") }, [
        el("span", { text: verb }),
        el("span", { text: r.governing.name }),
        el("span", { text: " " + fmt(r.governing.dcr, 2) }),
        el("span", { class: "sr-only", text: failed ? " — exceeds the limit" : " — within the limit" })
      ]);

      var row = el("div", { style: "display:flex;flex-wrap:wrap;gap:8px;align-items:center" }, [chips, el("span", { style: "margin-left:auto" }, [pill])]);
      strip.appendChild(row);

      strip.appendChild(el("div", { class: "lock-note" }, [
        el("span", { text: "Locked for presentation — inputs are read-only. Lock is a view state, not an approval." })
      ]));

      headHost.appendChild(strip);
    }

    /* ---------- inputs ---------- */

    function field(label, node, hint) {
      var f = el("div", { class: "field" }, [el("label", { text: label }), node]);
      if (hint) f.appendChild(el("span", { class: "field-hint", text: hint }));
      return f;
    }

    function numInput(key, step, min) {
      var n = el("input", { type: "number", value: String(inp[key]), step: step || "0.5", min: min === undefined ? "0" : min });
      n.addEventListener("input", function () {
        var val = parseFloat(this.value);
        inp[key] = isNaN(val) ? 0 : val;
        recompute();
      });
      return n;
    }

    var substituted = null;

    function drawInputs() {
      inputPane.innerHTML = "";

      /* member */
      var speciesSel = el("select", {}, FM.engine.speciesList().map(function (s) {
        return el("option", { value: s.species, text: s.species, selected: s.species === inp.species ? "selected" : null });
      }));
      var gradeSel = el("select");
      function fillGrades() {
        gradeSel.innerHTML = "";
        var entry = FM.engine.speciesList().filter(function (s) { return s.species === inp.species; })[0];
        var glist = (entry ? entry.grades.slice() : []);
        glist.sort(function (a, b) { return FM.gradeRank(a) - FM.gradeRank(b); });
        glist.forEach(function (g) {
          gradeSel.appendChild(el("option", { value: g, text: g, selected: g === inp.grade ? "selected" : null }));
        });
      }
      fillGrades();
      speciesSel.addEventListener("change", function () {
        inp.species = this.value;
        var entry = FM.engine.speciesList().filter(function (s) { return s.species === inp.species; })[0];
        substituted = null;
        if (entry && entry.grades.indexOf(inp.grade) === -1) {
          /* Substitute the STRONGEST grade the new species offers, not the first
             one alphabetically. Table 4B's grades sort with "Construction" first,
             which is tabulated at 4" wide only — so the alphabetical pick errored
             out every sheet that wasn't a 2x4. */
          var best = entry.grades.slice().sort(function (a, b) {
            return FM.gradeRank(a) - FM.gradeRank(b);
          })[0];
          substituted = { from: inp.grade, to: best };
          inp.grade = best;
        }
        fillGrades();
        recompute();
      });
      gradeSel.addEventListener("change", function () { inp.grade = this.value; substituted = null; recompute(); });

      var sizeSel = el("select", {}, FM.engine.sizeList().map(function (s) {
        return el("option", { value: s, text: s, selected: s === inp.size ? "selected" : null });
      }));
      sizeSel.addEventListener("change", function () { inp.size = this.value; recompute(); });

      inputPane.appendChild(card("Member", null, el("div", { style: "display:grid;gap:10px" }, [
        field("Species", speciesSel),
        field("Grade", gradeSel),
        field("Size (S4S)", sizeSel)
      ]), null));

      /* geometry */
      inputPane.appendChild(card("Geometry", null, el("div", { style: "display:grid;gap:10px" }, [
        el("div", { class: "field-row" }, [
          field("Span (ft)", numInput("span", "0.5")),
          field("Spacing (in o.c.)", numInput("spacing", "1"))
        ]),
        field("Bearing length (in)", numInput("bearing", "0.25"))
      ]), null));

      /* loads — floor live and roof load are separate so that
         D + 0.75L + 0.75(Lr or S) can actually be formed */
      var roofTypeSel = el("select", {}, [
        { v: "snow", t: "Snow (S) · C_D 1.15" },
        { v: "roof_live", t: "Roof live (Lr) · C_D 1.25" }
      ].map(function (o) {
        return el("option", { value: o.v, text: o.t, selected: o.v === inp.roofType ? "selected" : null });
      }));
      roofTypeSel.addEventListener("change", function () { inp.roofType = this.value; recompute(); });

      var useSel = el("select", {}, [
        { v: "floor", t: "Floor · L/360, L/240" },
        { v: "roof_nonplaster", t: "Roof, non-plaster ceiling · L/240, L/180" },
        { v: "roof_no_ceiling", t: "Roof, no ceiling · L/180, L/180" },
        { v: "roof_plaster", t: "Roof, plaster ceiling · L/360, L/240" }
      ].map(function (o) {
        return el("option", { value: o.v, text: o.t, selected: o.v === inp.memberUse ? "selected" : null });
      }));
      useSel.addEventListener("change", function () { inp.memberUse = this.value; recompute(); });

      inputPane.appendChild(card("Loads", null, el("div", { style: "display:grid;gap:10px" }, [
        el("div", { class: "field-row" }, [
          field("Dead (psf)", numInput("dead", "1")),
          field("Floor live L (psf)", numInput("live", "1"))
        ]),
        field("Roof load Lr or S (psf)", numInput("roofLoad", "1")),
        field("Roof load type", roofTypeSel),
        field("Deflection limits", useSel)
      ]), null));

      /* conditions */
      function check(label, key, hint) {
        var c = el("input", { type: "checkbox" });
        c.checked = !!inp[key];
        c.addEventListener("change", function () { inp[key] = this.checked; recompute(); });
        var lab = el("label", {
          style: "display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:.85rem;color:var(--text);font-weight:500"
        }, [c, el("span", { text: label })]);
        var w = el("div", {}, [lab]);
        if (hint) w.appendChild(el("span", { class: "field-hint", style: "margin-left:24px", text: hint }));
        return w;
      }

      var cfInput = el("input", { type: "number", value: String(inp.CF), step: "0.05", min: "0.5", max: "2" });
      cfInput.addEventListener("input", function () {
        var val = parseFloat(this.value);
        inp.CF = isNaN(val) ? 1 : val;
        recompute();
      });

      inputPane.appendChild(card("Conditions", null, el("div", { style: "display:grid;gap:11px" }, [
        check("Repetitive member (C_r = 1.15)", "repetitive", "3+ members, ≤24″ o.c., load-distributing element · NDS §4.3.9"),
        check("Compression edge continuously braced", "braced", "Unchecked computes C_L from R_B per §3.3.3"),
        check("Wet service (MC > 19%)", "wet", "Applies the Table 4A C_M multipliers"),
        el("div", { class: "field" }, [
          el("label", {}, [
            el("span", { text: "C_F size factor" }),
            el("span", { class: "badge b-warn", style: "margin-left:6px", text: "Typed" })
          ]),
          cfInput,
          el("span", { class: "field-hint", text: "Not carried in the material catalog — enter per NDS Supplement Table 4A." })
        ])
      ]), null));
    }

    /* ---------- results ---------- */

    function drawResults(r) {
      resultPane.innerHTML = "";

      if (r.error) {
        /* the header strip already carries this banner — don't say it twice */
        return;
      }

      if (substituted) {
        resultPane.appendChild(el("div", { class: "banner banner-gold" }, [
          el("strong", { text: "Note — " }),
          el("span", { text: "\u201C" + substituted.from + "\u201D is not tabulated for " + inp.species +
                             "; grade changed to \u201C" + substituted.to + "\u201D." })
        ]));
      }

      if (r.warnings && r.warnings.length) {
        r.warnings.forEach(function (w) {
          resultPane.appendChild(el("div", { class: "banner banner-gold" }, [
            el("strong", { text: "Note — " }), el("span", { text: w })
          ]));
        });
      }

      /* governing summary */
      var gov = r.checks.filter(function (c) { return c.name === r.governing.name; })[0];
      var meter = el("div", { class: "meter" }, [
        el("div", { class: "meter-bar" }, [
          el("span", {
            class: "meter-fill " + (r.governing.dcr > 1 ? "fail" : (r.governing.dcr > 0.9 ? "warn" : "")),
            style: "display:block;width:" + Math.min(100, r.governing.dcr * 100) + "%"
          })
        ]),
        el("div", { class: "meter-legend" }, [
          el("span", { text: "0.0" }),
          el("span", { text: "governing DCR " + fmt(r.governing.dcr, 3) + " · " + r.governing.name }),
          el("span", { text: "1.0" })
        ])
      ]);

      var summary = el("div", { style: "display:grid;gap:12px" }, [
        meter,
        dl([
          { k: "Member", v: FM.esc(inp.size + " " + inp.species + " " + inp.grade) },
          { k: "Span · spacing", v: fmt(inp.span, 1) + " ft · " + inp.spacing + "″ o.c." },
          { k: "Section", v: "A " + fmt(r.section.A_in2, 2) + " in² · S<sub>x</sub> " + fmt(r.section.Sx_in3, 2) + " in³ · I<sub>x</sub> " + fmt(r.section.Ix_in4, 1) + " in⁴" },
          { k: "Governing case", v: FM.esc(r.governing.name) + " · " + FM.esc(r.governing.combo), cls: "gold" },
          { k: "Strength governing", v: FM.esc(r.strength.name) + " · " + fmt(r.strength.dcr, 3), cls: r.strength.dcr > 1 ? "fail" : "" },
          { k: "Serviceability governing", v: FM.esc(r.service.name) + " · " + fmt(r.service.dcr, 3), cls: r.service.dcr > 1 ? "fail" : "" },

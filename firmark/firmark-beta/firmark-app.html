<title>Firmark Structural Harness</title>
<meta name="description" content="Firmark beta — stamp-ready structural calcs with every value traced to its clause.">
<style>
/* ============================================================
   Firmark — app shell (beta)
   Blueprint & Brass: drafting-ink navy, structural blue,
   brass reserved for the seal / approval gate / governing case.
   Light palette on bare :root; dark redefined in both the
   media query (guarded) and the [data-theme] stamp.
   ============================================================ */

:root {
  --ground:      #F2F5F9;
  --surface:     #FFFFFF;
  --surface-2:   #EDF2F8;
  --surface-3:   #E3EBF4;
  --sunken:      #0A1A2E;

  --ink:         #0B1A2D;
  --text:        #3A4D63;
  --muted:       #566982;   /* AA on all light surfaces: 4.67 s3 / 5.22 ground / 5.62 white */
  --faint:       #566982;   /* AA on all light surfaces (4.67 min) */

  --line:        #D9E2ED;
  --line-strong: #BDCCDE;

  --blue:        #14508F;
  --blue-bright: #2A6FC4;
  --blue-wash:   #E8F0FA;
  --on-blue:     #FFFFFF;   /* 8.16:1 on light --blue */
  --focus:       #8A6712;   /* 5.21:1 on white — gold fails 3:1 non-text on light */

  --gold:        #C79A2B;
  --gold-ink:    #8A6712;
  --gold-bright: #E0BC55;
  --gold-wash:   #FBF3DE;

  --pass:        #1B7A55;
  --pass-wash:   #E3F3EC;
  --warn:        #8A5E10;   /* 5.04:1 on --warn-wash */
  --warn-wash:   #FBF0DC;
  --fail:        #A83B3B;
  --fail-wash:   #FBE9E9;

  --on-dark:       #EAF1F8;
  --on-dark-soft:  #A9BFD6;
  --on-dark-faint: #7C93AB;
  --on-dark-line:  #1E3854;

  --shadow-sm: 0 1px 2px rgba(11,26,45,.06);
  --shadow-md: 0 4px 14px -4px rgba(11,26,45,.12);
  --shadow-lg: 0 20px 50px -12px rgba(11,26,45,.28);

  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --bar: 52px;
  --rail: 236px;
  --r: 4px;
  --r-lg: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #08131F;
    --surface:     #0D1E2E;
    --surface-2:   #12283C;
    --surface-3:   #17324A;
    --sunken:      #050D17;

    --ink:         #EAF1F8;
    --text:        #B3C6DA;
    --muted:       #8199B2;
    --faint:       #8CA3BB;   /* AA on all dark surfaces (5.07 min) */

    --line:        #1C3348;
    --line-strong: #2A4A66;

    --blue:        #4E96E0;
    --blue-bright: #6FADEC;
    --blue-wash:   #102A45;
    --on-blue:     #050D17;   /* 6.28:1 on dark --blue */
  --focus:       #E0BC55;   /* 9.6:1 on dark grounds */
    --focus:       #E0BC55;   /* 9.6:1 on dark grounds */

    --gold:        #DDB44F;
    --gold-ink:    #E3BC5A;
    --gold-bright: #EFD283;
    --gold-wash:   #241D0C;

    --pass:        #4FBF8F;
    --pass-wash:   #0E2A21;
    --warn:        #D6A44A;
    --warn-wash:   #2A2110;
    --fail:        #E07575;
    --fail-wash:   #2C1414;

    --on-dark:       #EAF1F8;
    --on-dark-soft:  #A9BFD6;
    --on-dark-faint: #7C93AB;
    --on-dark-line:  #1E3854;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.45);
    --shadow-md: 0 4px 14px -4px rgba(0,0,0,.55);
    --shadow-lg: 0 20px 50px -12px rgba(0,0,0,.7);
  }
}

:root[data-theme="dark"] {
  --ground:      #08131F;
  --surface:     #0D1E2E;
  --surface-2:   #12283C;
  --surface-3:   #17324A;
  --sunken:      #050D17;

  --ink:         #EAF1F8;
  --text:        #B3C6DA;
  --muted:       #8199B2;
  --faint:       #8CA3BB;   /* AA on all dark surfaces (5.07 min) */

  --line:        #1C3348;
  --line-strong: #2A4A66;

  --blue:        #4E96E0;
  --blue-bright: #6FADEC;
  --blue-wash:   #102A45;
  --on-blue:     #050D17;   /* 6.28:1 on dark --blue */

  --gold:        #DDB44F;
  --gold-ink:    #E3BC5A;
  --gold-bright: #EFD283;
  --gold-wash:   #241D0C;

  --pass:        #4FBF8F;
  --pass-wash:   #0E2A21;
  --warn:        #D6A44A;
  --warn-wash:   #2A2110;
  --fail:        #E07575;
  --fail-wash:   #2C1414;

  --on-dark:       #EAF1F8;
  --on-dark-soft:  #A9BFD6;
  --on-dark-faint: #7C93AB;
  --on-dark-line:  #1E3854;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.45);
  --shadow-md: 0 4px 14px -4px rgba(0,0,0,.55);
  --shadow-lg: 0 20px 50px -12px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1,h2,h3,h4 { margin: 0; color: var(--ink); font-weight: 700; letter-spacing: -.015em; line-height: 1.2; }
h1 { font-size: 1.3rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: .94rem; }
h4 { font-size: .84rem; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--blue); text-decoration: none; }
a:hover { color: var(--blue-bright); }
button { font-family: inherit; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

/* links sitting on a permanently dark surface (top bar, sunken panels) */
.topbar a, .toast a { color: #9CC0EB; text-decoration: underline; text-underline-offset: 2px; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 300; background: var(--gold); color: #0A1A2E; padding: 8px 14px; }

/* ---------- shell ---------- */

.shell {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: var(--bar) minmax(0, 1fr);
  grid-template-areas: "bar bar" "rail main";
  height: 100vh;
  height: 100dvh;
}
.shell.rail-collapsed { grid-template-columns: 56px minmax(0, 1fr); }

/* top bar */
.topbar {
  grid-area: bar;
  background: var(--sunken);
  border-bottom: 1px solid var(--on-dark-line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  z-index: 40;
}
.tb-btn {
  display: inline-grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: var(--r);
  border: 1px solid transparent;
  background: transparent;
  color: var(--on-dark-soft);
  cursor: pointer;
}
.tb-btn:hover { background: rgba(255,255,255,.07); color: var(--on-dark); }
.tb-brand {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--on-dark); font-weight: 700; letter-spacing: -.02em; font-size: .95rem;
}
.tb-env {
  font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--gold-bright); border: 1px solid rgba(199,154,43,.4);
  background: rgba(199,154,43,.1); padding: 2px 6px; border-radius: 3px;
}
.tb-search {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  width: min(420px, 38vw);
  padding: 6px 10px;
  border-radius: var(--r);
  border: 1px solid var(--on-dark-line);
  background: rgba(255,255,255,.05);
  color: var(--on-dark-faint);
  font-size: .82rem;
  cursor: pointer;
  text-align: left;
}
.tb-search:hover { border-color: rgba(255,255,255,.24); color: var(--on-dark-soft); }
.tb-search .kbd { margin-left: auto; }
.kbd {
  font-family: var(--mono); font-size: .66rem;
  border: 1px solid var(--on-dark-line);
  background: rgba(255,255,255,.06);
  color: var(--on-dark-faint);
  padding: 1px 5px; border-radius: 3px; white-space: nowrap;
}
.kbd-light {
  border-color: var(--line); background: var(--surface-2); color: var(--muted);
}
.tb-right { display: flex; align-items: center; gap: 8px; margin-left: 4px; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold); color: #0A1A2E;
  display: grid; place-items: center;
  font-size: .68rem; font-weight: 700; font-family: var(--mono);
  flex: none;
}

/* sidebar */
.rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 12px 10px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.rail-group { display: grid; gap: 2px; }
.rail-label {
  font-family: var(--mono); font-size: .6rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--faint); padding: 0 8px 4px; font-weight: 600;
}
.rail-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: var(--r);
  color: var(--text); font-size: .855rem; font-weight: 500;
  cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left;
}
.rail-item:hover { background: var(--surface-2); color: var(--ink); }
.rail-item[aria-current="page"] {
  background: var(--blue-wash); color: var(--blue); font-weight: 650;
  box-shadow: inset 2px 0 0 var(--gold);
}
.rail-ico { width: 15px; height: 15px; flex: none; opacity: .85; }
.rail-count {
  margin-left: auto; font-family: var(--mono); font-size: .68rem; color: var(--faint);
}
.shell.rail-collapsed .rail-label,
.shell.rail-collapsed .rail-item span:not(.rail-ico),
.shell.rail-collapsed .rail-count { display: none; }
.shell.rail-collapsed .rail-item { justify-content: center; padding: 8px 0; }
.shell.rail-collapsed .rail { padding-inline: 6px; }

.rail-back {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 4px 8px 8px; border: 0; background: transparent;
  cursor: pointer; width: 100%;
}
.rail-back:hover { color: var(--blue); }

/* main surface */
.main { grid-area: main; overflow-y: auto; }
.main-inner { padding: 20px 24px 56px; max-width: 1280px; }
@media (max-width: 700px) { .main-inner { padding: 14px 14px 44px; } }

.page-head {
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px;
  padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
}
.page-head-copy { display: grid; gap: 3px; }
.page-head p { color: var(--muted); font-size: .87rem; }
.page-head-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }

.eyebrow {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .15em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}

/* mobile: rail becomes a drawer */
@media (max-width: 860px) {
  .shell, .shell.rail-collapsed { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "main"; }
  .rail {
    position: fixed; top: var(--bar); bottom: 0; left: 0; width: 260px;
    z-index: 60; transform: translateX(-100%); transition: transform .18s;
    box-shadow: var(--shadow-lg);
  }
  .rail.open { transform: none; }
  .shell.rail-collapsed .rail-label,
  .shell.rail-collapsed .rail-item span:not(.rail-ico),
  .shell.rail-collapsed .rail-count { display: revert; }
  .shell.rail-collapsed .rail-item { justify-content: flex-start; padding: 7px 8px; }
  .scrim {
    position: fixed; inset: var(--bar) 0 0 0; background: rgba(5,13,23,.5);
    z-index: 50; display: none;
  }
  .scrim.on { display: block; }
  .tb-search { width: auto; flex: 1; }
  .tb-search .kbd { display: none; }
}

/* ---------- buttons ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: .845rem; font-weight: 600; cursor: pointer;
  transition: background-color .14s, border-color .14s, color .14s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn-primary:hover { background: var(--blue-bright); border-color: var(--blue-bright); color: var(--on-blue); }
.btn-gold { background: var(--gold); border-color: var(--gold); color: #0A1A2E; }
.btn-gold:hover { background: var(--gold-bright); border-color: var(--gold-bright); color: #0A1A2E; }
.btn-sm { padding: 4px 9px; font-size: .78rem; }
.btn[aria-pressed="true"] { background: var(--blue-wash); border-color: var(--blue); color: var(--blue); }

.seg {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px;
}
.seg button {
  border: 0; background: transparent; cursor: pointer;
  font-family: var(--mono); font-size: .7rem; letter-spacing: .07em; text-transform: uppercase;
  font-weight: 650; color: var(--muted); padding: 5px 11px; border-radius: 3px;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--blue); box-shadow: var(--shadow-sm);
}

/* ---------- cards / panels ---------- */

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
}
.card-pad { padding: 16px; }
.card-head {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.card-title {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); font-weight: 650;
}
.card-body { padding: 14px; }
.card-foot {
  padding: 9px 14px; border-top: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--mono); font-size: .68rem; color: var(--muted);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
@media (max-width: 1100px) { .g5 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 980px)  { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 820px)  { .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px)  { .g2, .g3, .g4, .g5 { grid-template-columns: 1fr; } }

/* ---------- badges / chips ---------- */

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: .63rem; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 650; padding: 3px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap;
}
.b-pass  { color: var(--pass); border-color: var(--pass); background: var(--pass-wash); }
.b-warn  { color: var(--warn); border-color: var(--warn); background: var(--warn-wash); }
.b-fail  { color: var(--fail); border-color: var(--fail); background: var(--fail-wash); }
.b-gold  { color: var(--gold-ink); border-color: rgba(199,154,43,.55); background: var(--gold-wash); }
.b-blue  { color: var(--blue); border-color: var(--blue); background: var(--blue-wash); }
.b-mute  { color: var(--muted); border-color: var(--line-strong); background: var(--surface-2); }

.chip {
  font-family: var(--mono); font-size: .7rem; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 3px; padding: 3px 7px; white-space: nowrap;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* utilization chip — the per-check readout on a sheet header */
.util {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-family: var(--mono); font-size: .72rem; font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px;
  background: var(--surface);
}
.util-k { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .63rem; }
.util-v { font-weight: 700; color: var(--ink); }
.util.is-pass { border-color: rgba(27,122,85,.45); background: var(--pass-wash); }
.util.is-pass .util-v { color: var(--pass); }
.util.is-warn { border-color: rgba(156,107,20,.5); background: var(--warn-wash); }
.util.is-warn .util-v { color: var(--warn); }
.util.is-fail { border-color: rgba(168,59,59,.5); background: var(--fail-wash); }
.util.is-fail .util-v { color: var(--fail); }
.util.is-gov { box-shadow: inset 0 -2px 0 var(--gold); }

/* ---------- stats ---------- */

.stat { padding: 13px 15px; display: grid; gap: 2px; }
.stat-v { font-family: var(--mono); font-size: 1.5rem; font-weight: 700; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-v.gold { color: var(--gold-ink); }
.stat-v.pass { color: var(--pass); }
.stat-v.fail { color: var(--fail); }
.stat-l { font-family: var(--mono); font-size: .63rem; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }

/* ---------- tables ---------- */

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
thead th {
  position: sticky; top: 0;
  text-align: left; font-family: var(--mono); font-size: .63rem; letter-spacing: .11em;
  text-transform: uppercase; color: var(--muted); font-weight: 650;
  padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
}
tbody td { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--text); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--surface-2); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.k { font-family: var(--mono); font-weight: 650; color: var(--ink); white-space: nowrap; }

/* ---------- data rows (key/value readouts) ---------- */

.dl { display: grid; }
.dl-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 6px 0; border-bottom: 1px dashed var(--line);
  font-size: .83rem;
}
.dl-row:last-child { border-bottom: 0; }
.dl-k { color: var(--muted); flex: 1 1 auto; min-width: 0; }
.dl-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 650; color: var(--ink); text-align: right; white-space: nowrap; }
.dl-v.gold { color: var(--gold-ink); }
.dl-v.pass { color: var(--pass); }
.dl-v.fail { color: var(--fail); }
.dl-row.total { border-top: 1px solid var(--line-strong); border-bottom: 0; margin-top: 3px; padding-top: 8px; }

/* ---------- form controls ---------- */

.field { display: grid; gap: 4px; }
.field label, .lbl {
  font-family: var(--mono); font-size: .63rem; letter-spacing: .11em; text-transform: uppercase;
  color: var(--muted); font-weight: 650;
}
input[type="text"], input[type="number"], input[type="email"], select {
  width: 100%; font-family: var(--sans); font-size: .87rem;
  padding: 7px 9px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.field-hint { font-size: .74rem; color: var(--faint); display: block; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

/* selects used as inline filters shouldn't stretch the row */
.filter-bar select, .filter-bar input { width: auto; min-width: 150px; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.help-dot {
  display: inline-grid; place-items: center;
  width: 14px; height: 14px; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: .6rem; color: var(--muted); cursor: help; font-family: var(--mono);
  vertical-align: middle; margin-left: 4px;
}
.help-dot:hover { border-color: var(--blue); color: var(--blue); }

/* ---------- sheet header strip ---------- */

.sheet-head {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 12px 14px; display: grid; gap: 10px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.sheet-head-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.sheet-mark {
  font-family: var(--mono); font-size: 1.02rem; font-weight: 700; color: var(--ink); letter-spacing: -.01em;
}
.sheet-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sheet-utils { display: flex; flex-wrap: wrap; gap: 6px; }

.gov-pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 700; padding: 5px 10px; border-radius: 3px;
  border: 1px solid var(--gold); background: var(--gold-wash); color: var(--gold-ink);
}
.gov-pill.is-fail { border-color: var(--fail); background: var(--fail-wash); color: var(--fail); }

/* locked state */
.locked .input-pane {
  /* enforcement is the `inert` attribute set in JS; this is visual reinforcement only.
     No opacity — Lock is a reading mode, and fading text broke AA. */
  border-left: 3px solid var(--gold);
  padding-left: 9px;
}
.locked .input-pane input,
.locked .input-pane select { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.lock-note {
  display: none; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: .7rem; color: var(--gold-ink);
  background: var(--gold-wash); border: 1px dashed var(--gold);
  padding: 6px 10px; border-radius: var(--r);
}
.locked .lock-note { display: flex; }

/* quick vs detailed */
.detail-only { display: revert; }
.quick .detail-only { display: none; }

/* ---------- sheet layout ---------- */

.sheet {
  display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 16px; align-items: start;
}
@media (max-width: 1000px) { .sheet { grid-template-columns: 1fr; } }
.input-pane { display: grid; gap: 14px; position: sticky; top: 96px; }
@media (max-width: 1000px) { .input-pane { position: static; } }
.result-pane { display: grid; gap: 14px; min-width: 0; }

/* factor ledger */
.ledger .dl-row { font-family: var(--mono); font-size: .8rem; }
.ledger .dl-k { color: var(--text); }
.clause {
  font-family: var(--mono); font-size: .66rem; color: var(--faint);
  border-left: 2px solid var(--line-strong); padding-left: 7px; margin-left: 7px;
}

/* equation display */
.eq {
  font-family: var(--mono); font-size: .8rem; line-height: 1.85;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 12px; overflow-x: auto; color: var(--text);
}
.eq b { color: var(--ink); }
.eq .cite { color: var(--faint); }

/* meter bar for DCR */
.meter { display: grid; gap: 4px; }
.meter-bar {
  height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; position: relative;
}
.meter-fill { height: 100%; border-radius: 4px; background: var(--pass); transition: width .25s; }
.meter-fill.warn { background: var(--warn); }
.meter-fill.fail { background: var(--fail); }
.meter-cap {
  position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--gold);
}
.meter-legend { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .65rem; color: var(--faint); }

/* accordions */
details.acc { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.acc + details.acc { margin-top: 8px; }
details.acc > summary {
  padding: 9px 12px; cursor: pointer; list-style: none;
  font-size: .84rem; font-weight: 650; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::after {
  content: "+"; margin-left: auto; font-family: var(--mono); color: var(--muted); font-size: 1rem; line-height: 1;
}
details.acc[open] > summary::after { content: "\2212"; }
details.acc > summary:hover { color: var(--blue); }
.acc-body { padding: 0 12px 12px; }

/* ---------- banners ---------- */

.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: var(--r); font-size: .84rem;
  border: 1px solid; margin-bottom: 14px;
}
.banner-warn { border-color: var(--warn); background: var(--warn-wash); color: var(--warn); }
.banner-info { border-color: var(--blue); background: var(--blue-wash); color: var(--blue); }
.banner-gold { border-color: var(--gold); background: var(--gold-wash); color: var(--gold-ink); }
.banner strong { color: inherit; }
.banner .btn { margin-left: auto; }

/* beta strip */
.beta-strip {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: .68rem; color: var(--gold-ink);
  background: var(--gold-wash); border: 1px dashed var(--gold);
  padding: 7px 11px; border-radius: var(--r); margin-bottom: 16px;
}

/* ---------- project cards ---------- */

.proj { padding: 14px; display: grid; gap: 9px; cursor: pointer; }
.proj:hover { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
.proj-top { display: flex; align-items: flex-start; gap: 8px; }
.proj-name { font-weight: 650; color: var(--ink); font-size: .92rem; }
.proj-addr { font-size: .76rem; color: var(--muted); }
.pipe { display: flex; gap: 3px; }
.pipe-seg { height: 4px; flex: 1; border-radius: 2px; background: var(--surface-3); }
.pipe-seg.on { background: var(--pass); }
.pipe-seg.cur { background: var(--gold); }
.proj-foot { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: .68rem; color: var(--faint); }

/* ---------- command palette ---------- */

.palette-scrim {
  position: fixed; inset: 0; background: rgba(5,13,23,.55);
  display: none; z-index: 200; padding: 12vh 16px 16px;
}
.palette-scrim.on { display: block; }
.palette {
  max-width: 560px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg); overflow: hidden;
}
.palette-input {
  width: 100%; border: 0; border-bottom: 1px solid var(--line);
  padding: 13px 15px; font-size: .95rem; background: var(--surface); color: var(--ink);
  border-radius: 0;
}
.palette-input:focus-visible { outline: none; border-bottom-color: var(--focus); }
.palette-list { max-height: 46vh; overflow-y: auto; padding: 6px; }
.palette-group {
  font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--faint); padding: 8px 9px 4px; font-weight: 650;
}
.palette-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 9px; border-radius: var(--r); cursor: pointer; font-size: .86rem; color: var(--text);
}
.palette-item[aria-selected="true"] { background: var(--blue-wash); color: var(--blue); }
.palette-item .kbd { margin-left: auto; }
.palette-empty { padding: 18px; text-align: center; color: var(--muted); font-size: .85rem; }
.palette-foot {
  display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line);
  background: var(--surface-2); font-family: var(--mono); font-size: .65rem; color: var(--faint);
}

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--sunken); color: var(--on-dark);
  border: 1px solid var(--on-dark-line); border-radius: var(--r);
  padding: 9px 15px; font-size: .84rem; z-index: 250;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  box-shadow: var(--shadow-lg);
}
.toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- views ---------- */
.view { display: none; }
.view.active { display: block; }

.empty {
  padding: 40px 20px; text-align: center; color: var(--muted); font-size: .88rem;
  border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface);
}

.src-note {
  font-family: var(--mono); font-size: .66rem; color: var(--faint); line-height: 1.6;
}
.src-note a { color: var(--blue); }

/* ---------- a11y utilities ---------- */

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* scroll containers must be keyboard-reachable (WCAG 2.1.1) */
.tw:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* main is a focus target on route change, but should not show a ring */
#main:focus, .view:focus, .view:focus-visible { outline: none; }

/* a failed pipeline stage */
.pipe-seg.bad { background: var(--fail); }

/* stat colour variants used by the dashboard tiles */
.stat-v.blue { color: var(--blue); }


/* ---------- QA fixes ---------- */

/* M5: headHost must not be the sticky containing block */
.sheet-headhost { display: contents; }

/* M2: table rows are keyboard-operable */
tbody tr.clickable:focus-visible {
  outline: 2px solid var(--focus); outline-offset: -2px;
}

/* M4: the closed mobile drawer must be out of the tab order */
@media (max-width: 860px) {
  .rail[inert] { visibility: hidden; }
}

/* m10: palette is a real dialog */
.palette:focus { outline: none; }

</style>

      var proj = PROJECTS.filter(function (p) { return p.id === (sheet && sheet.project); })[0];

      g.appendChild(el("div", { class: "rail-label", text: proj ? proj.name : "Project" }));
      SHEETS.filter(function (s) { return s.project === (sheet && sheet.project); }).forEach(function (s) {

  /* ---------------- router ---------------- */

  var VIEWS = {};

  function go(route, opts) {
    opts = opts || {};
    state.route = route;
    if (opts.projectId !== undefined) state.projectId = opts.projectId;
    if (opts.sheetId !== undefined) state.sheetId = opts.sheetId;

    Array.prototype.forEach.call(document.querySelectorAll(".view"), function (v) {
      v.classList.toggle("active", v.id === "view-" + route);
    });

    /* set a default title first so a view (e.g. the sheet) can override it */
    document.title = "Firmark · " + route.charAt(0).toUpperCase() + route.slice(1);

    var host = document.getElementById("view-" + route);
    if (host && VIEWS[route]) { host.innerHTML = ""; VIEWS[route](host); }

    renderRail();
    var main = document.getElementById("main");
    main.scrollTop = 0;
    /* move focus to the new view so a screen reader lands in the fresh content */
    if (host) { host.setAttribute("tabindex", "-1"); host.focus({ preventScroll: true }); }
    closeRailDrawer();
  }

  function rowLink(label, onActivate, cells) {
    return el("tr", {

      onclick: onActivate,

    var m = { "Draft": "b-mute", "Active": "b-blue", "In Review": "b-gold", "Approved": "b-pass", "Archived": "b-mute" };
    return el("span", { class: "badge " + (m[s] || "b-mute"), text: s });

  function pipe(stage, failedAt) {
    var p = el("div", { class: "pipe" });
    for (var i = 0; i < 6; i++) {
      var cls = "pipe-seg";
      if (failedAt && i === failedAt - 1) cls += " bad";
      else if (i < stage - 1) cls += " on";
      else if (i === stage - 1) cls += " cur";
      p.appendChild(el("span", { class: cls }));
    }
    return p;
  }

  /* Strongest first. Table 4A writes "No. 1"; Table 4B writes "No.1" with no
     space — both spellings have to be here or every Southern Pine grade falls to
     the bottom of the list and the three weakest grades in the book sort above
     No.1. That is not cosmetic: the sheet substitutes grades[0] when a species
     changes, so an unranked list hands the user "Construction". */
  var GRADE_RANK = [
    "Dense Select Structural", "Select Structural", "Non-Dense Select Structural",
    "Dense Structural 86", "Dense Structural 72", "Dense Structural 65",
    "No. 1 & Btr", "No. 1 Dense", "No.1 Dense", "No. 1", "No.1", "No.1 Non-Dense",
    "No. 1/No. 2",
    "No. 2 Dense", "No.2 Dense", "No. 2", "No.2", "No.2 Non-Dense",
    "No. 3", "No.3", "No.3 and Stud", "Stud",
    "Construction", "Standard", "Utility"
  ];
  function gradeRank(g) {
    var i = GRADE_RANK.indexOf(g);
    return i === -1 ? GRADE_RANK.length : i;
  }

      card("Design profile · " + prof.name, null, dl([
        { k: "Exposure", v: prof.exposure },
        { k: "Ground snow", v: prof.groundSnow + " psf" },
        { k: "Wind speed", v: prof.wind + " mph" },
        { k: "Seismic (SDC)", v: prof.sdc },
        { k: "Live-load defl.", v: "&le; L/" + prof.deflLive },
        { k: "Default spacing", v: prof.spacing + "&quot; o.c." },
        { k: "Species / grade", v: esc(prof.species) + " " + esc(prof.grade) },
        { k: "Max DCR", v: fmt(prof.maxDCR), cls: "gold" }
      ]), "Applied to " + prof.active + " active projects · override anytime, every change logged")
    ]));
  };

  /* ---------------- views: calculations ---------------- */

  VIEWS.calculations = function (host) {
    host.appendChild(pageHead("Calculations", SHEETS.length + " sheets · every check cites its clause", [
      el("button", { class: "btn btn-primary", onclick: function () { toast("Beta: new-sheet creation isn’t wired up yet."); }, text: "+ New calculation" })
    ]));

    var tb = el("tbody");
    SHEETS.forEach(function (s) {
      var proj = PROJECTS.filter(function (p) { return p.id === s.project; })[0];
      var r = FM.engine ? FM.engine.run(inputsFor(s)) : null;
      tb.appendChild(rowLink("Open sheet " + s.id + " — " + s.label, function () { go("sheet", { sheetId: s.id }); }, [
        el("td", { class: "k", text: s.id }),
        el("td", { text: s.label }),
        el("td", { text: proj ? proj.name : "—" }),
        el("td", { class: "n", text: s.inputs.size }),
        el("td", { text: s.inputs.species + " " + s.inputs.grade }),
        el("td", { text: r && !r.error ? r.governing.name : "—" }),
        el("td", { class: "n" }, [dcrBadge(r)])
      ]));
    });

    host.appendChild(el("div", { class: "tw", tabindex: "0", role: "region", "aria-label": "Scrollable table" }, [el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Mark" }), el("th", { text: "Sheet" }), el("th", { text: "Project" }),
        el("th", { class: "n", text: "Size" }), el("th", { text: "Material" }), el("th", { text: "Governs" }), el("th", { class: "n", text: "DCR" })
      ])]),
      tb
    ])]));
  };

  /* ---------------- views: policies ---------------- */

  VIEWS.policies = function (host) {
    host.appendChild(pageHead("Policies", "Design profiles — the envelope the engine designs within."));
    host.appendChild(betaStrip("Editing a profile is read-only in this build; the values below drive the live calculations."));

    var g = el("div", { class: "grid g3" });
    PROFILES.forEach(function (p) {
      var body = dl([
        { k: "Exposure", v: p.exposure },
        { k: "Ground snow", v: p.groundSnow + " psf" },
        { k: "Wind speed", v: p.wind + " mph" },
        { k: "Seismic (SDC)", v: p.sdc },
        { k: "Live-load defl.", v: "&le; L/" + p.deflLive },
        { k: "Total-load defl.", v: "&le; L/" + p.deflTotal },
        { k: "Default spacing", v: p.spacing + "&quot; o.c." },
        { k: "Species / grade", v: esc(p.species) + " " + esc(p.grade) },
        { k: "Max DCR", v: fmt(p.maxDCR), cls: "gold" }
      ]);
      var c = card(p.name, el("span", { class: "badge b-mute", text: p.active + " projects", style: "margin-left:auto" }), body, p.note);
      g.appendChild(c);
    });
    host.appendChild(g);
  };

  /* ---------------- views: output ---------------- */

  VIEWS.output = function (host) {
    host.appendChild(pageHead("Output & Docs", "Calc-report packages and stamp-ready plan sets."));

    var rows = el("tbody");
    SHEETS.forEach(function (s) {
      var r = FM.engine ? FM.engine.run(inputsFor(s)) : null;
      var proj = PROJECTS.filter(function (p) { return p.id === s.project; })[0];
      rows.appendChild(el("tr", {}, [
        el("td", { class: "k", text: s.id }),
        el("td", { text: proj ? proj.name : "—" }),
        el("td", { text: s.inputs.size + " " + s.inputs.species + " " + s.inputs.grade }),
        el("td", { text: r && !r.error ? r.governing.name : "—" }),
        el("td", { class: "n" }, [dcrBadge(r)]),
        el("td", { text: r && !r.error ? r.basis : "—" })
      ]));
    });

    host.appendChild(el("div", { class: "tw", tabindex: "0", role: "region", "aria-label": "Scrollable table", style: "margin-bottom:16px" }, [el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Mark" }), el("th", { text: "Project" }), el("th", { text: "Member" }),
        el("th", { text: "Governs" }), el("th", { class: "n", text: "DCR" }), el("th", { text: "Basis" })
      ])]),
      rows
    ])]));

    host.appendChild(el("div", { class: "grid g2" }, [
      card("Export", null, el("div", {}, [
        el("p", { style: "font-size:.86rem;margin-bottom:10px", text: "A calc-report package and a stamp-ready plan set, assembled straight from the design. A licensed PE reviews and stamps every package; AI never does." }),
        el("div", { class: "chips" }, [
          el("button", { class: "btn btn-sm", onclick: function () { FM.exportCalcs(); }, text: "Download calc record (.txt)" }),
          el("button", { class: "btn btn-sm", onclick: function () { toast("Beta: DXF plan-set export isn’t wired up yet."); }, text: "Plan set (DXF)" })
        ])
      ]), "Nothing ships without your licensed PE’s review and seal"),
      card("Approval gate", el("span", { class: "badge b-gold", text: "PE only", style: "margin-left:auto" }),
        dl([
          { k: "Design & run the engine", v: "Engineer · PE" },
          { k: "Override a design value", v: "Engineer · PE" },
          { k: "Approve &amp; apply the stamp", v: "PE only", cls: "gold" },
          { k: "Read another firm’s data", v: "Never" }
        ]),
        "Least privilege · the stamp is the PE’s alone")
    ]));
  };

  /* ---------------- views: settings & help ---------------- */

  VIEWS.settings = function (host) {
    host.appendChild(pageHead("Settings", "Firm, roles, and appearance."));
    host.appendChild(el("div", { class: "grid g2" }, [
      card("Organization", null, dl([
        { k: "Firm", v: "Sample Structural PC" },
        { k: "Your role", v: "PE of record", cls: "gold" },
        { k: "Tenant", v: "Isolated per firm" },
        { k: "Default profile", v: getProfile(state.profileId).name }
      ]), "Switching firms switches the whole data boundary"),
      card("Appearance", null, el("div", { class: "field" }, [
        el("span", { class: "lbl", text: "Theme" }),
        el("div", { class: "seg", role: "group", "aria-label": "Theme" }, [
          el("button", { onclick: function () { setTheme("light"); }, "data-theme-btn": "light", text: "Light" }),
          el("button", { onclick: function () { setTheme("dark"); }, "data-theme-btn": "dark", text: "Dark" }),
          el("button", { onclick: function () { setTheme("system"); }, "data-theme-btn": "system", text: "System" })
        ]),
        el("p", { class: "field-hint", style: "margin-top:8px", text: "Figures and calculation sheets are legible in both themes." })
      ]), null)
    ]));
    syncThemeButtons();
  };

  VIEWS.help = function (host) {
    host.appendChild(pageHead("Help", "The shell, the palette, and your first project."));
    host.appendChild(el("div", { class: "grid g2" }, [
      card("Keyboard", null, dl([
        { k: "Command palette", v: "Ctrl K &nbsp;or&nbsp; /" },
        { k: "Go to Dashboard", v: "g d" },
        { k: "Go to Calculations", v: "g c" },
        { k: "Go to Sizing", v: "g z" },
        { k: "Go to Projects", v: "g p" },
        { k: "Go to Materials", v: "g m" },
        { k: "Go to Help", v: "g h" },
        { k: "Close / dismiss", v: "Esc" }
      ]), "Press g, release, then the second key"),
      card("The shell", null, el("div", { style: "display:grid;gap:9px;font-size:.86rem" }, [
        el("p", { text: "Firmark runs inside one persistent shell: a top bar, a single sidebar slot, and the working surface. Routes change what fills the slot and the surface; the shell itself never swaps out from under you." }),
        el("p", { text: "Inside a calculation the same slot shows that project’s navigation instead — its sheets and the project overview. The portal nav is one click away." }),
        el("p", { text: "Two header toggles change how much a sheet shows without changing what it computes. Quick collapses the design conditions and hides the factor ledger; Detailed shows the full record. Lock puts the sheet in presentation mode — a view state for working over someone’s shoulder, not an approval." })
      ]), null)
    ]));
  };

  /* ---------------- theme ---------------- */

  function setTheme(mode) {
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    try { localStorage.setItem("fm-theme", mode); } catch (e) {}
    syncThemeButtons();
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || "system";
  }
  /* what the user actually SEES right now — system mode has no attribute */
  function effectiveTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function syncThemeButtons() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme-btn]"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-theme-btn") === currentTheme() ? "true" : "false");
    });
  }

  /* ---------------- command palette ---------------- */

  var paletteItems = [];
  var paletteIdx = 0;

  function buildPaletteItems() {
    var items = [];
    NAV.forEach(function (g) {
      g.items.forEach(function (it) {
        items.push({ group: "Go to", label: it.label, run: function () { go(it.id); } });
      });
    });
    PROJECTS.forEach(function (p) {
      items.push({ group: "Projects", label: p.name, hint: p.status, run: function () { go("project", { projectId: p.id }); } });
    });
    SHEETS.forEach(function (s) {
      items.push({ group: "Calculations", label: s.id + " · " + s.label, run: function () { go("sheet", { sheetId: s.id }); } });
    });
    items.push({ group: "Actions", label: "Toggle theme", run: function () { setTheme(currentTheme() === "dark" ? "light" : "dark"); } });
    items.push({ group: "Actions", label: "Download calc record", run: function () { FM.exportCalcs(); } });
    return items;
  }

  var paletteReturn = null;

  function openPalette() {
    paletteReturn = document.activeElement;
    var scrim = document.getElementById("paletteScrim");
    scrim.classList.add("on");
    document.getElementById("paletteOpen").setAttribute("aria-expanded", "true");
    var inp = document.getElementById("paletteInput");
    inp.value = "";
    renderPalette("");
    inp.focus();
  }
  function closePalette() {
    var scrim = document.getElementById("paletteScrim");
    if (!scrim.classList.contains("on")) return;
    scrim.classList.remove("on");
    document.getElementById("paletteOpen").setAttribute("aria-expanded", "false");
    /* return focus where the user left it */
    var back = paletteReturn && document.contains(paletteReturn) ? paletteReturn : document.getElementById("paletteOpen");
    paletteReturn = null;
    if (back && back.focus) back.focus();
  }

  /* keep Tab inside the dialog while it is open */
  function trapPaletteTab(e) {
    if (e.key !== "Tab") return;
    var scrim = document.getElementById("paletteScrim");
    if (!scrim.classList.contains("on")) return;
    var focusables = scrim.querySelectorAll("input, button, [tabindex]:not([tabindex='-1'])");
    if (!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function renderPalette(q) {
    var list = document.getElementById("paletteList");
    var all = buildPaletteItems();
    var ql = q.trim().toLowerCase();
    paletteItems = ql ? all.filter(function (i) { return (i.label + " " + i.group).toLowerCase().indexOf(ql) !== -1; }) : all;
    paletteIdx = 0;
    list.innerHTML = "";
    if (!paletteItems.length) {
      list.appendChild(el("div", { class: "palette-empty", text: "No matches. Try a project name or a page." }));
      return;
    }
    var lastGroup = null;
    paletteItems.forEach(function (it, i) {
      if (it.group !== lastGroup) {
        list.appendChild(el("div", { class: "palette-group", text: it.group }));
        lastGroup = it.group;
      }
      var node = el("div", {
        class: "palette-item", role: "option", id: "pal-" + i,
        "aria-selected": i === 0 ? "true" : "false",
        onclick: function () { closePalette(); it.run(); }
      }, [el("span", { text: it.label })]);
      if (it.hint) node.appendChild(el("span", { class: "kbd kbd-light", text: it.hint }));
      list.appendChild(node);
    });
    syncPaletteSel();
  }
  function syncPaletteSel() {
    var nodes = document.querySelectorAll(".palette-item");
    Array.prototype.forEach.call(nodes, function (n, i) {
      n.setAttribute("aria-selected", i === paletteIdx ? "true" : "false");
      if (i === paletteIdx) {
        n.scrollIntoView({ block: "nearest" });
        document.getElementById("paletteInput").setAttribute("aria-activedescendant", n.id);
      }
    });
  }

  /* ---------------- rail drawer (mobile) ---------------- */

  function isMobile() { return window.matchMedia("(max-width: 860px)").matches; }

  /* One place that owns drawer state, so aria-expanded and inert can never drift. */
  function setDrawer(open) {
    var rail = document.getElementById("rail");
    var scrim = document.getElementById("scrim");
    var btn = document.getElementById("railToggle");
    if (!rail) return;
    if (isMobile()) {
      rail.classList.toggle("open", open);
      scrim.classList.toggle("on", open);
      rail.toggleAttribute("inert", !open);
      rail.setAttribute("aria-hidden", open ? "false" : "true");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    } else {
      rail.classList.remove("open");
      scrim.classList.remove("on");
      rail.removeAttribute("inert");
      rail.removeAttribute("aria-hidden");
      btn.setAttribute("aria-expanded",
        document.getElementById("shell").classList.contains("rail-collapsed") ? "false" : "true");
    }
  }
  function toggleRailDrawer() { setDrawer(!document.getElementById("rail").classList.contains("open")); }
  function closeRailDrawer() { setDrawer(false); }

  /* ---------------- export ---------------- */

  function exportCalcs() {
    if (!FM.engine) { toast("Engine not loaded."); return; }
    var lines = [];
    lines.push("FIRMARK — CALCULATION RECORD (beta)");
    lines.push("Generated from the Firmark beta build. Demonstration only — not for construction.");
    lines.push("A licensed PE reviews and stamps every package; AI never does.");
    lines.push("");
    SHEETS.forEach(function (s) {
      var r = FM.engine.run(inputsFor(s));
      lines.push(new Array(73).join("="));
      lines.push("MARK " + s.id + " — " + s.label);
      if (r.error) {
        /* never emit a mark that reads like it was checked when it was not */
        lines.push("  NOT EVALUATED — " + r.message);
        lines.push("");
        return;
      }
      lines.push("Member: " + s.inputs.size + " " + s.inputs.species + " " + s.inputs.grade +
                 " @ " + s.inputs.spacing + " in o.c. · span " + s.inputs.span + " ft");
      lines.push("Basis: " + r.basis);
      lines.push("");
      r.checks.forEach(function (c) {
        lines.push("  " + c.name.toUpperCase());
        c.lines.forEach(function (l) { lines.push("    " + l.replace(/<[^>]+>/g, "")); });
        lines.push("    DCR = " + fmt(c.dcr) + (c.dcr <= 1 ? "  OK" : "  NG"));
        lines.push("");
      });
      lines.push("  GOVERNING: " + r.governing.name + " · DCR " + fmt(r.governing.dcr) +
                 " · combination " + r.governing.combo);
      lines.push("");
    });
    lines.push(new Array(73).join("="));
    lines.push("Scope limits: " + FM.engine.LIMITS.join(" | "));
    var blob = new Blob([lines.join("\n")], { type: "text/plain" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "firmark-calc-record.txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Calc record downloaded.");
  }

  /* ---------------- boot ---------------- */

  function boot() {
    try {
      var saved = localStorage.getItem("fm-theme");
      if (saved && saved !== "system") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}

    document.getElementById("railToggle").addEventListener("click", function () {
      if (window.matchMedia("(max-width: 860px)").matches) { toggleRailDrawer(); return; }
      var shell = document.getElementById("shell");
      var collapsed = shell.classList.toggle("rail-collapsed");
      this.setAttribute("aria-expanded", collapsed ? "false" : "true");
    });
    document.getElementById("scrim").addEventListener("click", closeRailDrawer);
    var skip = document.querySelector(".skip");
    if (skip) skip.addEventListener("click", function (e) {
      e.preventDefault();
      var m = document.getElementById("main");
      if (m) { m.setAttribute("tabindex", "-1"); m.focus(); }
    });
    var themeBtn = document.getElementById("themeToggle");
    function syncThemeBtn() {
      themeBtn.setAttribute("aria-label",
        "Theme: " + currentTheme() + " — switch to " + (effectiveTheme() === "dark" ? "light" : "dark"));
    }
    themeBtn.addEventListener("click", function () {
      setTheme(effectiveTheme() === "dark" ? "light" : "dark");
      syncThemeBtn();
    });
    syncThemeBtn();
    document.getElementById("paletteOpen").addEventListener("click", openPalette);
    document.getElementById("paletteScrim").addEventListener("click", function (e) {
      if (e.target === this) closePalette();
    });

    var inp = document.getElementById("paletteInput");
    inp.addEventListener("input", function () { renderPalette(this.value); });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); paletteIdx = Math.min(paletteIdx + 1, paletteItems.length - 1); syncPaletteSel(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); paletteIdx = Math.max(paletteIdx - 1, 0); syncPaletteSel(); }
      else if (e.key === "Enter") { e.preventDefault(); var it = paletteItems[paletteIdx]; if (it) { closePalette(); it.run(); } }
      else if (e.key === "Escape") { closePalette(); }
    });

    /* global keys: Ctrl+K / "/" palette, g-sequences */
    var gPending = false, gTimer = null;
    document.addEventListener("keydown", trapPaletteTab);

    document.addEventListener("keydown", function (e) {
      var t = e.target;
      var typing = t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA" || t.isContentEditable);

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
      if (e.key === "Escape") { closePalette(); closeRailDrawer(); return; }
      if (typing) return;
      if (e.key === "/") { e.preventDefault(); openPalette(); return; }

      if (gPending) {
        var map = { d: "dashboard", c: "calculations", p: "projects", m: "materials", h: "help", o: "output", s: "settings", z: "sizing" };
        var target = map[e.key.toLowerCase()];
        gPending = false; clearTimeout(gTimer);
        if (target) { e.preventDefault(); go(target); }
        return;
      }
      if (e.key.toLowerCase() === "g") {
        gPending = true;
        gTimer = setTimeout(function () { gPending = false; }, 1200);
      }
    });

    go("dashboard");
  }

  return {
    boot: boot, go: go, el: el, esc: esc, fmt: fmt, comma: comma, toast: toast,
    dl: dl, card: card, pageHead: pageHead, betaStrip: betaStrip, statCard: statCard,
    dcrClass: dcrClass, dcrBadge: dcrBadge, gradeRank: gradeRank, effectiveTheme: effectiveTheme, getProfile: getProfile, exportCalcs: exportCalcs, inputsFor: inputsFor,
    VIEWS: VIEWS, state: state, SHEETS: SHEETS, PROJECTS: PROJECTS, PROFILES: PROFILES, ACTIVITY: ACTIVITY,
    engine: null, solver: null, weights: null
  };
})();

</script>
<script>
/* ============================================================
   NDS 2024 ASD wood member check — simply-supported, uniformly
   loaded sawn bending member.

   Reference design values and section properties are read from
   MATDATA, extracted verbatim from the public material catalogs.
   Adjustment factors follow NDS Table 4.3.1 applicability, with
   each factor's clause printed on the sheet.

   Deliberate boundary: C_F (size factor) is NOT published in the
   material catalog, so it is a typed input flagged as unsourced.
   ============================================================ */

(function () {
  "use strict";

  /* ---- load duration, NDS Table 2.3.2 ---- */
  var CD = {
    dead:      { v: 0.90, label: "Permanent (D)" },
    live:      { v: 1.00, label: "Ten years (L)" },
    snow:      { v: 1.15, label: "Two months (S)" },
    roof_live: { v: 1.25, label: "Seven days (Lr)" }
  };

  /* ---- wet service multipliers, NDS Table 4A (dimension lumber) ---- */
  var CM_WET = { Fb: 0.85, Fv: 0.97, Fc_perp: 0.67, Fc: 0.80, E: 0.90, Emin: 0.90 };

  /* ---- deflection limits, IBC Table 1604.3 ----
     The "not supporting a ceiling" roof row is L/180 in BOTH columns;
     L/240 belongs to the row supporting a non-plaster ceiling. */
  var DEFL = {
    floor:            { live: 360, total: 240, cite: "IBC T1604.3 · floor members" },
    roof_plaster:     { live: 360, total: 240, cite: "IBC T1604.3 · roof, plaster ceiling" },
    roof_nonplaster:  { live: 240, total: 180, cite: "IBC T1604.3 · roof, non-plaster ceiling" },
    roof_no_ceiling:  { live: 180, total: 180, cite: "IBC T1604.3 · roof, no ceiling" }
  };

  var LIMITS = [
    "Simply-supported single span, uniformly loaded",
    "Sawn dimension lumber only — timbers, glulam, SCL, CLT and I-joists are out of scope",
    "Gravity combinations only — no wind, seismic, uplift or lateral",
    "No cantilevers, continuous spans, notches, holes or camber",
    "No fire design, vibration, ponding or connection design",
    "ASD only — LRFD not implemented",
    "Creep (K_cr, NDS §3.5.2) not applied to long-term deflection",
    "C_b = 1.0 — bearings are at member ends, so NDS §3.10.4 does not apply",
    "C_F is a typed input; it is not carried in the material catalog"
  ];

  /* ---------- lookups ---------- */

  function findSection(nominal) {
    if (!window.MATDATA) return null;
    /* Dimension lumber only. Table 4A values do not apply to timbers or
       beams & stringers, and the catalog carries no Table 4D. */
    return MATDATA.sections.filter(function (s) {
      return s.nominal === nominal && s.size_class === "Dimension lumber";
    })[0] || null;
  }

  /* Nominal width → dressed depth, read from the Table 1B payload itself rather
     than computed. The S4S dry allowance is not a single constant: nominal widths
     through 6" dress to (n − 1/2), 8" and wider to (n − 3/4).

     Only the dimension-lumber and board rows may seed this map. Timbers dress to
     (n − 1/2) at every width — 8x8 is 7.5 deep where 2x8 is 7.25 — so letting the
     timber rows in would shift the map by 1/4 in and silently hide the Table 4B
     rows keyed '8" wide' / '10" wide' / '12" wide'. Table 4A and 4B size classes
     describe dimension lumber, so dimension lumber is what the map is built from. */
  var DRESSED = null;
  function dressedDepth(nominalWidth) {
    if (!DRESSED) {
      DRESSED = {};
      ((window.MATDATA && MATDATA.sections) || []).forEach(function (s) {
        if (s.size_class !== "Dimension lumber" && s.size_class !== "Boards") return;
        var m = /^(\d+)x(\d+)$/.exec(s.nominal || "");
        if (m) DRESSED[m[2]] = s.d_in;      /* 1x10, 2x10, 3x10, 4x10 all dress to 9.25 */
      });
    }
    var v = DRESSED[String(nominalWidth)];
    if (v !== undefined) return v;
    /* outside the catalog: PS 20 dry-dressed allowance */
    return nominalWidth < 8 ? nominalWidth - 0.5 : nominalWidth - 0.75;
  }

  /* Size-class strings in Table 4A/4B are things like:
     '2" & wider', '2" - 4" wide', '2"-4" thick', '5" - 6" wide', '12" wide' …
     They are written in NOMINAL widths; `d` arrives dressed, so every comparison
     goes through dressedDepth(). Getting this wrong silently hides whole rows —
     Table 4B's Southern Pine 2x4 and 2x6 columns are the ones that disappear. */
  /* "2-1/2" in a size class is two and a half inches, not two minus a half */
  function nominalNum(txt) {
    var m = /^(\d+)(?:-(\d+)\/(\d+))?$/.exec(String(txt).trim());
    if (!m) return Number(txt);
    return Number(m[1]) + (m[2] ? Number(m[2]) / Number(m[3]) : 0);
  }
  function dressedFrom(nominal) {
    return nominal < 8 ? nominal - 0.5 : nominal - 0.75;
  }

  function classCoversDepth(sizeClass, d, b) {
    if (!sizeClass) return false;
    var s = sizeClass.toLowerCase();
    var EPS = 0.01;

    var wider = s.match(/(\d+)\s*["”]?\s*&\s*wider/);
    if (wider) return d >= dressedDepth(Number(wider[1])) - EPS;

    var range = s.match(/(\d+)\s*["”]?\s*-\s*(\d+)\s*["”]?\s*wide/);
    if (range) {
      var lo = dressedDepth(Number(range[1])), hi = dressedDepth(Number(range[2]));
      return d >= lo - EPS && d <= hi + EPS;
    }

    var exact = s.match(/^(\d+)\s*["”]?\s*wide/);
    if (exact) return Math.abs(d - dressedDepth(Number(exact[1]))) < EPS;

    /* Thickness descriptors do not constrain DEPTH — but they do constrain
       BREADTH, and treating them as a blanket match let a 1.5"-thick 2x10 read
       its values off Table 4B's '2-1/2" - 4" thick' row. When the caller tells
       us the breadth, honour it. */
    var thick = s.match(/(\d+(?:-\d+\/\d+)?)\s*["”]?\s*(?:-\s*(\d+(?:-\d+\/\d+)?)\s*["”]?\s*)?(?:&\s*thicker\s*)?thick/);
    if (thick) {
      if (b === undefined || b === null) return true;
      var lo = dressedFrom(nominalNum(thick[1]));
      if (b < lo - EPS) return false;
      if (thick[2]) {
        var hi = dressedFrom(nominalNum(thick[2]));
        if (b > hi + EPS) return false;
      }
      return true;
    }
    return false;
  }

  function findValues(species, grade, depth, breadth) {
    if (!window.MATDATA) return null;
    var sp = MATDATA.southern_pine.records || [];
    var isSP = sp.some(function (r) { return r.species === species; });
    var pool = isSP ? sp : MATDATA.species_grades;

    var exact = pool.filter(function (r) { return r.species === species && r.grade === grade; });
    if (!exact.length) return null;

    if (depth === undefined) return exact[0];

    /* pick the record whose size class actually covers this depth —
       never silently fall back to a narrower class */
    var fit = exact.filter(function (r) { return classCoversDepth(r.size_class, depth, breadth); });
    if (!fit.length) return null;

    /* prefer the most specific (narrowest) descriptor */
    fit.sort(function (a, b) {
      var aw = /wider/i.test(a.size_class) ? 1 : 0, bw = /wider/i.test(b.size_class) ? 1 : 0;
      return aw - bw;
    });
    return fit[0];
  }

  function isSouthernPine(species) {
    if (!window.MATDATA) return false;
    return (MATDATA.southern_pine.records || []).some(function (r) { return r.species === species; });
  }

  function speciesList() {
    if (!window.MATDATA) return [];
    var seen = {}, out = [];
    function add(species, grade) {
      if (!seen[species]) { seen[species] = []; out.push(species); }
      if (seen[species].indexOf(grade) === -1) seen[species].push(grade);
    }
    MATDATA.species_grades.forEach(function (r) {
      /* Table 4A tabulates one row per grade across all widths; the '2" & wider'
         descriptor is that row. Filtering to it dedupes the list. */
      if (!/wider/i.test(r.size_class || "")) return;
      add(r.species, r.grade);
    });
    /* Table 4B is tabulated per nominal width instead, so there is no single
       '& wider' row to filter on — collect Southern Pine across every width.
       Leaving it out made the species that frames most of the Southeast
       unselectable even though the engine knew how to design it. */
    ((MATDATA.southern_pine && MATDATA.southern_pine.records) || []).forEach(function (r) {
      add(r.species, r.grade);
    });
    out.sort();
    return out.map(function (sp) { seen[sp].sort(); return { species: sp, grades: seen[sp] }; });
  }

  function sizeList() {
    if (!window.MATDATA) return [];
    return MATDATA.sections
      .filter(function (s) { return s.size_class === "Dimension lumber"; })
      .map(function (s) { return s.nominal; });
  }

  /* ---------- C_F, size factor ----------
     The catalog carries no published Table 4A size-factor table; what it does
     carry is the per-record helper the wet/PT seed uses to test the C_M
     thresholds, which the seed itself flags as threshold-only. sizeFactor()
     resolves a C_F for a candidate section and says exactly where the number
     came from, so nothing silently passes as sourced.

     Three outcomes:
       table_4b     Southern Pine — C_F is already inside the tabulated value.
       repo_partial the repo's threshold helper covers this cell.
       held         nothing covers it; C_F is held at 1.00 and flagged.
     plus `refuse`, for the one case where holding at 1.00 cannot be shown to be
     conservative: nominal widths of 14 in and wider, where Table 4A publishes a
     size factor below 1.00 that the catalog does not carry (gap register #1). */

  var CF_ROW = {
    "Select Structural": "SS / No.1 / No.2 / No.3",
    "No. 1": "SS / No.1 / No.2 / No.3",
    "No. 2": "SS / No.1 / No.2 / No.3",
    "No. 3": "SS / No.1 / No.2 / No.3",
    "Stud": "Stud"
  };

  function sizeFactor(species, grade, nominal) {
    if (isSouthernPine(species)) {
      return { CF: 1, basis: "table_4b", sourced: true, refuse: false,
               note: "Table 4B is tabulated per width — the size factor is already in the value" };
    }
    var sec = findSection(nominal);
    var m = /^(\d+)x(\d+)$/.exec(nominal || "");
    var width = m ? Number(m[2]) : null;

    if (width !== null && width >= 14) {
      return { CF: 1, basis: "held", sourced: false, refuse: true,
               note: "Table 4A publishes a size factor below 1.00 at 14\" and wider and the catalog does not carry it — holding C_F at 1.00 would be unconservative (gap #1)" };
    }
    var tbl = (window.MATDATA && MATDATA.size_factors_CF && MATDATA.size_factors_CF.partial_from_repo) || null;
    var row = tbl && tbl.by_grade_category && tbl.by_grade_category[CF_ROW[grade]];
    var cell = row && sec && row[nominal];

    /* the repo helper is the 2"-thick column only */
    if (cell && sec && Math.abs(sec.b_in - 1.5) < 0.01 && isFinite(cell.Fb)) {
      return { CF: cell.Fb, basis: "repo_partial", sourced: false, refuse: false,
               note: "repo threshold helper · " + (tbl.source_field || "") +
                     " · declared " + (tbl.declared_purpose || "threshold use only") };
    }
    return { CF: 1, basis: "held", sourced: false, refuse: false,
             note: sec && Math.abs(sec.b_in - 1.5) > 0.01
               ? "catalog covers the 2\"-thick column only — C_F held at 1.00, conservative for thicker stock"
               : "grade not covered by the catalog helper — C_F held at 1.00" };
  }

  /* ---------- beam stability, NDS §3.3.3 ---------- */

  function beamStability(lu_in, d, b, FbStar, EminPrime) {
    if (!lu_in || lu_in <= 0) {
      return { CL: 1, note: "Compression edge continuously braced — C_L = 1.0", RB: null };
    }
    var ratio = lu_in / d, le;
    if (ratio < 7) le = 2.06 * lu_in;
    else if (ratio <= 14.3) le = 1.63 * lu_in + 3 * d;
    else le = 1.84 * lu_in;

    var RB = Math.sqrt(le * d / (b * b));
    if (RB > 50) {
      return { CL: 0, RB: RB, invalid: true, note: "R_B = " + RB.toFixed(1) + " exceeds 50 — not permitted (§3.3.3.7)" };
    }
    var FbE = 1.20 * EminPrime / (RB * RB);
    var r = FbE / FbStar;
    var a = (1 + r) / 1.9;
    var CL = a - Math.sqrt(a * a - r / 0.95);
    return { CL: CL, RB: RB, FbE: FbE, le: le, ratio: ratio, note: null };
  }

  /* ---------- the check ---------- */

  function run(inp) {
    var warnings = [];

    /* ---- input validation: never compute on garbage ---- */
    var span = Number(inp.span), spacing = Number(inp.spacing);
    var D = Number(inp.dead), L = Number(inp.live), Lr = Number(inp.roofLoad);
    if (!isFinite(D)) D = 0;
    if (!isFinite(L)) L = 0;
    if (!isFinite(Lr)) Lr = 0;

    function bad(msg) {
      return { error: true, message: msg, checks: [], warnings: warnings,
               governing: { name: "—", dcr: NaN, combo: "—" }, basis: "—" };
    }
    if (!isFinite(span) || span <= 0) return bad("Span must be greater than zero.");
    if (!isFinite(spacing) || spacing <= 0) return bad("Spacing must be greater than zero.");
    if (D < 0 || L < 0 || Lr < 0) return bad("Loads cannot be negative.");

    var sec = findSection(inp.size);
    if (!sec) return bad("No dimension-lumber section properties for " + inp.size + ". Timbers and beams & stringers are out of scope.");

    var d = sec.d_in, b = sec.b_in, A = sec.A_in2, S = sec.Sx_in3, I = sec.Ix_in4;

    var mat = findValues(inp.species, inp.grade, d, b);
    if (!mat) {
      return bad("No reference design values for " + inp.species + " " + inp.grade +
                 " at " + d.toFixed(2) + " in depth. That grade is not tabulated for this size class.");
    }
    var v = mat.values_psi;

    /* ---- C_F ----
       "auto" resolves C_F from the catalog for THIS depth. Anything that walks
       the depth ladder — the sizing solver, or a user stepping sizes on the
       sheet — must use it: a C_F typed for a 2x10 is simply wrong on a 2x6. */
    var CF, cfSrc = null;
    if (inp.CF === "auto") {
      cfSrc = sizeFactor(inp.species, inp.grade, inp.size);
      if (cfSrc.refuse) {
        return bad("C_F cannot be resolved for " + inp.size + " — " + cfSrc.note +
                   ". Enter C_F from NDS-S Table 4A to check this size.");
      }
      CF = cfSrc.CF;
      if (cfSrc.basis === "held") warnings.push("C_F held at 1.00 — " + cfSrc.note + ".");
    } else {
      CF = (inp.CF === undefined || inp.CF === null) ? 1 : Number(inp.CF);
      if (!isFinite(CF) || CF <= 0) { CF = 1; warnings.push("C_F was not a positive number — reset to 1.00."); }
    }

    var spFlag = isSouthernPine(inp.species);
    if (spFlag && CF !== 1) {
      CF = 1;
      warnings.push("Southern Pine (Table 4B) already incorporates the size factor — C_F forced to 1.00.");
    }

    /* ---- C_r, NDS §4.3.9: dimension lumber, 3+ members, ≤24 in o.c. ---- */
    var Cr = 1;
    if (inp.repetitive) {
      if (spacing > 24) warnings.push("Repetitive-member factor not applied: spacing exceeds 24 in o.c. (§4.3.9).");
      else if (b > 4) warnings.push("Repetitive-member factor not applied: member thicker than 4 in (§4.3.9).");
      else Cr = 1.15;
    }

    /* ---- C_M, with the Table 4A threshold exception ---- */
    var wet = !!inp.wet;
    var CM = {
      Fb: wet ? (v.Fb * CF <= 1150 ? 1.00 : CM_WET.Fb) : 1,
      Fv: wet ? CM_WET.Fv : 1,
      Fc_perp: wet ? CM_WET.Fc_perp : 1,
      E: wet ? CM_WET.E : 1,
      Emin: wet ? CM_WET.Emin : 1
    };
    var CMnote = wet
      ? (v.Fb * CF <= 1150 ? "MC > 19% · (F_b)(C_F) ≤ 1150 → C_M = 1.0" : "MC > 19% · Table 4A")
      : "dry service";

    var Ct = 1;                                   /* NDS Table 2.3.3, normal temperature */
    var Cb = 1;                                   /* end bearing — §3.10.4 does not apply */

    var Eprime = v.E * CM.E * Ct;
    var EminPrime = v.Emin * CM.Emin * Ct;

    /* ---- load combinations, ASCE 7 §2.4 ----
       C_D is set by the shortest-duration load of NONZERO magnitude. */
    var roofType = inp.roofType === "roof_live" ? "roof_live" : "snow";
    var roofCD = roofType === "snow" ? CD.snow : CD.roof_live;
    var roofName = roofType === "snow" ? "S" : "Lr";

    var combos = [{ id: "D", label: "D", psf: D, cd: CD.dead, live: 0 }];

    if (L > 0) combos.push({ id: "D+L", label: "D + L", psf: D + L, cd: CD.live, live: L });
    if (Lr > 0) combos.push({ id: "D+R", label: "D + " + roofName, psf: D + Lr, cd: roofCD, live: Lr });
    if (L > 0 && Lr > 0) {
      /* combination 4 — the one that governs when both act */
      combos.push({
        id: "D+.75L+.75R",
        label: "D + 0.75L + 0.75" + roofName,
        psf: D + 0.75 * L + 0.75 * Lr,
        cd: roofCD,                 /* shortest duration present */
        live: 0.75 * L + 0.75 * Lr
      });
    }

    var checks = [];
    var strength = { name: "—", dcr: -Infinity, combo: "—" };
    var service  = { name: "—", dcr: -Infinity, combo: "—" };

    function consider(name, dcr, combo, lines, detail, kind) {
      checks.push({ name: name, dcr: dcr, combo: combo, lines: lines, detail: detail || null, kind: kind });
      if (!isFinite(dcr)) return;
      var tgt = kind === "service" ? service : strength;
      if (dcr > tgt.dcr) {
        tgt.name = name; tgt.dcr = dcr; tgt.combo = combo;
      }
    }

    /* ---------- bending ---------- */
    var best = null;
    combos.forEach(function (c) {
      var w = c.psf * spacing / 12;
      var M = w * span * span / 8;
      var fb = M * 12 / S;
      var FbStar = v.Fb * c.cd.v * CM.Fb * Ct * CF * Cr;
      var stab = beamStability(inp.braced ? 0 : span * 12, d, b, FbStar, EminPrime);
      var Fbp = FbStar * stab.CL;
      var dcr = Fbp > 0 ? fb / Fbp : Infinity;
      if (!best || dcr > best.dcr) best = { dcr: dcr, combo: c.label, w: w, M: M, fb: fb, Fbp: Fbp, cd: c.cd, stab: stab };
    });

    consider("Bending", best.dcr, best.combo, [
      "w = " + f(best.w, 1) + " plf",
      "M = wL²/8 = " + f(best.M, 0) + " lb-ft = " + f(best.M * 12, 0) + " lb-in",
      "f_b = M/S = " + f(best.M * 12, 0) + " / " + f(S, 2) + " = " + f(best.fb, 0) + " psi",
      "F_b′ = " + f(v.Fb, 0) + " × C_D " + f(best.cd.v, 2) + " × C_M " + f(CM.Fb, 2) +
        " × C_t " + f(Ct, 2) + " × C_L " + f(best.stab.CL, 3) + " × C_F " + f(CF, 2) +
        " × C_r " + f(Cr, 2) + " = " + f(best.Fbp, 0) + " psi",
      "DCR = " + f(best.fb, 0) + " / " + f(best.Fbp, 0) + " = " + f(best.dcr, 3)
    ], {
      factors: [
        { k: "F_b (reference)", v: comma(v.Fb) + " psi", cite: mat.size_class, src: true },
        { k: "× C_D · load duration", v: f(best.cd.v, 2), cite: "Table 2.3.2 · " + best.cd.label },
        { k: "× C_M · wet service", v: f(CM.Fb, 2), cite: CMnote },
        { k: "× C_t · temperature", v: f(Ct, 2), cite: "Table 2.3.3 · normal" },
        { k: "× C_L · beam stability", v: f(best.stab.CL, 3), cite: best.stab.note || ("§3.3.3 · R_B " + f(best.stab.RB, 1)) },
        { k: "× C_F · size factor", v: f(CF, 2),
          cite: spFlag ? "built into Table 4B" : (cfSrc ? cfSrc.note : "typed — not in catalog"),
          typed: !spFlag && (!cfSrc || cfSrc.basis === "held"),
          src: spFlag || (cfSrc && cfSrc.basis === "repo_partial") },
        { k: "× C_r · repetitive", v: f(Cr, 2), cite: Cr > 1 ? "§4.3.9" : "not applied" },
        { k: "F_b′ (adjusted)", v: comma(best.Fbp) + " psi", total: true },
        { k: "f_b (applied)", v: comma(best.fb) + " psi" }
      ]
    }, "strength");

    /* ---------- shear ---------- */
    var sh = null;
    combos.forEach(function (c) {
      var w = c.psf * spacing / 12;
      var V = w * span / 2;
      var fv = 1.5 * V / A;
      var Fvp = v.Fv * c.cd.v * CM.Fv * Ct;
      var dcr = fv / Fvp;
      if (!sh || dcr > sh.dcr) sh = { dcr: dcr, combo: c.label, V: V, fv: fv, Fvp: Fvp, cd: c.cd };
    });

    consider("Shear", sh.dcr, sh.combo, [
      "V = wL/2 = " + f(sh.V, 0) + " lb  (taken at the support; no §3.4.3.1 reduction to d)",
      "f_v = 1.5V/A = " + f(sh.fv, 1) + " psi",
      "F_v′ = " + f(v.Fv, 0) + " × C_D " + f(sh.cd.v, 2) + " × C_M " + f(CM.Fv, 2) + " = " + f(sh.Fvp, 0) + " psi",
      "DCR = " + f(sh.dcr, 3)
    ], {
      factors: [
        { k: "F_v (reference)", v: comma(v.Fv) + " psi", cite: "Table 4A", src: true },
        { k: "× C_D", v: f(sh.cd.v, 2), cite: "Table 2.3.2" },
        { k: "× C_M", v: f(CM.Fv, 2), cite: wet ? "MC > 19%" : "dry service" },
        { k: "F_v′", v: comma(sh.Fvp) + " psi", total: true },
        { k: "f_v (applied)", v: f(sh.fv, 1) + " psi" }
      ]
    }, "strength");

    /* ---------- deflection (serviceability) ---------- */
    var use = DEFL[inp.memberUse] || DEFL.floor;
    var L_in = span * 12;
    var wLive = (L + Lr) * spacing / 12 / 12;          /* lb/in — variable load only */
    var wTot = (D + L + Lr) * spacing / 12 / 12;
    var dL = 5 * wLive * Math.pow(L_in, 4) / (384 * Eprime * I);
    var dT = 5 * wTot * Math.pow(L_in, 4) / (384 * Eprime * I);
    var aL = L_in / use.live, aT = L_in / use.total;

    consider("Deflection (live)", dL / aL, "variable load", [
      "Δ_L = 5wL⁴/(384 E′I) = " + f(dL, 3) + " in",
      "allowable = L/" + use.live + " = " + f(aL, 3) + " in",
      "actual = L/" + f(L_in / dL, 0),
      "DCR = " + f(dL / aL, 3)
    ], {
      factors: [
        { k: "E (reference)", v: comma(v.E) + " psi", cite: "Table 4A", src: true },
        { k: "× C_M", v: f(CM.E, 2), cite: wet ? "MC > 19%" : "dry service" },
        { k: "E′", v: comma(Eprime) + " psi", total: true },
        { k: "I", v: f(I, 2) + " in⁴", cite: "Table 1B", src: true },
        { k: "Allowable L/" + use.live, v: f(aL, 3) + " in", cite: use.cite }
      ]
    }, "service");

    consider("Deflection (total)", dT / aT, "D + variable", [
      "Δ_TL = " + f(dT, 3) + " in",
      "allowable = L/" + use.total + " = " + f(aT, 3) + " in",
      "DCR = " + f(dT / aT, 3)
    ], {
      factors: [
        { k: "Δ_TL", v: f(dT, 3) + " in" },
        { k: "Allowable L/" + use.total, v: f(aT, 3) + " in", cite: use.cite },
        { k: "Creep K_cr", v: "not applied", cite: "§3.5.2 — see scope" }
      ]
    }, "service");

    /* ---------- bearing ---------- */
    var lb = Number(inp.bearing);
    if (!isFinite(lb) || lb <= 0) { lb = 1.5; warnings.push("Bearing length was not a positive number — assumed 1.50 in."); }
    var R = 0, Rc = "—";
    combos.forEach(function (c) {
      var r = (c.psf * spacing / 12) * span / 2;
      if (r > R) { R = r; Rc = c.label; }
    });
    var fcp = R / (b * lb);
    var Fcpp = v.Fc_perp * CM.Fc_perp * Ct * Cb;

    consider("Bearing (Fc⊥)", fcp / Fcpp, Rc, [
      "R = " + f(R, 0) + " lb on " + f(lb, 2) + " in of bearing",
      "f_c⊥ = R/(b·l_b) = " + f(R, 0) + " / (" + f(b, 3) + " × " + f(lb, 2) + ") = " + f(fcp, 0) + " psi",
      "F_c⊥′ = " + f(v.Fc_perp, 0) + " × C_M " + f(CM.Fc_perp, 2) + " × C_b " + f(Cb, 2) + " = " + f(Fcpp, 0) + " psi",
      "DCR = " + f(fcp / Fcpp, 3)
    ], {
      factors: [
        { k: "F_c⊥ (reference)", v: comma(v.Fc_perp) + " psi", cite: "Table 4A", src: true },
        { k: "× C_M", v: f(CM.Fc_perp, 2), cite: wet ? "MC > 19%" : "dry service" },
        { k: "× C_b · bearing length", v: f(Cb, 2), cite: "§3.10.4 does not apply at a member end" },
        { k: "C_D", v: "not applicable", cite: "Table 4.3.1" },
        { k: "F_c⊥′", v: comma(Fcpp) + " psi", total: true }
      ]
    }, "strength");

    /* ---------- governing ---------- */
    var anyFinite = checks.some(function (c) { return isFinite(c.dcr); });
    if (!anyFinite) return bad("The check could not be evaluated with these inputs.");

    var governing = (service.dcr > strength.dcr)
      ? { name: service.name, dcr: service.dcr, combo: service.combo, kind: "service" }
      : { name: strength.name, dcr: strength.dcr, combo: strength.combo, kind: "strength" };

    return {
      error: false,
      section: sec, material: mat, checks: checks, warnings: warnings,
      governing: governing,
      strength: strength, service: service,
      basis: "NDS 2024 ASD · ASCE 7 §2.4 · " + use.cite,
      combos: combos.map(function (c) { return { label: c.label, cd: c.cd.v, cdLabel: c.cd.label, psf: c.psf }; }),
      Eprime: Eprime, EminPrime: EminPrime
    };
  }

  function f(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return "—";
    return Number(n).toFixed(d === undefined ? 2 : d);
  }
  function comma(n) {
    if (n === null || n === undefined || !isFinite(n)) return "—";
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  FM.engine = {

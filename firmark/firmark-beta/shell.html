<div class="shell" id="shell">

  <header class="topbar">
    <button class="tb-btn" id="railToggle" aria-label="Toggle sidebar" aria-expanded="true">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 3.5h12M2 8h12M2 12.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <span class="tb-brand">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="21" height="21" rx="2.5" stroke="#C79A2B" stroke-width="1.8"/>
        <path d="M6 18V7.5h9" stroke="#EAF1F8" stroke-width="2.2" stroke-linecap="square"/>
        <path d="M6 12.6h6.4" stroke="#EAF1F8" stroke-width="2.2" stroke-linecap="square"/>
        <circle cx="17.4" cy="16.4" r="2.1" fill="#C79A2B"/>
      </svg>
      Firmark
    </span>
    <span class="tb-env">Beta</span>

    <button class="tb-search" id="paletteOpen" aria-label="Search projects, pages, actions" aria-haspopup="dialog" aria-expanded="false">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>Search projects, pages, actions…</span>
      <span class="kbd">Ctrl K</span>
    </button>

    <div class="tb-right">
      <button class="tb-btn" id="themeToggle" aria-label="Toggle light or dark theme">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="avatar" title="J. Haberer · PE of record">JH</span>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Sidebar"></nav>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div class="main-inner">
      <div class="view active" id="view-dashboard"></div>
      <div class="view" id="view-projects"></div>
      <div class="view" id="view-project"></div>
      <div class="view" id="view-calculations"></div>
      <div class="view" id="view-sheet"></div>
      <div class="view" id="view-sizing"></div>
      <div class="view" id="view-policies"></div>
      <div class="view" id="view-materials"></div>
      <div class="view" id="view-output"></div>
      <div class="view" id="view-admin"></div>
      <div class="view" id="view-settings"></div>
      <div class="view" id="view-help"></div>
    </div>
  </main>
</div>

<div class="palette-scrim" id="paletteScrim">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette" id="paletteDialog">
    <input class="palette-input" id="paletteInput" type="text" placeholder="Jump to a page, project, or action…"
           autocomplete="off" spellcheck="false" aria-label="Command palette search"
           role="combobox" aria-expanded="true" aria-autocomplete="list"
           aria-controls="paletteList" aria-activedescendant="">
    <div class="palette-list" id="paletteList" role="listbox" aria-label="Results"></div>
    <div class="palette-foot">
      <span><span class="kbd kbd-light">&uarr;</span> <span class="kbd kbd-light">&darr;</span> move</span>
      <span><span class="kbd kbd-light">Enter</span> run</span>
      <span><span class="kbd kbd-light">Esc</span> close</span>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
